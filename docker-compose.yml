# Self-hosted stack, WordPress-style: one app container + Postgres, plus the
# street-routing OSRM servers (car, bike, foot) the editor's stop routing uses.
# Copy uploader/.env.example to .env (set POSTGRES_PASSWORD, PUBLIC_BASE_URL, IMG_HOST,
# IMAGE_TAG and OSRM_PBF_URLS; see docs/install.md). Then:
#   docker compose pull && docker compose up -d     # run a released GHCR image
# IMAGE_TAG must identify a release published under wanderlust-studio (0.18.1 or
# later) or `local`; there is no default. See README.md before upgrading.
# Compose only RUNS the published image; to rebuild it, `docker build` from the
# repo root (bases default to DHI — see Dockerfile).

# @ai-context docs/superpowers/specs/2026-11-03-osrm-compose-routing-design.md
x-osrm-server: &osrm-server
  image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
  # No host port: only `app` reaches it, as an exact ROUTING_INTERNAL_ORIGINS origin.
  depends_on:
    osrm-prepare:
      condition: service_completed_successfully
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    # The image has no curl/wget; bash's /dev/tcp proves osrm-routed accepts connections.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 60s
  restart: unless-stopped

services:
  app:
    image: ghcr.io/laboef1900/wanderlust-studio:${IMAGE_TAG:?set IMAGE_TAG to a published wanderlust-studio release or local after building}
    # tini as PID 1: forwards SIGTERM to node (clean shutdown handler in
    # uploader/src/main.ts) and reaps the spawned `astro build` child process.
    init: true
    ports:
      # Host TLS proxy only: the app validates the bridge gateway at hop zero (#108, #369).
      - "127.0.0.1:3000:3000"
    environment:
      # Only valid for this bridge topology. Changing networks/network_mode or
      # adding a CDN/proxy hop requires a new trust spec, not a broader allow-list.
      TRUSTED_PROXY: docker-gateway
      # Operator-only exemption from the private-address SSRF guard, for street
      # routing only: exactly these origins may be plain HTTP on this network.
      # Settings → Street routing can choose among them but never add one.
      ROUTING_INTERNAL_ORIGINS: http://osrm-car:5000,http://osrm-bike:5000,http://osrm-foot:5000
      # Image domain only (the blog domain is Settings → Site identity). No default:
      # a forgotten value must stop Compose, not publish another site's image host.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-images}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-images}}
      IMG_HOST: ${IMG_HOST:?set IMG_HOST in .env}
      # Optional passthrough: omitted stays absent, explicitly empty is invalid.
      ENCRYPTION_KEY:
    # Memory ceiling (issue #71). Without one, a spike takes the whole `app`
    # container down — blog, admin, image host and any in-flight build together.
    #
    # @ai-warning: sized as max(build, encode) + baseline, NOT their sum,
    # because uploader/src/work-lock.ts makes a site build and image encoding
    # MUTUALLY EXCLUSIVE. If that lock is ever removed, this number is wrong.
    # Native amd64/arm64 rehearsal (2026-10-29): two concurrent, synthetic
    # 6000×4000 PNG uploads and one bilingual story. Sampled whole-cgroup maxima:
    # encode 1945/1876 MiB; publish 1183/1229 MiB; idle 114/112 MiB.
    # These are bounded observations, not per-frame costs or hosting minima.
    # Keep the existing 4608 MiB ceiling conservatively; the small corpus does
    # not justify lowering it. Full methods and limitations:
    # docs/2026-10-29-clean-install-rehearsal.md
    #
    # @ai-warning: memswap_limit MUST equal mem_limit. Docker otherwise defaults
    # total swap to 2× mem_limit, so the container thrashes into swap instead of
    # being bounded — which on a small VPS is slower than an OOM and much harder
    # to diagnose. A smaller ceiling needs a separate representative-corpus
    # rehearsal, including encode concurrency; change BOTH limits together.
    mem_limit: 4608m
    memswap_limit: 4608m
    volumes:
      - ./uploader/data:/data
      # The map basemap + fonts are baked into the image (served at /map/).
      # To override with your own tileset, bind-mount it over /map-assets:ro.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # exec form: the hardened runtime has no shell
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  db:
    # major-pinned on purpose — bump only via ARCHITECTURE.md "Upgrading a Postgres major"
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-images}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-images}
    volumes:
      # postgres:18+ expects the mount at the parent dir (data lands in a
      # versioned subdirectory), enabling future in-place pg_upgrade --link.
      # @ai-warning: a pre-18 pgdata volume (created when this mounted
      # .../data) is NOT readable here — Postgres silently initdb's an EMPTY
      # cluster next to the old files. Migrate via dump-and-restore first:
      # see ARCHITECTURE.md "Upgrading a Postgres major".
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-images} -d ${POSTGRES_DB:-images}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Street routing data (#513). One-shot: downloads every OSRM_PBF_URLS extract
  # (OpenStreetMap, e.g. Geofabrik; space- or comma-separated) and merges them into
  # one region.osm.pbf in the `osrm` volume — again only when the list changes or
  # after a refresh removed /osrm/region.url (docs/install.md §4g).
  osrm-fetch:
    image: debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    # curl and osmium-tool come from Debian's signed archive, installed only when a
    # download is due (osmium has no official image; third-party images are not
    # trusted here). apt/dpkg need exactly these capabilities; the container sees
    # nothing but the rebuildable `osrm` volume.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      OSRM_PBF_URLS: ${OSRM_PBF_URLS:?set OSRM_PBF_URLS in .env to one or more HTTPS .osm.pbf extracts (see docs/install.md)}
    volumes:
      - osrm:/osrm
    entrypoint: ["sh", "-euc"]
    command:
      - |
        urls=$$(printf '%s' "$$OSRM_PBF_URLS" | tr ',' ' ' | xargs -n1)
        [ -n "$$urls" ] || { echo "osrm-fetch: OSRM_PBF_URLS lists no extract" >&2; exit 1; }
        if [ -f /osrm/region.osm.pbf ] && [ -f /osrm/region.stamp ] && [ "$$(cat /osrm/region.url 2>/dev/null)" = "$$urls" ]; then
          echo "osrm-fetch: map extracts are current"; exit 0
        fi
        echo "osrm-fetch: installing curl and osmium-tool"
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl osmium-tool >/dev/null
        rm -rf /osrm/download.tmp; mkdir /osrm/download.tmp
        n=0
        for url in $$urls; do
          n=$$((n + 1)); echo "osrm-fetch: downloading extract $$n"
          curl -fsSL --proto =https --proto-redir =https --retry 3 -o "/osrm/download.tmp/$$n.osm.pbf" "$$url"
        done
        if [ "$$n" -eq 1 ]; then
          mv /osrm/download.tmp/1.osm.pbf /osrm/region.osm.pbf.part
        else
          # One graph per mode covers every region; legs between regions that
          # share no road come back NoRoute and become flagged straight legs.
          echo "osrm-fetch: merging $$n extracts"
          osmium merge --overwrite -f pbf -o /osrm/region.osm.pbf.part /osrm/download.tmp/*.osm.pbf
        fi
        rm -rf /osrm/download.tmp
        mv /osrm/region.osm.pbf.part /osrm/region.osm.pbf
        # The stamp names this exact download, so osrm-prepare also rebuilds after a
        # refresh of the same list. Written before region.url: a crash in between re-downloads.
        printf '%s %s\n' "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$(printf '%s' "$$urls" | tr '\n' ' ')" > /osrm/region.stamp
        printf '%s' "$$urls" > /osrm/region.url
    restart: "no"

  # One-shot: builds the MLD routing graph per travel mode, one mode at a time
  # (peak RAM is one osrm-extract), only when the downloaded extract changed.
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian@sha256:e1929ae2818226284d7ef007329098a30851c11528ab3712bc9c8d68da78278b
    depends_on:
      osrm-fetch:
        condition: service_completed_successfully
    # Bounded (issue #71 reasoning): an oversized list must OOM this one-shot,
    # never the host's Postgres or app. Measured peaks: Costa Rica + Ecuador
    # (158 MB) 3.5 GB; Mexico + both (780 MB) over 12 GB. Raise
    # OSRM_PREPARE_MEM_LIMIT for larger lists. memswap_limit MUST equal
    # mem_limit, or Docker grants 2× swap and the build thrashes instead of failing.
    mem_limit: ${OSRM_PREPARE_MEM_LIMIT:-4g}
    memswap_limit: ${OSRM_PREPARE_MEM_LIMIT:-4g}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - osrm:/osrm
    entrypoint: ["bash", "-euo", "pipefail", "-c"]
    command:
      - |
        for pair in car:car bike:bicycle foot:foot; do
          mode=$${pair%%:*}; profile=$${pair#*:}; dir=/osrm/$$mode
          if [ -f "$$dir/ready" ] && cmp -s /osrm/region.stamp "$$dir/ready"; then
            echo "osrm-prepare: $$mode graph is current"; continue
          fi
          echo "osrm-prepare: building the $$mode graph"
          rm -rf "$$dir.tmp"; mkdir -p "$$dir.tmp"
          ln /osrm/region.osm.pbf "$$dir.tmp/region.osm.pbf"
          osrm-extract -p "/opt/$$profile.lua" "$$dir.tmp/region.osm.pbf"
          osrm-partition "$$dir.tmp/region.osrm"
          osrm-customize "$$dir.tmp/region.osrm"
          rm "$$dir.tmp/region.osm.pbf"
          cp /osrm/region.stamp "$$dir.tmp/ready"
          rm -rf "$$dir"; mv "$$dir.tmp" "$$dir"
        done
    restart: "no"

  # --mmap=1: the graph stays on disk and the kernel pages in only what queries
  # touch (evictable page cache), so unused regions cost no resident memory.
  osrm-car:
    <<: *osrm-server
    command: ["osrm-routed", "--algorithm", "mld", "--mmap=1", "/osrm/car/region.osrm"]
    volumes:
      - osrm:/osrm:ro

  osrm-bike:
    <<: *osrm-server
    command: ["osrm-routed", "--algorithm", "mld", "--mmap=1", "/osrm/bike/region.osrm"]
    volumes:
      - osrm:/osrm:ro

  osrm-foot:
    <<: *osrm-server
    command: ["osrm-routed", "--algorithm", "mld", "--mmap=1", "/osrm/foot/region.osrm"]
    volumes:
      - osrm:/osrm:ro

volumes:
  pgdata:
  # Downloaded OpenStreetMap extract + prepared routing graphs; rebuildable, not backed up.
  osrm:
