<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Posts · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="posts-page">
    <header class="cms-page-meta">
      <h1>Posts</h1>
      <p class="lede">Manage DE/EN post pairs — create drafts, edit content, and publish to the live blog.</p>
      <div class="cms-page-actions">
        <button id="exportAll" type="button" class="btn-secondary">Export MDX to server backup</button>
        <a id="newPost" href="/admin/editor.html" class="btn-new">New post</a>
      </div>
    </header>

    <main>
      <section class="card">
        <p id="out" class="page-status" role="status"></p>

        <div class="posts-filters" id="filters" hidden>
          <div class="posts-filters-main">
            <label class="filter-field filter-search">
              <span>Search</span>
              <input id="fSearch" type="search" placeholder="Title, slug or country" autocomplete="off" />
            </label>
            <label class="filter-field">
              <span>Status</span>
              <select id="fStatus">
                <option value="">All statuses</option>
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                <option value="unpublished">Unpublished changes</option>
                <option value="missing-en">EN missing</option>
              </select>
            </label>
            <label class="filter-field">
              <span>Sort</span>
              <select id="fSort">
                <option value="updated">Updated</option>
                <option value="date">Trip date</option>
                <option value="title">Title (DE)</option>
              </select>
            </label>
          </div>
          <button type="button" id="fMore" class="btn-link filter-reset" aria-expanded="false" aria-controls="fExtra">More filters</button>
          <button id="fReset" class="btn-link filter-reset" type="button">Clear filters</button>
          <div class="posts-filters-extra" id="fExtra" hidden>
            <label class="filter-field">
              <span>Region</span>
              <select id="fRegion"><option value="">All</option></select>
            </label>
            <label class="filter-field">
              <span>Country</span>
              <select id="fCountry"><option value="">All</option></select>
            </label>
            <label class="filter-field">
              <span>Order</span>
              <select id="fOrder">
                <option value="desc">Descending</option>
                <option value="asc">Ascending</option>
              </select>
            </label>
          </div>
        </div>
        <!-- Status views are toggle buttons over the same state as #fStatus,
             filled by the script; hidden with the filters while nothing is loaded. -->
        <div id="statusViews" class="posts-status-tabs" role="group" hidden></div>
        <p id="resultsCount" class="posts-results" role="status"></p>


        <div class="bulk-bar" id="bulkBar" hidden>
          <span id="bulkCount" aria-live="polite"></span>
          <details id="selectionReview" class="selection-review">
            <summary>Review selection</summary>
            <ul id="selectionList"></ul>
          </details>
          <button id="clearSelection" type="button" class="btn-link">Clear selection</button>
          <button id="bulkPublish" type="button" class="btn-primary">Publish</button>
          <button id="bulkUnpublish" type="button" class="btn-secondary">Unpublish</button>
          <button id="bulkDelete" type="button" class="btn-remove">Delete</button>
        </div>

        <p id="loadMsg" class="muted" role="status">Loading posts…</p>
        <button id="retryLoad" type="button" class="btn-secondary" hidden>Retry</button>
        <table id="postsTable" class="posts-table" role="table" hidden>
          <thead role="rowgroup">
            <tr role="row">
              <th class="col-select" scope="col" role="columnheader">
                <label id="selectAllControl" class="post-select-all">
                  <input id="selectAll" type="checkbox" aria-label="Select all visible posts" />
                  <span>Select visible</span>
                </label>
              </th>
              <th class="col-thumb" scope="col" role="columnheader">Hero</th>
              <th class="col-title" scope="col" role="columnheader">Title (DE)</th>
              <th class="col-status" scope="col" role="columnheader">Status</th>
              <th id="languagesHeading" class="col-languages" scope="col" role="columnheader">Languages</th>
              <th class="col-updated" scope="col" role="columnheader">Updated</th>
              <th class="col-actions" scope="col" role="columnheader">Actions</th>
            </tr>
          </thead>
          <tbody id="postsList" role="rowgroup"></tbody>
        </table>
      </section>

    </main>

    <script src="/admin/editor-image-copy.js"></script>
    <script src="/admin/gpx-copy.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script src="/admin/posts-filter.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let me = null; // session from Auth.ensureAuthed(); buttons are hidden for
                     // non-admins, but the server enforces admin-only regardless.
      let allPosts = [];              // everything GET /posts returned
      const selected = new Set();     // translationKeys ticked in the list
      let filtersInitialized = false;
      let openMoreActions = null;
      const copy = EditorCopy.en;
      $('languagesHeading').textContent = copy.postsLanguages;

      // Status views: toggle buttons over the SAME state as the #fStatus select
      // (one source of truth — the select's value), so the URL, Edit's returnTo
      // and Clear filters need no second code path. Plain buttons with
      // aria-pressed, not role="tab": they filter one list, they do not switch panels.
      // @ai-note Each count is PostsFilter.apply over the loaded rows with every
      // CURRENT non-status filter (search, region, country) and that status —
      // "what clicking this would show", never a whole-library total.
      const STATUS_VIEWS = [
        { status: '', label: copy.postsAll },
        { status: 'draft', label: copy.postsDrafts },
        { status: 'published', label: copy.postsPublished },
        { status: 'unpublished', label: copy.postsChanges },
        { status: 'missing-en', label: copy.postsMissingEn },
      ];
      $('statusViews').setAttribute('aria-label', copy.postsStatusFilters);
      const statusViewButtons = STATUS_VIEWS.map((view) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'posts-status-tab';
        button.setAttribute('data-status', view.status);
        button.setAttribute('aria-pressed', 'false');
        const label = document.createElement('span');
        label.className = 'posts-status-label';
        label.textContent = view.label;
        const count = document.createElement('span');
        count.className = 'posts-status-count';
        button.appendChild(label);
        button.appendChild(count);
        button.addEventListener('click', () => {
          $('fStatus').value = view.status;
          render(true);
        });
        $('statusViews').appendChild(button);
        return { view, button, count };
      });

      function syncStatusViews() {
        const filters = currentFilters();
        for (const { view, button, count } of statusViewButtons) {
          button.setAttribute('aria-pressed', filters.status === view.status ? 'true' : 'false');
          count.textContent = String(PostsFilter.apply(allPosts, { ...filters, status: view.status }).length);
        }
      }

      function describeBuild(build) {
        if (!build) return '';
        return build.ok ? ' Site rebuilt.' : ' Rebuild failed: ' + build.error;
      }

      // Draft slugs may still be empty — only render "(de / en)" when set.
      function slugSuffix(p) {
        const slugs = [p.slugDe, p.slugEn].filter(Boolean).join(' / ');
        return slugs ? ' (' + slugs + ')' : '';
      }

      function currentFilters() {
        return {
          q: $('fSearch').value,
          status: $('fStatus').value,
          region: $('fRegion').value,
          country: $('fCountry').value,
          sort: $('fSort').value,
          order: $('fOrder').value,
        };
      }

      function setFilterControls(state) {
        $('fSearch').value = state.q;
        $('fStatus').value = state.status;
        $('fRegion').value = state.region;
        $('fCountry').value = state.country;
        $('fSort').value = state.sort;
        $('fOrder').value = state.order;
      }

      function syncFilterUrl() {
        const query = PostsFilter.toSearch(currentFilters());
        const url = new URL(location.href);
        url.search = query;
        history.replaceState(null, '', url.toString());
      }

      function editorHref(translationKey) {
        const editor = new URL('/admin/editor.html', location.origin);
        if (translationKey) editor.searchParams.set('tk', translationKey);
        const query = PostsFilter.toSearch(currentFilters());
        editor.searchParams.set('returnTo', '/admin/posts.html' + (query ? '?' + query : ''));
        return editor.pathname + editor.search;
      }

      function visiblePosts() {
        return PostsFilter.apply(allPosts, currentFilters());
      }

      function updateFilterContext(posts) {
        const filters = currentFilters();
        const activeExtra = PostsFilter.extraFilterCount(filters);
        const expanded = !$('fExtra').hidden;
        $('fMore').textContent = (expanded ? 'Fewer filters' : 'More filters') +
          (activeExtra ? ' (' + activeExtra + ' active)' : '');
        $('resultsCount').textContent = allPosts.length
          ? posts.length + ' of ' + allPosts.length + (allPosts.length === 1 ? ' post' : ' posts')
          : '0 posts';
      }

      function resetFilters() {
        setFilterControls({ q: '', status: '', region: '', country: '', sort: 'updated', order: 'desc' });
        render(true);
        $('fSearch').focus();
      }

      // Every action below disables its trigger while the request is in flight
      // and re-enables it in `finally`: a dropped connection used to reject the
      // await, leaving "Deleting…" on screen and the buttons dead until reload.
      async function unpublishPost(p, btn) {
        const title = p.titleDe || '(untitled)';
        const ok = await AdminConfirm.ask({
          title: 'Unpublish this trip?',
          body: '"' + title + '"' + slugSuffix(p) + ' will leave the live site on the next build and revert to a draft.',
          confirmLabel: 'Unpublish',
          danger: true,
        });
        if (!ok) return;
        btn.disabled = true;
        $('out').textContent = 'Unpublishing…';
        try {
          const res = await fetch('/posts/' + encodeURIComponent(p.translationKey) + '/unpublish', { method: 'POST' });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { $('out').textContent = 'Unpublish failed: ' + (body.error || res.status); return; }
          const msg = 'Unpublished "' + title + '".' + describeBuild(body.build);
          $('out').textContent = msg;
          await load(msg);
        } catch (e) {
          $('out').textContent = 'Unpublish failed: ' + e;
        } finally {
          btn.disabled = false;
        }
      }

      async function deletePost(p, btn) {
        const title = p.titleDe || '(untitled)';
        const warning = p.status === 'published'
          ? '\n\nThis post is PUBLISHED — it will be removed from the live site on the next build.'
          : '';
        const ok = await AdminConfirm.ask({
          title: 'Delete this trip?',
          body: '"' + title + '"' + slugSuffix(p) + '?' + warning + '\n\n' + GpxCopy.en.deleteScope + '\n\nThis cannot be undone.',
          confirmLabel: 'Delete',
          danger: true,
        });
        if (!ok) return;
        btn.disabled = true; // no double-fire while the request is in flight
        $('out').textContent = 'Deleting…';
        try {
          const res = await fetch('/posts/' + encodeURIComponent(p.translationKey), { method: 'DELETE' });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { $('out').textContent = 'Delete failed: ' + (body.error || res.status); return; }
          const msg = 'Deleted "' + title + '".' + describeBuild(body.build) + (body.cleanupPending ? ' ' + GpxCopy.en.cleanupPending : '');
          $('out').textContent = msg;
          // Pass the outcome so load() does not clobber it with "N post(s) loaded."
          // — a failed rebuild (body.build.ok === false) must stay visible to the admin.
          await load(msg);
        } catch (e) {
          $('out').textContent = 'Delete failed: ' + e;
        } finally {
          btn.disabled = false;
        }
      }

      // ---- bulk actions -------------------------------------------------

      function postTitle(key) {
        const post = allPosts.find((p) => p.translationKey === key);
        return post && post.titleDe ? post.titleDe : '(untitled)';
      }

      function refreshBulkBar() {
        const bar = $('bulkBar');
        if (!me || !me.isAdmin || selected.size === 0) {
          bar.hidden = true;
          $('selectionReview').open = false;
          return;
        }
        const visibleKeys = new Set(visiblePosts().map((p) => p.translationKey));
        const outsideView = [...selected].filter((key) => !visibleKeys.has(key)).length;
        bar.hidden = false;
        $('bulkCount').textContent = selected.size + ' selected · ' +
          outsideView + ' outside current view';
        const list = $('selectionList');
        list.innerHTML = '';
        for (const key of selected) {
          const item = document.createElement('li');
          item.textContent = postTitle(key);
          list.appendChild(item);
        }
      }

      // Bulk DELETE is irreversible and has no undo — revisions are per-save
      // snapshots and remove() hard-deletes both locale rows. So it gets a
      // typed confirmation, distinct from the plain confirm on the others.
      async function confirmBulk(action, keys) {
        const selectedStories = keys.map((key) => '"' + postTitle(key) + '"').join('\n• ');
        const storyList = '\n\nSelected stories:\n• ' + selectedStories;
        const live = keys.filter((key) => {
          const post = allPosts.find((p) => p.translationKey === key);
          return post && post.status === 'published';
        }).length;
        if (action === 'delete') {
          const warning = live > 0
            ? '\n\n' + live + ' selected ' + (live === 1 ? 'story is' : 'stories are') + ' PUBLISHED and will be removed from the live site.'
            : '';
          return AdminConfirm.ask({
            title: 'Delete ' + keys.length + ' selected ' + (keys.length === 1 ? 'story?' : 'stories?'),
            body: 'This CANNOT be undone.' + warning + storyList + '\n\n' + GpxCopy.en.deleteScope + '\n\nType DELETE to confirm:',
            confirmLabel: 'Delete',
            danger: true,
            typed: 'DELETE',
          });
        }
        const verb = action === 'publish' ? 'Publish' : 'Unpublish';
        const liveNote = live > 0
          ? live + ' selected ' + (live === 1 ? 'story is' : 'stories are') + ' already on the live site.'
          : 'None of the selected stories are currently live.';
        return AdminConfirm.ask({
          title: verb + ' ' + keys.length + ' selected ' + (keys.length === 1 ? 'story?' : 'stories?'),
          body: liveNote + storyList,
          confirmLabel: verb,
          danger: action === 'unpublish',
        });
      }

      const gpxPublishErrors = {
        track_public_limit: 'publishRouteRecovery', track_empty_after_rounding: 'publishRouteRecovery',
        publish_busy: 'busy', gpx_timeout: 'timeout', gpx_worker_failed: 'workerFailed', gpx_unavailable: 'unavailable',
      };
      function summarizeBulk(action, body) {
        const failures = (body.results || []).filter((r) => !r.ok);
        let msg = action + ': ' + body.succeeded + ' succeeded, ' + body.failed + ' failed.' + describeBuild(body.build);
        for (const f of failures) {
          const p = allPosts.find((x) => x.translationKey === f.key);
          const errorKey = Object.hasOwn(gpxPublishErrors, f.code) ? gpxPublishErrors[f.code]
            : (typeof f.code === 'string' && f.code.startsWith('gpx_') ? 'failed' : null);
          msg += '\n  · ' + ((p && p.titleDe) || f.key) + ' — ' + (errorKey ? GpxCopy.en[errorKey] : f.error);
        }
        return msg;
      }

      async function runBulk(action) {
        // Snapshot before the async confirmation: filter or checkbox changes
        // while the dialog is open must never alter the confirmed request.
        const keys = Object.freeze([...selected]);
        if (keys.length === 0) return;
        if (!(await confirmBulk(action, keys))) return;
        const buttons = [$('bulkPublish'), $('bulkUnpublish'), $('bulkDelete')];
        buttons.forEach((b) => { b.disabled = true; });
        $('out').textContent = 'Running ' + action + ' on ' + keys.length + ' post(s)…';
        try {
          const res = await fetch('/posts/bulk', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action, keys }),
          });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { $('out').textContent = 'Bulk ' + action + ' failed: ' + (body.error || res.status); return; }
          const msg = summarizeBulk(action, body) + (body.cleanupPending ? ' ' + GpxCopy.en.cleanupPending : '');
          // Keep failed stories selected so the visible failure report is also
          // immediately actionable: the author can fix them and retry without
          // reconstructing a cross-filter selection. A complete success may
          // omit per-item results, so clear the confirmed snapshot in that case.
          if (body.failed === 0) {
            keys.forEach((key) => selected.delete(key));
          } else {
            const succeeded = new Set((body.results || []).filter((r) => r.ok).map((r) => r.key));
            keys.forEach((key) => { if (succeeded.has(key)) selected.delete(key); });
          }
          // load() re-renders and hides the bar; pass the summary so it survives
          // the reload (partial failures must stay on screen).
          await load(msg);
        } catch (e) {
          $('out').textContent = 'Bulk ' + action + ' failed: ' + e;
        } finally {
          buttons.forEach((b) => { b.disabled = false; });
        }
      }

      // ---- rendering ----------------------------------------------------

      function placeholderThumb() {
        const ph = document.createElement('span');
        ph.className = 'media-thumb thumb-placeholder';
        ph.title = 'No hero image yet';
        return ph;
      }

      function heroCell(p) {
        const td = document.createElement('td');
        td.className = 'col-thumb';
        td.setAttribute('role', 'cell');
        td.setAttribute('data-label', 'Hero');
        const url = PostsFilter.thumbUrl(p);
        if (!url) { td.appendChild(placeholderThumb()); return td; }
        const img = document.createElement('img');
        img.className = 'media-thumb';
        img.src = url;
        img.alt = '';
        img.loading = 'lazy';
        img.width = 72;
        img.height = 54;
        // heroWidth is unverified jsonb: a plausible-but-wrong width still 404s,
        // so degrade to the placeholder instead of a broken-image icon.
        img.addEventListener('error', () => img.replaceWith(placeholderThumb()));
        td.appendChild(img);
        return td;
      }

      // Country and trip date sit under the title (the old Trip column), plus
      // the textual "EN missing" cue, so the state never rests on badge colour.
      // Items are joined by a real " · " separator span, so the line reads
      // correctly as plain text (copy, screen readers, no CSS) — not by gap alone.
      function tripMeta(p) {
        const items = [p.country, p.date].filter((v) => typeof v === 'string' && v).map((text) => {
          const span = document.createElement('span');
          span.textContent = text;
          return span;
        });
        if (p.hasEnBody === false) {
          const hint = document.createElement('span');
          hint.className = 'post-locale-state';
          hint.textContent = copy.postsMissingEn;
          items.push(hint);
        }
        if (!items.length) return null;
        const meta = document.createElement('div');
        meta.className = 'post-trip-meta';
        items.forEach((item, i) => {
          if (i > 0) {
            const sep = document.createElement('span');
            sep.className = 'post-trip-sep';
            sep.textContent = ' · ';
            meta.appendChild(sep);
          }
          meta.appendChild(item);
        });
        return meta;
      }

      function languageBadge(code, name, state) {
        const badge = document.createElement('span');
        badge.className = 'post-language' + (state ? ' is-' + state : '');
        // role="img" makes the spoken name the honest state, not just "EN".
        badge.setAttribute('role', 'img');
        badge.setAttribute('aria-label', name);
        badge.title = name;
        badge.textContent = code;
        return badge;
      }

      // @ai-warning The list payload carries hasEnBody and nothing about the DE
      // body, so DE is labelled as the primary locale only — never "complete".
      // EN is present/missing only on a strict boolean; an absent field is
      // "unknown", not "present" (an older or partial summary must not look done).
      function languagesCell(p) {
        const td = document.createElement('td');
        td.className = 'col-languages';
        td.setAttribute('role', 'cell');
        td.setAttribute('data-label', copy.postsLanguages);
        const wrap = document.createElement('div');
        wrap.className = 'post-languages';
        wrap.appendChild(languageBadge('DE', copy.postsGermanLocale, ''));
        if (p.hasEnBody === true) wrap.appendChild(languageBadge('EN', copy.postsEnglishPresent, ''));
        else if (p.hasEnBody === false) wrap.appendChild(languageBadge('EN', copy.postsEnglishMissing, 'missing'));
        else wrap.appendChild(languageBadge('EN', copy.postsEnglishUnknown, 'unknown'));
        td.appendChild(wrap);
        return td;
      }

      function wirePostDisclosure(details, summary) {
        details.addEventListener('toggle', () => {
          if (!details.open) {
            if (openMoreActions === details) openMoreActions = null;
            return;
          }
          if (openMoreActions && openMoreActions !== details) openMoreActions.open = false;
          openMoreActions = details;
        });
        details.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape' || !details.open) return;
          event.preventDefault();
          details.open = false;
          if (openMoreActions === details) openMoreActions = null;
          summary.focus();
        });
      }

      // The open panel floats over the rows below it, so it closes like a menu:
      // a click anywhere outside it dismisses it (Escape is handled per row above).
      document.addEventListener('click', (event) => {
        if (openMoreActions && !openMoreActions.contains(event.target)) openMoreActions.open = false;
      });

      function renderRows(posts) {
        const tbody = $('postsList');
        tbody.innerHTML = '';
        openMoreActions = null;
        if (!posts.length) {
          const tr = document.createElement('tr');
          tr.setAttribute('role', 'row');
          const td = document.createElement('td');
          td.colSpan = 7;
          td.setAttribute('role', 'cell');
          td.className = 'posts-empty';
          const message = document.createElement('p');
          message.textContent = allPosts.length
            ? 'No posts match these filters.'
            : 'No posts yet.';
          td.appendChild(message);
          if (allPosts.length) {
            const clear = document.createElement('button');
            clear.id = 'clearEmptyFilters';
            clear.type = 'button';
            clear.className = 'btn-link';
            clear.textContent = 'Clear filters';
            clear.addEventListener('click', resetFilters);
            td.appendChild(clear);
          } else {
            const create = document.createElement('a');
            create.href = editorHref();
            create.className = 'action-link';
            create.textContent = 'Create a new post';
            td.appendChild(create);
          }
          tr.appendChild(td);
          tbody.appendChild(tr);
          return;
        }
        for (const p of posts) {
          const tr = document.createElement('tr');
          tr.setAttribute('role', 'row');

          const tdSel = document.createElement('td');
          tdSel.className = 'col-select';
          tdSel.setAttribute('role', 'cell');
          tdSel.setAttribute('data-label', 'Select');
          if (me && me.isAdmin) {
            const selectLabel = document.createElement('label');
            selectLabel.className = 'post-row-select';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = selected.has(p.translationKey);
            cb.setAttribute('aria-label', 'Select ' + (p.titleDe || 'untitled post'));
            cb.addEventListener('change', () => {
              if (cb.checked) selected.add(p.translationKey); else selected.delete(p.translationKey);
              syncSelectAll();
              refreshBulkBar();
            });
            selectLabel.appendChild(cb);
            tdSel.appendChild(selectLabel);
          }
          tr.appendChild(tdSel);

          tr.appendChild(heroCell(p));

          const tdTitle = document.createElement('td');
          tdTitle.className = 'col-title';
          tdTitle.setAttribute('role', 'cell');
          tdTitle.setAttribute('data-label', 'Title');
          const titleLink = document.createElement('a');
          titleLink.href = editorHref(p.translationKey);
          titleLink.className = 'post-title-link';
          titleLink.setAttribute('aria-label', 'Edit ' + (p.titleDe || 'untitled post'));
          titleLink.textContent = p.titleDe || '(untitled)';
          tdTitle.appendChild(titleLink);
          const meta = tripMeta(p);
          if (meta) tdTitle.appendChild(meta);
          tr.appendChild(tdTitle);

          const tdStatus = document.createElement('td');
          tdStatus.className = 'col-status';
          tdStatus.setAttribute('role', 'cell');
          tdStatus.setAttribute('data-label', 'Status');
          const badge = document.createElement('span');
          const safeStatus = p.status === 'published' ? 'published' : 'draft';
          badge.className = 'status-pill ' + safeStatus;
          badge.textContent = safeStatus;
          tdStatus.appendChild(badge);
          if (p.status === 'published' && p.hasUnpublishedChanges) {
            const changed = document.createElement('span');
            changed.className = 'status-pill draft';
            changed.textContent = 'Unpublished changes';
            changed.title = 'The live post is unchanged until you publish again.';
            tdStatus.appendChild(changed);
          }
          tr.appendChild(tdStatus);

          tr.appendChild(languagesCell(p));

          const tdUpdated = document.createElement('td');
          tdUpdated.className = 'col-updated posts-date';
          tdUpdated.setAttribute('role', 'cell');
          tdUpdated.setAttribute('data-label', 'Updated');
          if (p.updatedAt) {
            tdUpdated.textContent = new Date(p.updatedAt).toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
          }
          tr.appendChild(tdUpdated);

          const tdActions = document.createElement('td');
          tdActions.className = 'col-actions';
          tdActions.setAttribute('role', 'cell');
          tdActions.setAttribute('data-label', 'Actions');
          const actions = document.createElement('div');
          actions.className = 'post-actions';
          const editLink = document.createElement('a');
          editLink.href = editorHref(p.translationKey);
          editLink.textContent = 'Edit';
          editLink.className = 'action-link';
          editLink.setAttribute('aria-label', 'Edit ' + (p.titleDe || 'untitled post'));
          actions.appendChild(editLink);

          // Unpublish and Delete are admin-only, so an author's row offers Edit
          // alone rather than an empty menu.
          if (me && me.isAdmin) {
            const more = document.createElement('details');
            more.className = 'post-more';
            const summary = document.createElement('summary');
            summary.textContent = 'More actions';
            summary.setAttribute('aria-label', 'More actions for ' + (p.titleDe || 'untitled post'));
            more.appendChild(summary);
            const moreActions = document.createElement('div');
            moreActions.className = 'post-more-actions';
            if (p.status === 'published') {
              const unpubBtn = document.createElement('button');
              unpubBtn.type = 'button';
              unpubBtn.textContent = 'Unpublish';
              unpubBtn.className = 'btn-secondary';
              unpubBtn.addEventListener('click', () => unpublishPost(p, unpubBtn));
              moreActions.appendChild(unpubBtn);
            }
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.textContent = 'Delete';
            delBtn.className = 'btn-remove';
            delBtn.addEventListener('click', () => deletePost(p, delBtn));
            moreActions.appendChild(delBtn);
            more.appendChild(moreActions);
            wirePostDisclosure(more, summary);
            actions.appendChild(more);
          }
          tdActions.appendChild(actions);
          tr.appendChild(tdActions);

          tbody.appendChild(tr);
        }
      }

      function syncSelectAll() {
        // Non-admins get neither the visible control nor per-row checkboxes;
        // the server still enforces the role on every bulk request.
        const isAdmin = Boolean(me && me.isAdmin);
        $('selectAllControl').hidden = !isAdmin;
        if (!isAdmin) return;
        const visible = visiblePosts();
        const all = visible.length > 0 && visible.every((p) => selected.has(p.translationKey));
        const some = visible.some((p) => selected.has(p.translationKey));
        $('selectAll').checked = all;
        $('selectAll').indeterminate = !all && some;
      }

      function render(updateUrl) {
        const posts = visiblePosts();
        renderRows(posts);
        syncSelectAll();
        refreshBulkBar();
        updateFilterContext(posts);
        syncStatusViews();
        $('newPost').href = editorHref();
        if (updateUrl) syncFilterUrl();
      }

      function fillOptions(select, values) {
        // Keep the leading "All" option, replace the rest; preserve the current
        // choice across reloads when it still exists.
        const previous = select.value;
        while (select.options.length > 1) select.remove(1);
        for (const v of values) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        }
        select.value = values.includes(previous) ? previous : '';
      }

      async function load(statusMsg) {
        // Remove stale rows and destructive controls before every reload. A
        // failed refresh must not leave old actions reachable, even briefly.
        allPosts = [];
        openMoreActions = null;
        $('postsList').innerHTML = '';
        $('postsTable').hidden = true;
        $('filters').hidden = true;
        $('statusViews').hidden = true;
        $('bulkBar').hidden = true;
        $('retryLoad').hidden = true;
        $('loadMsg').hidden = false;
        $('loadMsg').setAttribute('role', 'status');
        $('loadMsg').textContent = 'Loading posts…';

        // A refresh failure must not hide the outcome the caller already
        // reported (e.g. a successful unpublish followed by a failed reload).
        const loadFailed = (why) => {
          allPosts = [];
          selected.clear();
          $('postsList').innerHTML = '';
          $('resultsCount').textContent = '';
          // Counts of a list that is gone must not survive, even hidden.
          for (const { count } of statusViewButtons) count.textContent = '';
          $('loadMsg').setAttribute('role', 'alert');
          $('loadMsg').textContent = 'Posts could not be loaded.';
          $('retryLoad').hidden = false;
          refreshBulkBar();
          $('out').textContent = (statusMsg != null ? statusMsg + '\n' : '') + 'Could not load posts: ' + why;
        };
        try {
          const res = await fetch('/posts');
          if (res.status === 401) { location.href = '/login'; return; }
          if (!res.ok) { loadFailed(res.status); return; }
          const loaded = await res.json();
          if (!Array.isArray(loaded)) { loadFailed('invalid response'); return; }
          allPosts = loaded;
        } catch (e) {
          loadFailed(e);
          return;
        }
        // Drop selections for posts that no longer exist (e.g. after a bulk delete).
        for (const key of [...selected]) {
          if (!allPosts.some((post) => post.translationKey === key)) selected.delete(key);
        }
        const countryOptions = PostsFilter.countries(allPosts);
        fillOptions($('fRegion'), PostsFilter.REGIONS);
        fillOptions($('fCountry'), countryOptions);
        if (!filtersInitialized) {
          setFilterControls(PostsFilter.fromSearch(location.search, countryOptions));
          filtersInitialized = true;
        }
        $('loadMsg').hidden = true;
        $('filters').hidden = false;
        $('statusViews').hidden = false;
        $('postsTable').hidden = false;
        render(true);
        // Callers that already set an outcome pass it through so rebuild and
        // partial-failure details survive the reload.
        $('out').textContent = statusMsg != null ? statusMsg : '';
      }

      for (const id of ['fSearch', 'fStatus', 'fRegion', 'fCountry', 'fSort', 'fOrder']) {
        $(id).addEventListener('input', () => render(true));
      }
      $('fReset').addEventListener('click', resetFilters);
      $('fMore').addEventListener('click', () => {
        const extra = $('fExtra');
        extra.hidden = !extra.hidden;
        $('fMore').setAttribute('aria-expanded', extra.hidden ? 'false' : 'true');
        updateFilterContext(visiblePosts());
      });

      $('selectAll').addEventListener('change', () => {
        if (!me || !me.isAdmin) return; // belt-and-braces; the box is hidden too
        const visible = visiblePosts();
        if ($('selectAll').checked) visible.forEach((p) => selected.add(p.translationKey));
        else visible.forEach((p) => selected.delete(p.translationKey));
        render();
      });

      $('clearSelection').addEventListener('click', () => {
        selected.clear();
        render();
        $('selectAll').focus();
      });
      $('retryLoad').addEventListener('click', () => load());

      $('bulkPublish').addEventListener('click', () => runBulk('publish'));
      $('bulkUnpublish').addEventListener('click', () => runBulk('unpublish'));
      $('bulkDelete').addEventListener('click', () => runBulk('delete'));

      $('exportAll').addEventListener('click', async () => {
        const btn = $('exportAll');
        btn.disabled = true;
        $('out').textContent = 'Exporting…';
        try {
          const res = await fetch('/export', { method: 'POST' });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          $('out').textContent = res.ok
            ? 'Exported ' + body.count + ' MDX file(s) to the configured server backup directory.'
            : 'Export failed: ' + (body.error || res.status);
        } catch (e) {
          $('out').textContent = 'Export failed: ' + e;
        } finally {
          btn.disabled = false;
        }
      });

      (async () => {
        me = await Auth.ensureAuthed();
        if (!me) return;
        Auth.renderHeader(me);
        await load();
      })();
    </script>
  </body>
</html>
