<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Posts</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="posts-page">
    <header class="cms-page-meta">
      <h1>Posts</h1>
      <p class="lede" data-language-copy="PostIntro"></p>
      <div class="cms-page-actions">
        <button id="exportAll" type="button" class="btn-secondary" title="Writes every story as an MDX file to the server's backup directory">Export MDX backup</button>
        <a id="newPost" href="/admin/editor.html" class="btn-new">New post</a>
      </div>
    </header>

    <main>
      <section class="card">
        <p id="out" class="page-status" role="status"></p>

        <div class="posts-filters" id="filters" hidden>
          <div class="posts-filters-main">
            <label class="filter-field filter-search">
              <span>Search</span>
              <input id="fSearch" type="search" placeholder="Title, slug or country" autocomplete="off" />
            </label>
            <div class="filter-field filter-field--menu">
              <select id="fStatus" aria-label="Status">
                <option value="">All</option>
                <option value="draft">Draft</option>
                <option value="published">Published</option>
                <option id="unpublishedOption" value="unpublished"></option>
                <option id="missingSecondaryOption" value="missing-secondary" data-language-copy="MissingTranslation"></option>
              </select>
            </div>
            <div class="filter-field filter-field--menu">
              <select id="fSort" aria-label="Sort">
                <option value="updated">Updated</option>
                <option value="date">Trip date</option>
                <option value="title">Title</option>
              </select>
            </div>
          </div>
          <div class="posts-filters-actions">
            <button type="button" id="fMore" class="btn-link filter-reset" aria-expanded="false" aria-controls="fExtra">More filters</button>
            <button id="fReset" class="btn-link filter-reset" type="button">Clear filters</button>
          </div>
          <div class="posts-filters-extra" id="fExtra" hidden>
            <div class="filter-field filter-field--menu">
              <select id="fRegion" aria-label="Region"><option value="">All</option></select>
            </div>
            <div class="filter-field filter-field--menu">
              <select id="fCountry" aria-label="Country"><option value="">All</option></select>
            </div>
            <div class="filter-field filter-field--menu">
              <select id="fOrder" aria-label="Order">
                <option value="desc">Descending</option>
                <option value="asc">Ascending</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Status views are toggle buttons over the same state as #fStatus,
             filled by the script; hidden with the filters while nothing is loaded. -->
        <div id="statusViews" class="posts-status-tabs" role="group" hidden></div>
        <p id="resultsCount" class="posts-results" role="status"></p>
        <p id="loadMsg" class="muted" role="status">Loading stories…</p>
        <button id="retryLoad" type="button" class="btn-secondary" hidden>Retry</button>
        <table id="postsTable" class="posts-table" role="table" hidden>
          <thead role="rowgroup">
            <tr role="row">
              <th class="col-select" scope="col" role="columnheader">
                <label id="selectAllControl" class="post-select-all">
                  <input id="selectAll" type="checkbox" aria-label="Select all visible posts" />
                </label>
              </th>
              <th class="col-thumb" scope="col" role="columnheader">Hero</th>
              <th class="col-title" scope="col" role="columnheader">Title</th>
              <th class="col-status" scope="col" role="columnheader">Status</th>
              <th id="languagesHeading" class="col-languages" scope="col" role="columnheader">Languages</th>
              <th class="col-updated" scope="col" role="columnheader">Updated</th>
              <th class="col-actions" scope="col" role="columnheader">Actions</th>
            </tr>
          </thead>
          <tbody id="postsList" role="rowgroup"></tbody>
        </table>
      </section>

      <!-- The bulk actions float over the workspace (admin.css, .posts-page
           .bulk-bar). The slot after the list is their reserved runway: it is
           sized for the bar from the first admin render and never shrinks, so
           showing or hiding the bar never moves the rows (#566). -->
      <div id="bulkBarSlot" class="bulk-bar-slot">
        <div class="bulk-bar" id="bulkBar" role="region" aria-label="Bulk actions" hidden inert>
          <span id="bulkCount" aria-live="polite"></span>
          <details id="selectionReview" class="selection-review">
            <summary id="selectionReviewSummary">Review selection</summary>
            <ul id="selectionList" tabindex="0" aria-label="Selected stories"></ul>
          </details>
          <button id="clearSelection" type="button" class="btn-link">Clear selection</button>
          <button id="bulkPublish" type="button" class="btn-primary">Publish</button>
          <button id="bulkUnpublish" type="button" class="btn-secondary">Unpublish</button>
          <button id="bulkDelete" type="button" class="btn-remove">Delete</button>
        </div>
      </div>
    </main>

    <script src="/admin/editor-image-copy.js"></script>
    <script src="/admin/build-reporting.js"></script>
    <script src="/admin/publication-state.js"></script>
    <script src="/admin/publication-refresh.js"></script>
    <script src="/admin/gpx-copy.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/language.js"></script>
    <script src="/admin/admin-ui.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script src="/admin/posts-filter.js"></script>
    <script src="/admin/admin-select.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let me = null; // session from Auth.ensureAuthed(); buttons are hidden for
                     // non-admins, but the server enforces admin-only regardless.
      let allPosts = [];              // everything GET /posts returned
      const selected = new Set();     // translationKeys ticked in the list
      let filtersInitialized = false;
      let openMoreActions = null;
      let listStale = true;
      let listMutating = false;
      let buildStatus = null;
      const copy = EditorCopy.en;
      SiteLanguage.localize(document);
      $('languagesHeading').textContent = copy.postsLanguages;
      $('unpublishedOption').textContent = copy.postsChanges;

      // Status views: toggle buttons over the SAME state as the #fStatus select
      // (one source of truth — the select's value), so the URL, Edit's returnTo
      // and Clear filters need no second code path. Plain buttons with
      // aria-pressed, not role="tab": they filter one list, they do not switch panels.
      // @ai-note Each count is PostsFilter.apply over the loaded rows with every
      // CURRENT non-status filter (search, region, country) and that status —
      // "what clicking this would show", never a whole-library total.
      const STATUS_VIEWS = [
        { status: '', label: copy.postsAll },
        { status: 'draft', label: copy.postsDrafts },
        { status: 'published', label: copy.postsPublished },
        { status: 'unpublished', label: copy.postsChanges },
        { status: 'missing-secondary', label: SiteLanguage.text('MissingTranslation') },
      ];
      $('statusViews').setAttribute('aria-label', copy.postsStatusFilters);
      const statusViewButtons = STATUS_VIEWS.map((view) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'posts-status-tab';
        button.setAttribute('data-status', view.status);
        button.setAttribute('aria-pressed', 'false');
        const label = document.createElement('span');
        label.className = 'posts-status-label';
        label.textContent = view.label;
        const count = document.createElement('span');
        count.className = 'posts-status-count';
        button.appendChild(label);
        button.appendChild(count);
        button.addEventListener('click', () => {
          $('fStatus').value = view.status;
          render(true);
        });
        $('statusViews').appendChild(button);
        return { view, button, count, label };
      });

      // The five filters are in-label menus over their native selects (#566):
      // the select stays the one source of truth, so everything above and
      // below keeps reading and writing `.value`. A programmatic write fires no
      // event, so render() re-syncs every menu at its end.
      const filterMenus = ['fStatus', 'fSort', 'fRegion', 'fCountry', 'fOrder'].map((id) => AdminSelect.enhance($(id)));

      function syncStatusViews() {
        const filters = currentFilters();
        for (const { view, button, count } of statusViewButtons) {
          button.setAttribute('aria-pressed', filters.status === view.status ? 'true' : 'false');
          count.textContent = String(PostsFilter.apply(allPosts, { ...filters, status: view.status }).length);
        }
      }

      function describeOutcome(action, body, values) {
        return BuildReporting.describeOutcome(action, body, values);
      }

      // Draft slugs may still be empty — only render "(de / en)" when set.
      function slugSuffix(p) {
        const slugs = SiteLanguage.config().locales.map((locale) => p.slugs[locale]).filter(Boolean).join(' / ');
        return slugs ? ' (' + slugs + ')' : '';
      }

      function currentFilters() {
        return {
          q: $('fSearch').value,
          status: $('fStatus').value,
          region: $('fRegion').value,
          country: $('fCountry').value,
          sort: $('fSort').value,
          order: $('fOrder').value,
        };
      }

      function setFilterControls(state) {
        $('fSearch').value = state.q;
        $('fStatus').value = state.status;
        $('fRegion').value = state.region;
        $('fCountry').value = state.country;
        $('fSort').value = state.sort;
        $('fOrder').value = state.order;
      }

      function syncFilterUrl() {
        const query = PostsFilter.toSearch(currentFilters());
        const url = new URL(location.href);
        url.search = query;
        history.replaceState(null, '', url.toString());
      }

      function editorHref(translationKey) {
        const editor = new URL('/admin/editor.html', location.origin);
        if (translationKey) editor.searchParams.set('tk', translationKey);
        const query = PostsFilter.toSearch(currentFilters());
        editor.searchParams.set('returnTo', '/admin/posts.html' + (query ? '?' + query : ''));
        return editor.pathname + editor.search;
      }

      function visiblePosts() {
        return PostsFilter.apply(allPosts, currentFilters());
      }

      function updateFilterContext(posts) {
        const filters = currentFilters();
        const activeExtra = PostsFilter.extraFilterCount(filters);
        const expanded = !$('fExtra').hidden;
        $('fMore').textContent = (expanded ? 'Fewer filters' : 'More filters') +
          (activeExtra ? ' (' + activeExtra + ' active)' : '');
        $('resultsCount').textContent = allPosts.length
          ? posts.length + ' of ' + AdminFormat.count(allPosts.length, 'story', 'stories')
          : '0 stories';
      }

      function resetFilters() {
        setFilterControls({ q: '', status: '', region: '', country: '', sort: 'updated', order: 'desc' });
        render(true);
        $('fSearch').focus();
      }

      // Unpublish and Delete rebuild the site at once (the server promotes the
      // new release before it answers), so the confirmations say so rather
      // than deferring the change to "the next build".
      const REBUILDS_NOW = ' removed from the live site now (the site rebuilds; this can take several minutes)';

      // Every action below disables its trigger while the request is in flight
      // and re-enables it in `finally`: a dropped connection used to reject the
      // await, leaving "Deleting…" on screen and the buttons dead until reload.
      async function unpublishPost(p, btn) {
        if (listStale || listMutating) return;
        const title = p.title || '(untitled)';
        const ok = await AdminConfirm.ask({
          title: 'Unpublish this story?',
          body: '“' + title + '”' + slugSuffix(p) + ' is' + REBUILDS_NOW + ' and returns to your drafts.',
          confirmLabel: 'Unpublish',
          danger: true,
        });
        if (!ok) return;
        listMutating = true;
        publicationRefresh.beginAction();
        render();
        btn.disabled = true;
        $('out').textContent = 'Unpublishing…';
        try {
          const res = await fetch('/posts/' + encodeURIComponent(p.translationKey) + '/unpublish', { method: 'POST' });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { $('out').textContent = res.status >= 500 ? BuildReporting.text('unknown') : (body.error || res.status); return; }
          if (body.unpublished !== true) { $('out').textContent = BuildReporting.text('unknown'); return; }
          acceptMutation(p.translationKey, body.publication);
          const msg = describeOutcome('unpublish', body, { title });
          $('out').textContent = msg;
          await load(msg);
          if (body.build?.ok === false) BuildReporting.recovery($('out'), body.build.code);
        } catch (e) {
          $('out').textContent = BuildReporting.text('unknown');
        } finally {
          listMutating = false;
          btn.disabled = listStale;
          publicationRefresh.endAction();
          render();
        }
      }

      // Focus after the row is gone is renderRows' job: the row the author was
      // on hands focus to the next row's Edit link, else the previous row's,
      // else New post.
      async function deletePost(p, btn) {
        if (listStale || listMutating) return;
        const title = p.title || '(untitled)';
        // One sentence says what goes, and — for a published story — that the
        // live site changes now.
        const scope = p.status === 'published' ? ' is deleted and' + REBUILDS_NOW + '.' : ' is deleted.';
        const ok = await AdminConfirm.ask({
          title: 'Delete this story?',
          body: '“' + title + '”' + slugSuffix(p) + scope + '\n\n' + GpxCopy.en.deleteScope + '\n\nThis cannot be undone.',
          confirmLabel: 'Delete',
          danger: true,
        });
        if (!ok) return;
        listMutating = true;
        publicationRefresh.beginAction();
        render();
        btn.disabled = true; // no double-fire while the request is in flight
        $('out').textContent = 'Deleting…';
        try {
          const res = await fetch('/posts/' + encodeURIComponent(p.translationKey), { method: 'DELETE' });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { $('out').textContent = res.status >= 500 ? BuildReporting.text('unknown') : (body.error || res.status); return; }
          if (body.deleted !== true) { $('out').textContent = BuildReporting.text('unknown'); return; }
          acceptMutation(p.translationKey, body.publication);
          const msg = describeOutcome('delete', body, { title }) + (body.cleanupPending ? ' ' + GpxCopy.en.cleanupPending : '');
          $('out').textContent = msg;
          // Pass the outcome so load() does not clobber it — a failed rebuild
          // (body.build.ok === false) must stay visible to the admin.
          await load(msg);
          if (body.build?.ok === false) BuildReporting.recovery($('out'), body.build.code);
        } catch (e) {
          $('out').textContent = BuildReporting.text('unknown');
        } finally {
          listMutating = false;
          btn.disabled = listStale;
          publicationRefresh.endAction();
          render();
        }
      }

      // ---- bulk actions -------------------------------------------------

      function postTitle(key) {
        const post = allPosts.find((p) => p.translationKey === key);
        return post && post.title ? post.title : '(untitled)';
      }

      // The bar floats over the workspace; while anything is selected the table
      // is in selection mode, which keeps every row checkbox visible (admin.css).
      // `inert` goes with `hidden`: a bar fading out can take neither focus nor
      // clicks, so runBulk's focus hand-off still moves on to the Edit link.
      function refreshBulkBar() {
        const bar = $('bulkBar');
        const isAdmin = Boolean(me && me.isAdmin);
        // The runway is reserved from the first admin render and never released.
        if (isAdmin) $('bulkBarSlot').classList.toggle('is-reserved', true);
        const selecting = isAdmin && selected.size > 0;
        $('postsTable').classList.toggle('is-selecting', selecting);
        if (!selecting) {
          bar.hidden = true;
          bar.inert = true;
          $('selectionReview').open = false;
          return;
        }
        const visibleKeys = new Set(visiblePosts().map((p) => p.translationKey));
        const outsideView = [...selected].filter((key) => !visibleKeys.has(key)).length;
        bar.hidden = false;
        bar.inert = false;
        $('bulkCount').textContent = selected.size + ' selected · ' +
          outsideView + ' outside current view';
        const list = $('selectionList');
        list.innerHTML = '';
        for (const key of selected) {
          const item = document.createElement('li');
          item.textContent = postTitle(key);
          list.appendChild(item);
        }
      }

      // Clearing happens from wherever the author is in the list, so focus goes
      // to a checkbox already on screen (select-all first) without scrolling.
      // Only when none is fully in view does it go to select-all, scrolled into
      // view: visible focus outranks a still list.
      function clearSelection() {
        selected.clear();
        render();
        const candidates = [$('selectAll'), ...$('postsList').querySelectorAll('input')];
        const inView = AdminFocus.firstInView(candidates, $('postsTable').closest('.cms-workspace'));
        (inView || $('selectAll')).focus({ preventScroll: Boolean(inView) });
      }

      // Bulk DELETE is irreversible and has no undo — revisions are per-save
      // snapshots and remove() hard-deletes both locale rows. So it gets a
      // typed confirmation, distinct from the plain confirm on the others.
      async function confirmBulk(action, keys) {
        const selectedStories = keys.map((key) => '"' + postTitle(key) + '"').join('\n• ');
        const storyList = '\n\nSelected stories:\n• ' + selectedStories;
        const live = keys.filter((key) => {
          const post = allPosts.find((p) => p.translationKey === key);
          return post && post.publication?.availability === 'available' && post.publication.status === 'published';
        }).length;
        if (action === 'delete') {
          const warning = live > 0
            ? '\n\n' + (live === 1 ? '1 selected story is published and is' : live + ' selected stories are published and are') + REBUILDS_NOW + '.'
            : '';
          return AdminConfirm.ask({
            title: 'Delete ' + AdminFormat.count(keys.length, 'selected story', 'selected stories') + '?',
            body: 'This cannot be undone.' + warning + storyList + '\n\n' + GpxCopy.en.deleteScope,
            confirmLabel: 'Delete',
            danger: true,
            typed: 'DELETE',
          });
        }
        const verb = action === 'publish' ? 'Publish' : 'Unpublish';
        const liveNote = PublicationState.text('selection', { n: live });
        return AdminConfirm.ask({
          title: verb + ' ' + AdminFormat.count(keys.length, 'selected story', 'selected stories') + '?',
          body: liveNote + storyList,
          confirmLabel: verb,
          danger: action === 'unpublish', tone: 'publish',
        });
      }

      const gpxPublishErrors = {
        track_public_limit: 'publishRouteRecovery', track_empty_after_rounding: 'publishRouteRecovery',
        publish_busy: 'busy', gpx_timeout: 'timeout', gpx_worker_failed: 'workerFailed', gpx_unavailable: 'unavailable',
      };
      function summarizeBulk(action, body) {
        const failures = (body.results || []).filter((r) => !r.ok);
        let msg = describeOutcome('bulk', body, { action: BuildReporting.text('action.' + action), n: body.succeeded, m: body.failed });
        for (const f of failures) {
          const p = allPosts.find((x) => x.translationKey === f.key);
          const errorKey = Object.hasOwn(gpxPublishErrors, f.code) ? gpxPublishErrors[f.code]
            : (typeof f.code === 'string' && f.code.startsWith('gpx_') ? 'failed' : null);
          msg += '\n  · ' + ((p && p.title) || f.key) + ' — ' + (errorKey ? GpxCopy.en[errorKey] : SiteLanguage.error(f));
        }
        return msg;
      }

      const BULK_TRIGGERS = { publish: 'bulkPublish', unpublish: 'bulkUnpublish', delete: 'bulkDelete' };
      const BULK_PROGRESS = { publish: 'Publishing', unpublish: 'Unpublishing', delete: 'Deleting' };

      // The bulk bar hides once the selection is done, taking the trigger's
      // focus with it. Taken before the request: the rows as the author sees
      // them, so focus can move to the first acted-on story's Edit link, else
      // the row after the removed ones, else the one before, else New post.
      function rowsAround(keys) {
        const removed = new Set(keys);
        const order = visiblePosts().map((post) => post.translationKey);
        const first = order.findIndex((key) => removed.has(key));
        return {
          after: order.slice(first + 1).filter((key) => !removed.has(key)),
          before: order.slice(0, Math.max(first, 0)).reverse().filter((key) => !removed.has(key)),
        };
      }

      async function runBulk(action) {
        if (listStale || listMutating) return;
        // Snapshot before the async confirmation: filter or checkbox changes
        // while the dialog is open must never alter the confirmed request.
        const keys = Object.freeze([...selected]);
        const baseLanguageUpdatedAt = SiteLanguage.config().updatedAt;
        if (keys.length === 0) return;
        const restoreFocus = AdminFocus.hold($(BULK_TRIGGERS[action]));
        if (!(await confirmBulk(action, keys))) return;
        const around = rowsAround(keys);
        listMutating = true;
        publicationRefresh.beginAction();
        render();
        const buttons = [$('bulkPublish'), $('bulkUnpublish'), $('bulkDelete')];
        buttons.forEach((b) => { b.disabled = true; });
        $('out').textContent = BULK_PROGRESS[action] + ' ' + AdminFormat.count(keys.length, 'story', 'stories') + '…';
        try {
          const res = await fetch('/posts/bulk', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action, keys, ...(action === 'publish' ? { baseLanguageUpdatedAt } : {}) }),
          });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { $('out').textContent = res.status >= 500 ? BuildReporting.text('unknown') : (body.error || res.status); return; }
          if (!Number.isInteger(body.succeeded) || !Number.isInteger(body.failed)) { $('out').textContent = BuildReporting.text('unknown'); return; }
          for (const result of body.results || []) acceptMutation(result.key, result.publication);
          const msg = summarizeBulk(action, body) + (body.cleanupPending ? ' ' + GpxCopy.en.cleanupPending : '');
          // Keep failed stories selected so the visible failure report is also
          // immediately actionable: the author can fix them and retry without
          // reconstructing a cross-filter selection. A complete success may
          // omit per-item results, so clear the confirmed snapshot in that case.
          if (body.failed === 0) {
            keys.forEach((key) => selected.delete(key));
          } else {
            const succeeded = new Set((body.results || []).filter((r) => r.ok).map((r) => r.key));
            keys.forEach((key) => { if (succeeded.has(key)) selected.delete(key); });
          }
          // load() re-renders and hides the bar; pass the summary so it survives
          // the reload (partial failures must stay on screen).
          await load(msg);
          if (body.build?.ok === false) BuildReporting.recovery($('out'), body.build.code);
        } catch (e) {
          $('out').textContent = BuildReporting.text('unknown');
        } finally {
          listMutating = false;
          publicationRefresh.endAction();
          render();
          const links = (list) => list.map((key) => rowEditLinks.get(key));
          restoreFocus(...links(keys), ...links(around.after), ...links(around.before), $('newPost'));
        }
      }

      // ---- rendering ----------------------------------------------------

      function placeholderThumb() {
        const ph = document.createElement('span');
        ph.className = 'media-thumb thumb-placeholder';
        ph.title = 'No hero image yet';
        return ph;
      }

      function heroCell(p) {
        const td = document.createElement('td');
        td.className = 'col-thumb';
        td.setAttribute('role', 'cell');
        td.setAttribute('data-label', 'Hero');
        const url = PostsFilter.thumbUrl(p);
        if (!url) { td.appendChild(placeholderThumb()); return td; }
        const img = document.createElement('img');
        img.className = 'media-thumb';
        img.src = url;
        img.alt = '';
        img.loading = 'lazy';
        img.width = 96;
        img.height = 64;
        // heroWidth is unverified jsonb: a plausible-but-wrong width still 404s,
        // so degrade to the placeholder instead of a broken-image icon.
        img.addEventListener('error', () => img.replaceWith(placeholderThumb()));
        td.appendChild(img);
        return td;
      }

      // Country and trip date sit under the title (the old Trip column), plus
      // the textual "EN missing" cue, so the state never rests on badge colour.
      // Items are joined by a real " · " separator span, so the line reads
      // correctly as plain text (copy, screen readers, no CSS) — not by gap alone.
      function tripMeta(p) {
        const items = [];
        if (typeof p.country === 'string' && p.country) {
          const country = document.createElement('span');
          country.textContent = p.country;
          items.push(country);
        }
        const date = AdminFormat.date(p.date);
        if (date) {
          // A measurement, so it is set in mono like every date in a list row.
          const when = document.createElement('span');
          when.className = 'post-trip-date';
          when.textContent = date;
          items.push(when);
        }
        if (p.secondaryStatus === 'empty' && SiteLanguage.config().locales.length > 1) {
          const hint = document.createElement('span');
          hint.className = 'post-locale-state';
          hint.textContent = SiteLanguage.text('BodyEmpty', { language: SiteLanguage.names[SiteLanguage.config().locales[1]] });
          items.push(hint);
        }
        if (!items.length) return null;
        const meta = document.createElement('div');
        meta.className = 'post-trip-meta';
        items.forEach((item, i) => {
          if (i > 0) {
            const sep = document.createElement('span');
            sep.className = 'post-trip-sep';
            sep.textContent = ' · ';
            meta.appendChild(sep);
          }
          meta.appendChild(item);
        });
        return meta;
      }

      // One chip per enabled locale, the same ones the Desk's draft card shows:
      // the state comes from PostsFilter.languageStates, the chip from SiteLanguage.
      function languagesCell(p) {
        const td = document.createElement('td');
        td.className = 'col-languages';
        td.setAttribute('role', 'cell');
        td.setAttribute('data-label', copy.postsLanguages);
        const wrap = document.createElement('div');
        wrap.className = 'post-languages';
        for (const { locale, state, copy: name } of PostsFilter.languageStates(p, SiteLanguage.config())) {
          wrap.appendChild(SiteLanguage.chip(locale, state, SiteLanguage.text(name, { language: SiteLanguage.names[locale] })));
        }
        td.appendChild(wrap);
        return td;
      }

      function wirePostDisclosure(details, summary) {
        details.addEventListener('toggle', () => {
          if (!details.open) {
            if (openMoreActions === details) openMoreActions = null;
            return;
          }
          if (openMoreActions && openMoreActions !== details) openMoreActions.open = false;
          openMoreActions = details;
        });
        details.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape' || !details.open) return;
          event.preventDefault();
          details.open = false;
          if (openMoreActions === details) openMoreActions = null;
          summary.focus();
        });
      }

      // An open panel floats over the rows below it, so it closes like a menu:
      // a click anywhere outside it dismisses it (Escape is handled per row
      // above, and for Review selection by the bar below).
      document.addEventListener('click', (event) => {
        if (openMoreActions && !openMoreActions.contains(event.target)) openMoreActions.open = false;
        const review = $('selectionReview');
        if (review.open && !review.contains(event.target)) review.open = false;
      });

      // Story key → its row's Edit link, from the latest render: the control a
      // row hands focus to when another row goes away.
      let rowEditLinks = new Map();

      function renderRows(posts) {
        const tbody = $('postsList');
        const active = document.activeElement;
        const focusedPost = tbody.contains(active) ? active.dataset.postKey : undefined;
        const focusedControl = tbody.contains(active) ? active.dataset.postControl : undefined;
        // The rows as the author last saw them. A focused row that has gone —
        // deleted here or elsewhere, or no longer matching — hands focus to the
        // next row's Edit link, else the previous row's, never to <body>.
        const lastOrder = Array.from(tbody.querySelectorAll('.post-title-link')).map((link) => link.dataset.postKey);
        let expandedPost, nextFocus, matchingTitle;
        for (const menu of tbody.querySelectorAll('.post-more')) {
          if (menu.open) expandedPost = menu.dataset.postKey;
          // A queued toggle on a discarded menu must not close its replacement.
          menu.open = false;
        }
        function identify(control, key, role) {
          control.dataset.postKey = key;
          control.dataset.postControl = role;
          if (key === focusedPost && role === focusedControl && !control.disabled) nextFocus = control;
        }
        function neighbourEdit() {
          const at = lastOrder.indexOf(focusedPost);
          const after = lastOrder.slice(at + 1).find((key) => rowEditLinks.has(key));
          const before = lastOrder.slice(0, Math.max(at, 0)).reverse().find((key) => rowEditLinks.has(key));
          // A control that was not a row (the empty state's Clear filters)
          // hands over to the first row the refresh brought.
          return rowEditLinks.get(after) || rowEditLinks.get(before) || rowEditLinks.values().next().value || null;
        }
        rowEditLinks = new Map();
        tbody.innerHTML = '';
        openMoreActions = null;
        if (!posts.length) {
          const tr = document.createElement('tr');
          tr.setAttribute('role', 'row');
          const td = document.createElement('td');
          td.colSpan = 7;
          td.setAttribute('role', 'cell');
          td.className = 'posts-empty';
          const message = document.createElement('p');
          message.textContent = allPosts.length
            ? 'No stories match these filters.'
            : 'No stories yet.';
          td.appendChild(message);
          let emptyAction;
          if (allPosts.length) {
            const clear = document.createElement('button');
            clear.id = 'clearEmptyFilters';
            clear.type = 'button';
            clear.className = 'btn-link';
            clear.textContent = 'Clear filters';
            clear.addEventListener('click', resetFilters);
            identify(clear, '', 'clear');
            emptyAction = clear;
            td.appendChild(clear);
          } else {
            const create = document.createElement('a');
            create.href = editorHref();
            create.className = 'action-link';
            create.textContent = 'Create a new story';
            identify(create, '', 'new');
            // The last story is gone: the New post command takes the focus.
            emptyAction = $('newPost');
            td.appendChild(create);
          }
          tr.appendChild(td);
          tbody.appendChild(tr);
          if (focusedControl) emptyAction.focus();
          return;
        }
        for (const p of posts) {
          const tr = document.createElement('tr');
          const controlsUnavailable = listStale || listMutating || p.publication?.availability !== 'available';
          tr.setAttribute('role', 'row');

          const tdSel = document.createElement('td');
          tdSel.className = 'col-select';
          tdSel.setAttribute('role', 'cell');
          tdSel.setAttribute('data-label', 'Select');
          if (me && me.isAdmin) {
            const selectLabel = document.createElement('label');
            selectLabel.className = 'post-row-select';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = selected.has(p.translationKey);
            cb.disabled = controlsUnavailable;
            cb.setAttribute('aria-label', 'Select ' + (p.title || 'untitled story'));
            identify(cb, p.translationKey, 'select');
            cb.addEventListener('change', () => {
              if (cb.checked) selected.add(p.translationKey); else selected.delete(p.translationKey);
              syncSelectAll();
              refreshBulkBar();
            });
            selectLabel.appendChild(cb);
            tdSel.appendChild(selectLabel);
          }
          tr.appendChild(tdSel);

          tr.appendChild(heroCell(p));

          const tdTitle = document.createElement('td');
          tdTitle.className = 'col-title';
          tdTitle.setAttribute('role', 'cell');
          tdTitle.setAttribute('data-label', 'Title');
          const titleLink = document.createElement('a');
          titleLink.href = editorHref(p.translationKey);
          titleLink.className = 'post-title-link';
          titleLink.setAttribute('aria-label', 'Edit ' + (p.title || 'untitled story'));
          titleLink.textContent = p.title || '(untitled)';
          identify(titleLink, p.translationKey, 'title');
          if (p.translationKey === focusedPost) matchingTitle = titleLink;
          tdTitle.appendChild(titleLink);
          const meta = tripMeta(p);
          if (meta) tdTitle.appendChild(meta);
          tr.appendChild(tdTitle);

          const tdStatus = document.createElement('td');
          tdStatus.className = 'col-status';
          tdStatus.setAttribute('role', 'cell');
          tdStatus.setAttribute('data-label', 'Status');
          const badge = document.createElement('span');
          const observed = listStale ? { availability: 'unavailable' } : p.publication;
          const state = PublicationState.publicationState(observed);
          badge.className = 'status-pill ' + (state === 'live' ? 'published' : 'draft');
          badge.textContent = PublicationState.label(observed, me?.isAdmin);
          tdStatus.appendChild(badge);
          const qualifier = me?.isAdmin ? PublicationState.qualifiers(observed, buildStatus) : '';
          if (qualifier) {
            const detail = document.createElement('p');
            detail.className = 'muted';
            detail.textContent = qualifier;
            tdStatus.appendChild(detail);
          }
          tr.appendChild(tdStatus);

          tr.appendChild(languagesCell(p));

          const tdUpdated = document.createElement('td');
          tdUpdated.className = 'col-updated posts-date';
          tdUpdated.setAttribute('role', 'cell');
          tdUpdated.setAttribute('data-label', 'Updated');
          tdUpdated.textContent = AdminFormat.date(p.updatedAt);
          tr.appendChild(tdUpdated);

          const tdActions = document.createElement('td');
          tdActions.className = 'col-actions';
          tdActions.setAttribute('role', 'cell');
          tdActions.setAttribute('data-label', 'Actions');
          const actions = document.createElement('div');
          actions.className = 'post-actions';
          const editLink = document.createElement('a');
          editLink.href = editorHref(p.translationKey);
          editLink.textContent = 'Edit';
          editLink.className = 'action-link';
          editLink.setAttribute('aria-label', 'Edit ' + (p.title || 'untitled story'));
          identify(editLink, p.translationKey, 'edit');
          rowEditLinks.set(p.translationKey, editLink);
          actions.appendChild(editLink);

          // Unpublish and Delete are admin-only, so an author's row offers Edit
          // alone. A published story has both and gets the More actions menu;
          // a draft has only Delete, which sits in the row as a plain button —
          // never a menu with one item.
          if (me && me.isAdmin) {
            const published = p.publication?.availability === 'available' && p.publication.status === 'published';
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.textContent = 'Delete';
            delBtn.className = 'btn-remove';
            delBtn.setAttribute('aria-label', 'Delete ' + (p.title || 'untitled story'));
            delBtn.disabled = controlsUnavailable;
            identify(delBtn, p.translationKey, 'delete');
            delBtn.addEventListener('click', () => deletePost(p, delBtn));
            if (!published) {
              actions.appendChild(delBtn);
            } else {
              const more = document.createElement('details');
              more.className = 'post-more';
              more.dataset.postKey = p.translationKey;
              const summary = document.createElement('summary');
              summary.textContent = 'More actions';
              summary.setAttribute('aria-label', 'More actions for ' + (p.title || 'untitled story'));
              identify(summary, p.translationKey, 'more');
              more.appendChild(summary);
              const moreActions = document.createElement('div');
              moreActions.className = 'post-more-actions';
              const unpubBtn = document.createElement('button');
              unpubBtn.type = 'button';
              unpubBtn.textContent = 'Unpublish';
              unpubBtn.className = 'btn-secondary';
              unpubBtn.disabled = controlsUnavailable;
              identify(unpubBtn, p.translationKey, 'unpublish');
              unpubBtn.addEventListener('click', () => unpublishPost(p, unpubBtn));
              moreActions.appendChild(unpubBtn);
              moreActions.appendChild(delBtn);
              more.appendChild(moreActions);
              wirePostDisclosure(more, summary);
              if (expandedPost === p.translationKey) {
                more.open = true;
                openMoreActions = more;
              }
              actions.appendChild(more);
            }
          }
          tdActions.appendChild(actions);
          tr.appendChild(tdActions);

          tbody.appendChild(tr);
        }
        if (focusedControl) {
          const target = nextFocus || matchingTitle || neighbourEdit() || $('newPost');
          target.focus({ preventScroll: !!nextFocus });
        }
      }

      function syncSelectAll() {
        // Non-admins get neither the visible control nor per-row checkboxes;
        // the server still enforces the role on every bulk request.
        const isAdmin = Boolean(me && me.isAdmin);
        $('selectAllControl').hidden = !isAdmin;
        if (!isAdmin) return;
        const visible = visiblePosts();
        const all = visible.length > 0 && visible.every((p) => selected.has(p.translationKey));
        const some = visible.some((p) => selected.has(p.translationKey));
        $('selectAll').checked = all;
        $('selectAll').indeterminate = !all && some;
      }

      function render(updateUrl) {
        const posts = visiblePosts();
        renderRows(posts);
        syncSelectAll();
        refreshBulkBar();
        updateFilterContext(posts);
        syncStatusViews();
        $('newPost').href = editorHref();
        if (updateUrl) syncFilterUrl();
        const selectionUnavailable = allPosts.some((post) => selected.has(post.translationKey) && post.publication?.availability !== 'available');
        for (const id of ['bulkPublish', 'bulkUnpublish', 'bulkDelete']) $(id).disabled = listStale || listMutating || selectionUnavailable;
        $('selectAll').disabled = listStale || listMutating;
        for (const menu of filterMenus) menu.sync();
      }

      function fillOptions(select, values) {
        // Keep the leading "All" option, replace the rest; preserve the current
        // choice across reloads when it still exists.
        const previous = select.value;
        while (select.options.length > 1) select.remove(1);
        for (const v of values) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        }
        select.value = values.includes(previous) ? previous : '';
      }

      function acceptMutation(key, publication) {
        publicationRefresh.invalidate();
        if (publication?.availability === 'missing') {
          allPosts = allPosts.filter((post) => post.translationKey !== key);
          selected.delete(key);
        } else {
          const post = allPosts.find((post) => post.translationKey === key);
          if (post) {
            post.publication = publication || { availability: 'unavailable' };
            if (publication?.availability === 'available') post.status = publication.status;
          }
        }
        render();
      }
      function applyPosts({ posts, status, language }) {
        const lang = SiteLanguage.accept(language);
        allPosts = posts;
        buildStatus = status;
        listStale = false;
        for (const key of selected) {
          if (!allPosts.some((post) => post.translationKey === key)) selected.delete(key);
        }
        const countries = PostsFilter.countries(allPosts);
        fillOptions($('fRegion'), PostsFilter.REGIONS);
        fillOptions($('fCountry'), countries);
        if (!filtersInitialized) {
          setFilterControls(PostsFilter.fromSearch(location.search, countries));
          filtersInitialized = true;
        }
        const secondary = lang.locales.find((locale) => locale !== lang.primary);
        const missingOption = $('missingSecondaryOption');
        missingOption.hidden = !secondary;
        missingOption.disabled = !secondary;
        missingOption.textContent = secondary ? SiteLanguage.text('BodyEmpty', { language: SiteLanguage.names[secondary] }) : SiteLanguage.text('MissingTranslation');
        const missingView = statusViewButtons.find(({ view }) => view.status === 'missing-secondary');
        missingView.button.hidden = !secondary;
        missingView.label.textContent = missingOption.textContent;
        if (!secondary && $('fStatus').value === 'missing-secondary') $('fStatus').value = '';
        const unavailable = allPosts.some((post) => PublicationState.publicationState(post.publication) === 'unavailable');
        $('loadMsg').hidden = !unavailable;
        $('loadMsg').textContent = unavailable ? PublicationState.text('unavailable') : '';
        $('retryLoad').hidden = !unavailable;
        $('filters').hidden = false;
        $('statusViews').hidden = false;
        $('postsTable').hidden = false;
        render(true);
      }
      const publicationRefresh = PublicationRefresh.create({
        async read(signal, publish) {
          const [facts, status] = await Promise.all([
            Promise.all([
              PublicationRefresh.json('/posts', signal),
              PublicationRefresh.json('/language', signal),
            ]).then(([posts, language]) => {
              if (!Array.isArray(posts)) throw new Error('invalid_posts');
              const facts = { posts, language, status: null };
              publish(facts);
              return facts;
            }),
            me?.isAdmin ? PublicationRefresh.json('/rebuild/status', signal).catch((error) => {
              if (error.status === 401) throw error;
              return null;
            }) : null,
          ]);
          return { ...facts, status };
        },
        apply: applyPosts,
        unavailable() {
          listStale = true;
          buildStatus = null;
          $('loadMsg').hidden = false;
          $('loadMsg').setAttribute('role', 'alert');
          $('loadMsg').textContent = PublicationState.text('stale');
          $('retryLoad').hidden = false;
          render();
        },
        unauthorized() { location.href = '/login'; },
      });
      function load(statusMsg) {
        if (statusMsg != null) $('out').textContent = statusMsg;
        publicationRefresh.start(false);
        return publicationRefresh.refresh();
      }
      $('retryLoad').textContent = PublicationState.text('refresh');

      for (const id of ['fSearch', 'fStatus', 'fRegion', 'fCountry', 'fSort', 'fOrder']) {
        $(id).addEventListener('input', () => render(true));
      }
      $('fReset').addEventListener('click', resetFilters);
      $('fMore').addEventListener('click', () => {
        const extra = $('fExtra');
        extra.hidden = !extra.hidden;
        $('fMore').setAttribute('aria-expanded', extra.hidden ? 'false' : 'true');
        updateFilterContext(visiblePosts());
      });

      $('selectAll').addEventListener('change', () => {
        if (!me || !me.isAdmin) return; // belt-and-braces; the box is hidden too
        const visible = visiblePosts();
        if ($('selectAll').checked) visible.forEach((p) => selected.add(p.translationKey));
        else visible.forEach((p) => selected.delete(p.translationKey));
        render();
      });

      $('clearSelection').addEventListener('click', clearSelection);
      // Escape inside the bar closes Review selection first, then clears the
      // selection like Clear selection. A held key (repeat) or an Escape a menu
      // or dialog already handled does nothing.
      $('bulkBar').addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || event.repeat || event.defaultPrevented) return;
        event.preventDefault();
        const review = $('selectionReview');
        if (review.open) {
          review.open = false;
          $('selectionReviewSummary').focus();
          return;
        }
        clearSelection();
      });
      // A checkbox's label is its hit area. Its default would focus the box with
      // a scroll, and the bar's scroll padding counts the bottom strip as out of
      // view, so a click on the label (not the box) toggles without scrolling.
      $('postsTable').addEventListener('click', (event) => {
        const label = event.target;
        if (!label || !label.classList || !(label.classList.contains('post-row-select') || label.classList.contains('post-select-all'))) return;
        const box = label.querySelector('input');
        if (!box) return;
        event.preventDefault();
        box.focus({ preventScroll: true });
        box.click();
      });
      // The runway follows the tallest the bar has been (it wraps on narrow
      // screens); it never shrinks, so hiding the bar cannot move the list.
      let bulkBarHeight = 0;
      new ResizeObserver(() => {
        const height = $('bulkBar').offsetHeight;
        if (height <= bulkBarHeight) return;
        bulkBarHeight = height;
        document.body.style.setProperty('--bulk-bar-h', height + 'px');
      }).observe($('bulkBar'));
      $('retryLoad').addEventListener('click', () => load());

      $('bulkPublish').addEventListener('click', () => runBulk('publish'));
      $('bulkUnpublish').addEventListener('click', () => runBulk('unpublish'));
      $('bulkDelete').addEventListener('click', () => runBulk('delete'));

      $('exportAll').addEventListener('click', async () => {
        const btn = $('exportAll');
        const restoreFocus = AdminFocus.hold(btn);
        btn.disabled = true;
        $('out').textContent = 'Exporting…';
        try {
          const res = await fetch('/export', { method: 'POST' });
          if (res.status === 401) { location.href = '/login'; return; }
          const body = await res.json().catch(() => ({}));
          $('out').textContent = res.ok
            ? 'Exported ' + AdminFormat.count(body.count, 'MDX file') + ' to the configured server backup directory.'
            : 'Could not export: ' + (body.error || res.status) + '.';
        } catch (e) {
          $('out').textContent = 'Could not export: the connection failed.';
        } finally {
          btn.disabled = false;
          restoreFocus();
        }
      });

      (async () => {
        me = await Auth.ensureAuthed();
        if (!me) return;
        Auth.renderHeader(me);
        // An editor that just deleted its story returns here with the outcome.
        const flash = AdminFlash.take();
        if (flash) $('out').textContent = flash;
        publicationRefresh.start();
      })();
    </script>
  </body>
</html>
