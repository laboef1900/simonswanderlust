<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Media</h1>
      <p class="lede">Drop photos to upload them, sort them into folders, and give each one a title, alt text and caption. Uploads return immediately — the responsive variants encode in the background.</p>
    </header>

    <main>
      <section class="card">
        <div id="dropZone" class="drop-zone">
          <p><strong>Drop photos here</strong> to upload them into the selected folder.</p>
          <!-- Drag-and-drop is an enhancement; the visible file input is the
               real control, so the feature is keyboard-operable. -->
          <label class="drop-zone__pick">
            <span>Or choose files</span>
            <input id="fileInput" type="file" accept="image/*" multiple />
          </label>
        </div>
        <div id="uploadQueue" class="upload-queue" hidden></div>
      </section>

      <section class="card media-layout">
        <aside class="media-sidebar">
          <p class="section-label">Folders</p>
          <ul id="folderTree" class="folder-tree"></ul>
          <div class="folder-actions">
            <button id="newFolder" type="button" class="btn-secondary">New folder</button>
            <button id="renameFolder" type="button" class="btn-secondary">Rename</button>
            <button id="deleteFolder" type="button" class="btn-remove">Delete</button>
          </div>
        </aside>

        <div class="media-main">
          <div class="posts-filters">
            <label class="filter-field">
              <span>Search</span>
              <input id="fSearch" type="search" placeholder="Key, title, alt or caption" autocomplete="off" />
            </label>
            <label class="filter-field">
              <span>Status</span>
              <select id="fStatus">
                <option value="">All</option>
                <option value="ready">Ready</option>
                <option value="processing">Processing</option>
                <option value="failed">Failed</option>
                <option value="missing">Missing</option>
              </select>
            </label>
            <button type="button" id="fMore" class="btn-link filter-reset" aria-expanded="false" aria-controls="fExtra">More filters</button>
            <div class="posts-filters-extra" id="fExtra" hidden>
              <label class="filter-field">
                <span>Sort</span>
                <select id="fSort">
                  <option value="uploaded">Uploaded</option>
                  <option value="taken">Taken</option>
                  <option value="title">Title</option>
                  <option value="key">Key</option>
                </select>
              </label>
              <label class="filter-field">
                <span>Order</span>
                <select id="fOrder">
                  <option value="desc">Descending</option>
                  <option value="asc">Ascending</option>
                </select>
              </label>
              <label class="filter-field filter-field--check">
                <span>Subfolders</span>
                <input id="fRecursive" type="checkbox" checked />
              </label>
              <button id="rescan" type="button" class="btn-secondary">Rescan disk</button>
            </div>
          </div>

          <div class="bulk-bar" id="bulkTools" hidden>
            <span id="selCount" aria-live="polite"></span>
            <label class="filter-field">
              <span>Move to</span>
              <select id="moveTarget"></select>
            </label>
            <button id="moveSelected" type="button" class="btn-secondary">Move</button>
            <button id="retrySelected" type="button" class="btn-secondary">Retry encoding</button>
            <button id="clearSelection" type="button" class="btn-secondary">Clear</button>
          </div>

          <!-- aria-multiselectable + roving tabindex: arrows move focus, Space
               toggles, Shift+Arrow extends, Ctrl/Cmd+A selects all. -->
          <div id="grid" class="media-grid" role="listbox" aria-multiselectable="true" aria-label="Photos"></div>

          <div class="media-pager">
            <button id="prevPage" type="button" class="btn-secondary">Previous</button>
            <span id="pageInfo" class="muted"></span>
            <button id="nextPage" type="button" class="btn-secondary">Next</button>
          </div>
        </div>

        <aside id="detail" class="media-detail"></aside>
      </section>
      <p id="out" class="page-status" role="status"></p>

    </main>

    <script src="/admin/auth.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script src="/admin/media-api.js"></script>
    <script src="/admin/media-browser.js"></script>
  </body>
</html>
