<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>About Page · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="stylesheet" href="/admin/vendor/easymde.min.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <nav id="mainnav" aria-label="Admin"></nav>
        <p class="eyebrow">Expedition Log · Image Station</p>
        <h1>About page</h1>
        <p class="muted" id="whoami"></p>
      </div>
    </header>
    <main>
      <div class="tabs-bar" role="tablist" aria-label="Page language">
        <button type="button" class="tab-btn active" role="tab" id="tabbtn-de" aria-selected="true" aria-controls="tab-de" data-tab="de">Deutsch (DE)</button>
        <button type="button" class="tab-btn" role="tab" id="tabbtn-en" aria-selected="false" tabindex="-1" aria-controls="tab-en" data-tab="en">English (EN)</button>
      </div>

      <section id="tab-de" class="card locale-tab" role="tabpanel" aria-labelledby="tabbtn-de">
        <h2 class="card-heading">Deutsch</h2>
        <label for="deTitle">Heading</label>
        <input id="deTitle" type="text" placeholder="Über mich" />
        <label for="deBody">Body (Markdown)</label>
        <textarea id="deBody"></textarea>
        <div class="body-img-row">
          <input id="deBodyImgFile" type="file" accept="image/*" aria-label="Body image file (DE)" />
          <input id="deBodyImgAlt" type="text" placeholder="Alt text (DE)" aria-label="Alt text for body image (DE)" />
          <button type="button" id="deBodyImgUpload" class="btn-secondary">Insert body image</button>
          <p id="deBodyImgStatus" class="muted" role="status"></p>
        </div>
      </section>

      <section id="tab-en" class="card locale-tab" role="tabpanel" aria-labelledby="tabbtn-en" hidden>
        <h2 class="card-heading">English</h2>
        <label for="enTitle">Heading</label>
        <input id="enTitle" type="text" placeholder="About me" />
        <label for="enBody">Body (Markdown)</label>
        <textarea id="enBody"></textarea>
        <div class="body-img-row">
          <input id="enBodyImgFile" type="file" accept="image/*" aria-label="Body image file (EN)" />
          <input id="enBodyImgAlt" type="text" placeholder="Alt text (EN)" aria-label="Alt text for body image (EN)" />
          <button type="button" id="enBodyImgUpload" class="btn-secondary">Insert body image</button>
          <p id="enBodyImgStatus" class="muted" role="status"></p>
        </div>
      </section>

      <div class="editor-actions card">
        <button id="saveBtn" class="btn-publish">Save &amp; rebuild</button>
        <p id="actionStatus" class="muted" role="status"></p>
        <p id="actionError" class="err" role="alert" style="display:none"></p>
      </div>

      <section class="card" id="revisionsCard" hidden aria-labelledby="revisionsHeading">
        <h2 class="card-heading" id="revisionsHeading">Revisions</h2>
        <p class="muted">The page as it was before each save (last 20 kept). Restoring fills the editor; nothing changes on the site until you save.</p>
        <ul id="revisionsList" class="revisions-list"></ul>
        <p id="revisionsEmpty" class="muted" hidden>No revisions yet.</p>
      </section>
    </main>

    <script src="/admin/auth.js"></script>
    <script src="/admin/draft-guard.js"></script>
    <script src="/admin/vendor/easymde.min.js"></script>
    <script src="/admin/tabs.js"></script>
    <script src="/admin/image-markdown.js"></script>
    <script>
      'use strict';
      const $ = (id) => document.getElementById(id);
      const KEY = 'about';
      const deImages = {}, enImages = {};
      // updatedAt of the page as loaded/last saved in THIS tab. Echoed back on
      // every save so the server can 409 when another tab saved meanwhile (#141).
      let loadedUpdatedAt = null;

      // EasyMDE's built-in autosave stays disabled — DraftGuard below stashes the
      // full form (both locales) instead.
      const deMDE = new EasyMDE({ element: $('deBody'), spellChecker: false, autosave: { enabled: false },
        toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'unordered-list', 'ordered-list', '|', 'link', 'image', '|', 'preview'] });
      const enMDE = new EasyMDE({ element: $('enBody'), spellChecker: false, autosave: { enabled: false },
        toolbar: ['bold', 'italic', 'heading', '|', 'quote', 'unordered-list', 'ordered-list', '|', 'link', 'image', '|', 'preview'] });
      // EasyMDE hides the labelled <textarea> and types into CodeMirror's own
      // input, which starts nameless — a screen reader would hear "edit text".
      deMDE.codemirror.getInputField().setAttribute('aria-label', 'Body (Markdown, DE)');
      enMDE.codemirror.getInputField().setAttribute('aria-label', 'Body (Markdown, EN)');

      // ---- draft guard: dirty tracking, beforeunload warning, local autosave ----
      const guard = DraftGuard.createDraftGuard({
        storageKey: 'swl:draft:about',
        collect: () => ({ de: localeObj('de'), en: localeObj('en') }),
      });
      const mainEl = document.querySelector('main');
      mainEl.addEventListener('input', () => guard.markDirty());
      mainEl.addEventListener('change', () => guard.markDirty());
      deMDE.codemirror.on('change', () => guard.markDirty());
      enMDE.codemirror.on('change', () => guard.markDirty());

      Tabs.wire(document.querySelector('[role="tablist"]'), {
        onChange: (tab) => { (tab === 'en' ? enMDE : deMDE).codemirror.refresh(); },
      });

      function showErr(msg) { const el = $('actionError'); el.textContent = msg; el.style.display = msg ? '' : 'none'; }
      function setStatus(msg) { $('actionStatus').textContent = msg; }

      async function uploadBodyImg(locale) {
        const fileInput = $(locale + 'BodyImgFile'), altInput = $(locale + 'BodyImgAlt'), statusEl = $(locale + 'BodyImgStatus');
        const file = fileInput.files[0];
        if (!file) { statusEl.textContent = 'Pick a file first.'; return; }
        const imgSlug = file.name.replace(/\.[^.]+$/, '').replace(/[^a-z0-9-]/gi, '-').toLowerCase();
        statusEl.textContent = 'Uploading…';
        const fd = new FormData();
        fd.append('key', 'pages/about/' + imgSlug);
        fd.append('alt', altInput.value);
        fd.append('file', file);
        try {
          const res = await fetch('/upload', { method: 'POST', body: fd });
          if (res.status === 401) { guard.redirectToLogin(); return; }
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { statusEl.textContent = 'Upload failed: ' + (body.error || res.status); return; }
          (locale === 'de' ? deImages : enImages)[body.src] = { width: body.width, height: body.height };
          // replaceSelection fires a CodeMirror change → marks the guard dirty
          (locale === 'de' ? deMDE : enMDE).codemirror.replaceSelection(ImageMarkdown.image(altInput.value, body.src));
          statusEl.textContent = 'Inserted: ' + body.src;
          fileInput.value = ''; altInput.value = '';
        } catch (e) {
          statusEl.textContent = 'Upload failed: ' + e;
        }
      }
      $('deBodyImgUpload').addEventListener('click', () => uploadBodyImg('de'));
      $('enBodyImgUpload').addEventListener('click', () => uploadBodyImg('en'));

      function localeObj(loc) {
        return { locale: loc, title: $(loc + 'Title').value.trim(),
          bodyMarkdown: (loc === 'de' ? deMDE : enMDE).value(), images: { ...(loc === 'de' ? deImages : enImages) } };
      }

      $('saveBtn').addEventListener('click', async () => {
        showErr(''); setStatus('Saving & rebuilding…');
        // The synchronous astro rebuild makes this request slow (tens of
        // seconds); snapshot first so text typed mid-save survives markClean.
        const snap = guard.snapshot();
        // Concurrency echo — JSON.stringify drops it when undefined (never-saved key).
        const payload = { updatedAt: loadedUpdatedAt || undefined, de: localeObj('de'), en: localeObj('en') };
        try {
          const res = await fetch('/pages/' + KEY, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
          if (res.status === 401) { guard.redirectToLogin(); return; }
          if (res.status === 403) { showErr('Only admins can save the About page.'); setStatus(''); return; }
          const body = await res.json().catch(() => ({}));
          if (res.status === 409 && body.code === 'conflict') {
            setStatus('');
            showErr(body.error || 'The About page was modified since you opened it — nothing was saved.');
            const reload = confirm(
              'The About page was changed elsewhere (another tab or user) since you opened it, '
              + 'so saving would overwrite those changes. Nothing was saved and the site was not rebuilt.\n\n'
              + 'OK — reload the latest version into the editor (your edits in this tab are lost).\n'
              + 'Cancel — keep your edits on screen so you can copy them out first.'
            );
            // Reloaded from the server: settle the guard on what is now on screen.
            if (reload) { await loadPage(); guard.markClean(guard.snapshot()); showErr(''); }
            return;
          }
          if (!res.ok) { showErr(body.error || ('Save failed: ' + res.status)); setStatus(''); return; }
          if (body.build && !body.build.ok) { showErr('Build error: ' + (body.build.error || 'unknown')); setStatus(''); return; }
          const release = (body.build && body.build.release) ? ' (release ' + body.build.release + ')' : '';
          guard.markClean(snap); // saved server-side — no-op if edits landed mid-save
          // Re-sync the echo with what this save wrote, and refresh the list
          // (this save snapshotted the previous state).
          if (body.saved && body.saved.updatedAt) loadedUpdatedAt = body.saved.updatedAt;
          loadRevisions().catch(() => {});
          setStatus('Saved & rebuilt ✓' + release);
        } catch (e) {
          showErr('Save failed: ' + e);
          setStatus('');
        }
      });

      // ---- revisions (#141): same shape as the post editor's card ----
      async function loadRevisions() {
        const res = await fetch('/pages/' + KEY + '/revisions');
        if (!res.ok) return; // non-fatal: the card just stays as-is
        const revs = await res.json();
        $('revisionsCard').hidden = false;
        $('revisionsEmpty').hidden = revs.length > 0;
        const ul = $('revisionsList');
        ul.textContent = '';
        revs.forEach((rev) => {
          const li = document.createElement('li');
          li.className = 'revision-row';
          const label = document.createElement('span');
          const when = new Date(rev.savedAt).toLocaleString();
          label.textContent = when + ' — ' + (rev.titleDe || '(untitled)');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-secondary';
          btn.textContent = 'Restore into editor';
          btn.setAttribute('aria-label', 'Restore the revision from ' + when + ' into the editor');
          btn.addEventListener('click', () => { restoreRevision(rev.id); });
          li.appendChild(label);
          li.appendChild(btn);
          ul.appendChild(li);
        });
      }

      // Fills the form from a snapshot; persisting still goes through the
      // normal Save (validation applies, and the overwritten state gets its
      // own revision) — there is no direct server-side restore.
      async function restoreRevision(id) {
        showErr('');
        const res = await fetch('/pages/' + KEY + '/revisions/' + encodeURIComponent(id));
        if (res.status === 401) { guard.redirectToLogin(); return; }
        if (!res.ok) { showErr('Could not load revision: ' + res.status); return; }
        const rev = await res.json();
        fill('de', rev.snapshot.de); fill('en', rev.snapshot.en);
        enMDE.codemirror.refresh();
        guard.markDirty();
        setStatus('Restored the revision from ' + new Date(rev.savedAt).toLocaleString()
          + ' into the editor — review it, then Save & rebuild to keep it.');
      }

      async function loadPage() {
        const res = await fetch('/pages/' + KEY);
        if (res.status === 401) { guard.redirectToLogin(); return; }
        if (!res.ok) { setStatus('Could not load: ' + res.status); return; }
        const p = await res.json();
        fill('de', p.de); fill('en', p.en);
        loadedUpdatedAt = p.updatedAt || null;
        enMDE.codemirror.refresh();
        setStatus('Loaded.');
        loadRevisions().catch(() => {});
      }

      function fill(loc, data) {
        if (!data) return;
        $(loc + 'Title').value = data.title || '';
        (loc === 'de' ? deMDE : enMDE).value(data.bodyMarkdown || '');
        if (data.images) Object.assign(loc === 'de' ? deImages : enImages, data.images);
      }

      (async () => {
        const s = await Auth.ensureAuthed();
        if (!s) return;
        Auth.renderHeader(s);
        if (!s.isAdmin) { showErr('You are signed in as an author; only admins can edit the About page.'); $('saveBtn').disabled = true; }
        try {
          await loadPage();
        } catch (e) {
          setStatus('Could not load: ' + e);
        }
        // Offer to restore locally stashed changes; filling above fired CodeMirror
        // change events, so settle the guard's dirty state here either way.
        const stash = guard.tryRestore();
        if (stash && !guard.wasDismissed(stash)
            && confirm('Found unsaved About-page changes from ' + new Date(stash.savedAt).toLocaleString() + '. Restore them?')) {
          fill('de', stash.payload.de); fill('en', stash.payload.en);
          enMDE.codemirror.refresh();
          guard.markDirty();
          setStatus('Restored unsaved changes — remember to Save.');
        } else if (stash) {
          // Declined (or already dismissed this session): keep the stash so a
          // misclicked Cancel can't destroy unsaved work — just disarm dirty and
          // remember the dismissal so it isn't re-offered on every reload.
          guard.dismissRestore(stash);
        } else {
          guard.markClean();
        }
      })();
    </script>
  </body>
</html>
