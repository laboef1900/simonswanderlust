<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="stylesheet" href="/admin/vendor/easymde.min.css" />
  </head>
  <body class="page-editor">
    <header class="cms-page-meta">
      <h1 id="pageHeading"></h1>
    </header>
    <main>
      <!-- The shared editor command bar: Back and the locale tabs on the left, actions on the right, status beneath. -->
      <div class="commandbar">
        <div class="commandbar__nav">
          <a id="pagesBack" class="action-link commandbar__back" href="/admin/pages.html" data-pages-copy="Back"></a>
          <div class="lang-switch-bar" role="tablist" aria-label="Page language">
            <button type="button" class="tab-btn active" role="tab" id="tabbtn-de" aria-selected="true" aria-controls="tab-de" data-tab="de">Deutsch <span class="lang-code" aria-hidden="true">DE</span></button>
            <button type="button" class="tab-btn" role="tab" id="tabbtn-en" aria-selected="false" tabindex="-1" aria-controls="tab-en" data-tab="en">English <span class="lang-code" aria-hidden="true">EN</span></button>
          </div>
        </div>
        <div class="commandbar__actions">
          <button id="saveBtn" type="button" class="commandbar__save" data-pages-copy="Save"></button>
          <button id="publishBtn" type="button" class="btn-primary-publish" data-pages-copy="Publish" hidden></button>
          <button id="previewBtn" type="button" class="btn-secondary" data-pages-copy="Preview" disabled></button>
          <button id="unpublishBtn" type="button" class="btn-secondary" data-pages-copy="Unpublish" hidden></button>
          <button id="deleteBtn" type="button" class="btn-remove" data-pages-copy="Delete" hidden></button>
        </div>
        <div class="commandbar__status">
          <p id="pageState" class="muted" role="status"></p>
          <p id="actionStatus" class="muted" role="status"></p>
          <p id="actionError" class="err" role="alert" hidden></p>
        </div>
      </div>
      <p id="legalNote" class="muted" data-pages-copy="LegalNote" hidden></p>
      <p id="preparationNotice" class="muted" role="status" hidden></p>
      <a id="languageSettingsLink" href="/admin/settings.html#language" data-language-copy="Back" hidden></a>
      <div id="galleryMetadataWarnings" class="notice-warn" hidden></div>

      <section id="tab-de" class="card locale-tab" role="tabpanel" aria-labelledby="tabbtn-de">
        <label for="deTitle">Heading (DE)</label>
        <input id="deTitle" type="text" />
        <div id="deSlugFields" hidden><label id="deSlugLabel" for="deSlug"></label>
          <input id="deSlug" type="text" pattern="[a-z0-9][a-z0-9-]*" aria-describedby="deSlugHelp">
          <p id="deSlugHelp" class="muted" data-pages-copy="SlugHelp"></p></div>
        <!-- The story editor's manuscript: one toolbar, a Photo tray, and the
             Visual and Markdown views of the same body. The bar pins under the
             command bar; inserts go in at the cursor. A roving toolbar: one Tab
             stop, arrow keys inside. -->
        <div class="page-manuscript">
          <h2 class="section-label" id="deBodyLabel">Body (DE)</h2>
          <div class="manuscript-tools" data-locale="de">
            <div class="manuscript-bar" id="deManuscriptBar" role="toolbar" aria-label="Body tools (DE)">
              <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="deFormatToggle" aria-expanded="false" aria-controls="deFormatPanel" hidden></button>
              <div class="manuscript-format" id="deFormatPanel">
                <div class="manuscript-bar__group">
                  <button type="button" class="manuscript-bar__btn" data-format="bold" aria-label="Bold"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="italic" aria-label="Italic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-9"/><path d="M14 20H5"/><path d="M15 4 9 20"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="heading" aria-label="Heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/><path d="M6 20V4"/><path d="M18 20V4"/></svg></button>
                </div>
                <div class="manuscript-bar__group">
                  <button type="button" class="manuscript-bar__btn" data-format="quote" aria-label="Quote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6H3"/><path d="M21 12H8"/><path d="M21 18H8"/><path d="M3 12v6"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="bullets" aria-label="Bulleted list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="numbers" aria-label="Numbered list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="link" aria-label="Link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/><path d="m14 3-4 18"/></svg></button>
                </div>
              </div>
              <div class="manuscript-bar__group">
                <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="dePhotoToggle" aria-expanded="false" aria-controls="dePhotoPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>Photo</button>
              </div>
              <div class="manuscript-bar__group manuscript-bar__group--view">
                <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="deVisualMode" data-editor-mode="visual" aria-controls="deRichBody" aria-pressed="false"></button>
                <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="deMarkdownMode" data-editor-mode="markdown" aria-controls="deMarkdownBody" aria-pressed="true"></button>
              </div>
            </div>
            <p id="deBodyImgStatus" class="muted manuscript-tools__status" role="status"></p>
            <div class="manuscript-photo" id="dePhotoPanel" role="group" aria-label="Insert a photo (DE)" hidden>
              <div class="manuscript-photo__fields">
                <div>
                  <label for="deBodyImgFile">Photo file</label>
                  <input id="deBodyImgFile" type="file" accept="image/*" class="hero-file-input" />
                </div>
                <div>
                  <label for="deBodyImgAlt">Alt text (DE)</label>
                  <input id="deBodyImgAlt" type="text" />
                </div>
              </div>
              <div class="manuscript-photo__actions">
                <button type="button" id="deBodyImgUpload">Upload and insert</button>
                <p class="muted">Goes in at the cursor.</p>
              </div>
            </div>
          </div>
          <p id="deRichError" class="notice-warn" role="alert" hidden></p>
          <div id="deRichBody" class="rich-text-editor" hidden></div>
          <div id="deMarkdownBody" class="markdown-editor">
            <label for="deBody" hidden>Body (Markdown)</label>
            <textarea id="deBody" aria-label="Body (Markdown, DE)"></textarea>
          </div>
        </div>
        <section id="deGearSection" class="about-gear" aria-labelledby="deGearHeading" hidden>
          <h2 id="deGearHeading" class="section-label"></h2>
          <p id="deGearHelp" class="muted"></p>
          <label id="deGearLabel" for="deGear"></label>
          <input id="deGear" type="text" lang="de" autocomplete="off" aria-describedby="deGearHelp deGearCount deGearError" disabled>
          <p id="deGearCount" class="muted about-gear__count"></p>
          <p id="deGearError" class="err" role="alert" tabindex="-1" hidden></p>
          <div class="form-actions">
            <button id="deGearSave" type="button" disabled></button>
            <button id="deGearReload" type="button" class="btn-secondary" hidden></button>
          </div>
          <p id="deGearStatus" class="muted" role="status"></p>
          <p class="muted about-gear__timing"><span id="deGearTiming"></span> <a id="deGearSettings" href="/admin/settings.html#identity"></a></p>
        </section>
      </section>

        <div class="page-manuscript">
          <h2 class="section-label" id="enBodyLabel">Body (EN)</h2>

            <div class="manuscript-bar" id="enManuscriptBar" role="toolbar" aria-label="Body tools (EN)">
              <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="enFormatToggle" aria-expanded="false" aria-controls="enFormatPanel" hidden></button>
              <div class="manuscript-format" id="enFormatPanel">
                <div class="manuscript-bar__group">
                  <button type="button" class="manuscript-bar__btn" data-format="bold" aria-label="Bold"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="italic" aria-label="Italic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-9"/><path d="M14 20H5"/><path d="M15 4 9 20"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="heading" aria-label="Heading"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/><path d="M6 20V4"/><path d="M18 20V4"/></svg></button>
                </div>
                <div class="manuscript-bar__group">
                  <button type="button" class="manuscript-bar__btn" data-format="quote" aria-label="Quote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6H3"/><path d="M21 12H8"/><path d="M21 18H8"/><path d="M3 12v6"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="bullets" aria-label="Bulleted list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="numbers" aria-label="Numbered list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="link" aria-label="Link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
                  <button type="button" class="manuscript-bar__btn" data-format="code"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/><path d="m14 3-4 18"/></svg></button>
                </div>
              </div>
              <div class="manuscript-bar__group">
                <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="enPhotoToggle" aria-expanded="false" aria-controls="enPhotoPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>Photo</button>
              </div>
              <div class="manuscript-bar__group manuscript-bar__group--view">
                <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="enVisualMode" data-editor-mode="visual" aria-controls="enRichBody" aria-pressed="false"></button>
                <button type="button" class="manuscript-bar__btn manuscript-bar__btn--text" id="enMarkdownMode" data-editor-mode="markdown" aria-controls="enMarkdownBody" aria-pressed="true"></button>

            </div>
            <p id="enBodyImgStatus" class="muted manuscript-tools__status" role="status"></p>
            <div class="manuscript-photo" id="enPhotoPanel" role="group" aria-label="Insert a photo (EN)" hidden>
              <div class="manuscript-photo__fields">
                <div>
                  <label for="enBodyImgFile">Photo file</label>
                  <input id="enBodyImgFile" type="file" accept="image/*" class="hero-file-input" />

                <div>
                  <label for="enBodyImgAlt">Alt text (EN)</label>
                  <input id="enBodyImgAlt" type="text" />

              </div>
              <div class="manuscript-photo__actions">
                <button type="button" id="enBodyImgUpload">Upload and insert</button>

          <div id="enRichBody" class="rich-text-editor" hidden></div>
          <div id="enMarkdownBody" class="markdown-editor">
            <label for="enBody" hidden>Body (Markdown)</label>
            <textarea id="enBody" aria-label="Body (Markdown, EN)"></textarea>

        <section id="enGearSection" class="about-gear" aria-labelledby="enGearHeading" hidden>
          <h2 id="enGearHeading" class="section-label"></h2>
          <p id="enGearHelp" class="muted"></p>
          <label id="enGearLabel" for="enGear"></label>
          <input id="enGear" type="text" lang="en" autocomplete="off" aria-describedby="enGearHelp enGearCount enGearError" disabled>
          <p id="enGearCount" class="muted about-gear__count"></p>
          <p id="enGearError" class="err" role="alert" tabindex="-1" hidden></p>

      <section class="card" id="revisionsCard" hidden aria-labelledby="revisionsHeading">
        <h2 class="card-heading" id="revisionsHeading">Revisions</h2>
        <p class="muted">The page as it was before each save (last 20 kept). Restoring fills the editor; nothing changes on the site until you save.</p>
        <ul id="revisionsList" class="revisions-list"></ul>
        <p id="revisionsEmpty" class="muted" hidden>No revisions yet.</p>
      </section>

    <script src="/admin/admin-ui.js"></script>
    <script src="/admin/build-reporting.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/language.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script src="/admin/draft-guard.js"></script>
    <script src="/admin/write-recovery.js"></script>
    <script src="/admin/vendor/easymde.min.js"></script>
    <script src="/admin/vendor/editor-rich-text.js"></script>
    <script src="/admin/editor-rich-bridge.js"></script>
    <script src="/admin/manuscript-bar.js"></script>
    <script src="/admin/media-api.js"></script>
    <script src="/admin/upload-recovery.js"></script>
    <script src="/admin/image-markdown.js"></script>
    <!-- PostsFilter.thumbUrl(): the Visual view's gallery previews use the same
         never-upscale variant rule the posts list does. -->
    <script src="/admin/posts-filter.js"></script>
    <script src="/admin/tabs.js"></script>
    <script src="/admin/pages-ui.js"></script>
    <script src="/admin/about-equipment.js"></script>
    <script src="/admin/gallery-library.js"></script>
    <script src="/admin/gallery-metadata-warnings.js"></script>
    <script type="module">
      import './gallery-fence.js';
      'use strict';
      const $ = (id) => document.getElementById(id);
      const KEY = new URLSearchParams(location.search).get('key') || 'about';
      const editorCopy = EditorCopy.en;
      PagesUI.localize(document);
      SiteLanguage.localize(document);
      $('pageHeading').textContent = PagesUI.text('Heading', { kind: PagesUI.kind(KEY) });
      Auth.setPageTitle($('pageHeading').textContent);
      for (const locale of ['de', 'en']) $(locale + 'SlugLabel').textContent = PagesUI.text('Slug', { code: locale.toUpperCase() });
      let storedPage = null;
      let pageDefaults = null;
      const deImages = {}, enImages = {};
      // updatedAt of the page as loaded/last saved in THIS tab. Echoed back on
      // every save so the server can 409 when another tab saved meanwhile (#141).
      let loadedUpdatedAt = null;
      let language = null;
      const prepareLocale = new URLSearchParams(location.search).get('prepareLocale');
      let editableLocales = [];
      let writeRecovery = null;
      let loadBlocked = true;
      let confirmingSave = false;

      // ---- the manuscript: EasyMDE holds the one Markdown body; the bridge adds the Visual view ----
      // EasyMDE's built-in autosave stays disabled — DraftGuard below stashes the
      // full form (both locales) instead. The shared manuscript bar is the
      // toolbar; EasyMDE's read-only preview/fullscreen shortcuts are disabled
      // so they cannot hide the synchronized writing surface.
      const MDE_OPTIONS = {
        spellChecker: false,
        autoDownloadFontAwesome: false,
        autosave: { enabled: false },
        toolbar: false,
        shortcuts: { togglePreview: null, toggleSideBySide: null, toggleFullScreen: null },
      };
      const deMDE = new EasyMDE({ ...MDE_OPTIONS, element: $('deBody') });
      const enMDE = new EasyMDE({ ...MDE_OPTIONS, element: $('enBody') });
      const mdeFor = (locale) => (locale === 'en' ? enMDE : deMDE);
      // EasyMDE hides the labelled <textarea> and types into CodeMirror's own
      // input, which starts nameless — a screen reader would hear "edit text".
      deMDE.codemirror.getInputField().setAttribute('aria-label', 'Body (Markdown, DE)');
      enMDE.codemirror.getInputField().setAttribute('aria-label', 'Body (Markdown, EN)');

      // ---- draft guard: dirty tracking, beforeunload warning, local autosave ----
      const guard = DraftGuard.createDraftGuard({
        // A save sends only this mode's locales; it must never clean another mode's copy.
        resource: 'page:' + KEY + (prepareLocale ? ':prepare:' + prepareLocale : ''),
        recovery: () => writeRecovery?.exportState(),
        collect: () => ({ de: localeObj('de'), en: localeObj('en') }),
      });
      writeRecovery = WriteRecovery.create({
        kind: 'pages', guard, copy: editorCopy, anchor: $('actionError'),
        resourceId: () => KEY, base: () => loadedUpdatedAt,
        collect: () => ({ de: localeObj('de'), en: localeObj('en') }),
        // A conflict is compared field by field, in words; only the fields that differ are shown.
        describe: (version) => editableLocales.flatMap((locale) => {
          const code = locale.toUpperCase(), fields = version?.[locale] || {};
          return [
            { label: 'Heading (' + code + ')', value: fields.title || '' },
            ...(KEY === 'about' ? [] : [{ label: 'Slug (' + code + ')', value: fields.slug || '' }]),
            { label: 'Body (' + code + ')', value: fields.bodyMarkdown || '' },
          ];
        }),
        restoreBase: (value) => { loadedUpdatedAt = value; },
        error: (body, status) => { showErr(body?.error || (editorCopy.writeRefused + ' ' + status)); setStatus(''); },
        adopt: async (saved, attempt, acknowledgement) => {
          acceptSaved(saved);
          // Gallery diagnostics ride only on this tab's own acknowledgement, never a probe.
          if (acknowledgement) galleryMetadataWarnings.saved(acknowledgement.galleryWarnings, attempt.sentPayload);
          loadRevisions().catch(() => {});
          if (acknowledgement) BuildReporting.renderOutcome($('actionStatus'), 'page', acknowledgement);
          else setStatus(BuildReporting.text('unknown'));
        },
        rebase: (saved) => {
          acceptSaved(saved);
          loadBlocked = false;
          showErr('');
        },
        useStored: async (saved) => {
          loadBlocked = true;
          acceptSaved(saved);
          fill('de', saved.de); fill('en', saved.en);
          loadBlocked = false;
          guard.markClean();
        },
      });

      // ---- manuscript bar: formatting, photo, the two views ----
      // The toolbar pins under the sticky command bar, whose height is
      // measured into the shared --editor-commandbar-height, as in the story editor.
      const commandbar = document.querySelector('.commandbar');
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => {
          document.body.style.setProperty('--editor-commandbar-height', commandbar.getBoundingClientRect().height + 'px');
        }).observe(commandbar);
      }
      const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '');
      const shortcutLabel = (key) => (isMac ? '⌘' : 'Ctrl+') + key;
      const compactEditor = window.matchMedia('(max-width: 52rem)');
      const galleryLibrary = GalleryLibrary.create({
        client: MediaApi.makeClient({ onUnauthed: () => guard.redirectToLogin() }),
        imageOrigin: EditorGalleryImageOrigin,
      });
      const bodyEditors = {};
      // A gallery block renders in the Visual view; pages have no gallery
      // picker, so editing it means its Markdown: the source view, at the block.
      function editGallerySource(locale, sourceStart) {
        const cm = mdeFor(locale).codemirror;
        bodyEditors[locale].setMode('markdown');
        const position = cm.posFromIndex(sourceStart);
        cm.setCursor(position);
        cm.scrollIntoView(position, 80);
        cm.focus();
      }
      function wireManuscriptBar(locale) {
        const bar = $(locale + 'ManuscriptBar');
        // Roving focus, the phone Format tray and the formatting buttons are
        // the shared toolbar (manuscript-bar.js), as in the story editor.
        const tools = ManuscriptBar.wire({
          bar, formatToggle: $(locale + 'FormatToggle'), formatPanel: $(locale + 'FormatPanel'),
          compact: compactEditor, formatLabel: editorCopy.formatTools, codeLabel: editorCopy.codeBlock, shortcutLabel,
          onOpenFormat: () => closePhotoPanel(locale),
          isVisual: () => bodyEditors[locale].isVisual(),
          command: (name) => bodyEditors[locale].command(name),
          markdown: (action) => EasyMDE[action](mdeFor(locale)),
        });
        bodyEditors[locale] = EditorRichBridge.create({
          mde: mdeFor(locale), element: $(locale + 'RichBody'), source: $(locale + 'MarkdownBody'),
          error: $(locale + 'RichError'), visualButton: $(locale + 'VisualMode'), markdownButton: $(locale + 'MarkdownMode'),
          // No gallery picker on a page, so no gallery view toggle is passed.
          formatButtons: bar.querySelectorAll('[data-format]'),
          locale, imageOrigin: EditorGalleryImageOrigin,
          copy: { ...editorCopy, visualBodyLabel: editorCopy.pagesVisualBodyLabel, visualHelp: editorCopy.pagesVisualHelp },
          galleryCopy: EditorGalleryCopy.en,
          galleryLibrary, images: () => (locale === 'de' ? deImages : enImages), thumbnailUrl: PostsFilter.thumbUrl,
          onEditGallery: (sourceStart) => editGallerySource(locale, sourceStart),
          onModeChange: () => {
            tools.closeFormat();
            closePhotoPanel(locale);
            tools.settle();
          },
        });
        const toggle = $(locale + 'PhotoToggle');
        toggle.addEventListener('click', () => {
          tools.closeFormat();
          if ($(locale + 'PhotoPanel').hidden) openPhotoPanel(locale);
          else closePhotoPanel(locale, toggle);
        });
        $(locale + 'PhotoPanel').addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          event.preventDefault();
          closePhotoPanel(locale, toggle);
        });
      }
      function openPhotoPanel(locale) {
        $(locale + 'PhotoPanel').hidden = false;
        $(locale + 'PhotoToggle').setAttribute('aria-expanded', 'true');
        // The tray lies in the pinned bar's area; a scrolling focus would drag
        // the page away from the caret it is about to insert at.
        $(locale + 'BodyImgFile').focus({ preventScroll: true });
      }
      /** Close the photo panel; `focus` is where the caret goes next (default: nowhere). */
      function closePhotoPanel(locale, focus) {
        const panel = $(locale + 'PhotoPanel');
        if (panel.hidden) return;
        panel.hidden = true;
        $(locale + 'PhotoToggle').setAttribute('aria-expanded', 'false');
        focus?.focus({ preventScroll: true });
      }
      wireManuscriptBar('de');
      wireManuscriptBar('en');

      // ---- tabs ----
      const tabsApi = Tabs.wire(document.querySelector('[role="tablist"]'), {
        onChange: (tab) => { mdeFor(tab).codemirror.refresh(); },
      });
      // Each tab's chip says whether that locale has anything written yet.
      function syncTabStates() {
        for (const locale of editableLocales) {
          const missing = !$(locale + 'Title').value.trim() && !mdeFor(locale).value().trim();
          SiteLanguage.tabState($('tabbtn-' + locale), missing ? 'missing' : 'available',
            missing ? SiteLanguage.text('PageEmpty', { language: SiteLanguage.names[locale] }) : '');
        }
      }
      const galleryMetadataWarnings = GalleryMetadataWarnings.create({
        root: $('galleryMetadataWarnings'),
        editors: { de: deMDE.codemirror, en: enMDE.codemirror },
        activate: (locale) => { tabsApi.select(locale); mdeFor(locale).codemirror.refresh(); },
        // A diagnostic names a source line, so it is shown in the Markdown view.
        reveal: (locale) => bodyEditors[locale].setMode('markdown'),
        onUnauthed: () => guard.redirectToLogin(),
      });

      const mainEl = document.querySelector('main');
      mainEl.addEventListener('input', (event) => {
        guard.markDirty();
        if (event.target.hasAttribute('aria-invalid')) AdminField.valid(event.target);
        syncTabStates();
      });
      mainEl.addEventListener('change', () => guard.markDirty());
      for (const mde of [deMDE, enMDE]) mde.codemirror.on('change', () => { guard.markDirty(); syncTabStates(); });

      function showErr(msg) { const el = $('actionError'); el.textContent = msg; el.hidden = !msg; }
      function setStatus(msg) { $('actionStatus').textContent = msg; }

      async function uploadBodyImg(locale) {
        const fileInput = $(locale + 'BodyImgFile'), altInput = $(locale + 'BodyImgAlt'), statusEl = $(locale + 'BodyImgStatus');
        const file = fileInput.files[0];
        if (!file) { statusEl.textContent = 'Pick a file first.'; return; }
        const imgSlug = file.name.replace(/\.[^.]+$/, '').replace(/[^a-z0-9-]/gi, '-').toLowerCase();
        statusEl.textContent = 'Uploading…';
        const ownerId = writeRecovery.ownerId();
        const alt = altInput.value;
        try {
          const body = await UploadRecovery.run({
            file, fields: { key: 'pages/' + KEY + '/' + imgSlug, alt }, ownerId, recovery: writeRecovery,
            status: statusEl, button: $(locale + 'BodyImgUpload'), copy: editorCopy,
            onUnauthed: () => guard.redirectToLogin(),
          });
          if (!body || !writeRecovery.canAdopt(ownerId)) return;
          (locale === 'de' ? deImages : enImages)[body.src] = {
            width: body.width,
            height: body.height,
            ...(body.format === 'jpeg' ? { format: body.format } : {}),
          };
          // The caret is mirrored between the two views, so this goes in where the
          // author is writing in either one; the CodeMirror change marks the guard dirty.
          mdeFor(locale).codemirror.replaceSelection(ImageMarkdown.image(alt, body.src));
          statusEl.textContent = 'Inserted: ' + body.src;
          // Clear only what this upload consumed; a newer pick or alt stays.
          if (fileInput.files[0] === file) fileInput.value = '';
          if (altInput.value === alt) altInput.value = '';
          // The tray has done its job: back to writing, right after the photo.
          closePhotoPanel(locale);
          bodyEditors[locale].focus();
        } catch (e) {
          const detail = String(e?.message || e);
          statusEl.textContent = 'Could not upload the photo: ' + detail + (detail.endsWith('.') ? '' : '.');
        }
      }
      $('deBodyImgUpload').addEventListener('click', () => uploadBodyImg('de'));
      $('enBodyImgUpload').addEventListener('click', () => uploadBodyImg('en'));

      function localeObj(loc) {
        return { locale: loc, title: $(loc + 'Title').value.trim(), slug: KEY === 'about' ? '' : $(loc + 'Slug').value.trim(),
          bodyMarkdown: mdeFor(loc).value(), images: { ...(loc === 'de' ? deImages : enImages) } };
      }

      // No untitled pages: the primary language's heading names the page everywhere.
      // A translation being prepared may stay empty; its default heading is used.
      function requireHeading() {
        const primary = language.primary;
        if (!editableLocales.includes(primary)) return true;
        const field = $(primary + 'Title');
        if (field.value.trim()) { AdminField.valid(field); return true; }
        tabsApi.select(primary);
        AdminField.invalid(field, PagesUI.text('HeadingRequired', { language: SiteLanguage.names[primary] }));
        return false;
      }

      $('saveBtn').addEventListener('click', async () => {
        if (!language || loadBlocked || confirmingSave || $('saveBtn').disabled) return;
        if (!requireHeading()) return;
        confirmingSave = true;
        let ok = true;
        try {
          if (storedPage?.status === 'published') ok = await AdminConfirm.ask({
            title: prepareLocale ? SiteLanguage.text('PrepTitle') : PagesUI.text('SaveConfirm'),
            body: prepareLocale ? SiteLanguage.text('PrepConfirm', { language: SiteLanguage.names[prepareLocale] }) : PagesUI.text('SaveScope'),
            confirmLabel: prepareLocale ? SiteLanguage.text('PrepSave') : PagesUI.text('SaveLive'), tone: 'publish',
          });
        } finally { confirmingSave = false; }
        if (!ok) return;
        showErr(''); setStatus(PagesUI.text('Busy'));
        const snap = guard.snapshot();
        const payload = { updatedAt: loadedUpdatedAt,
          ...Object.fromEntries(editableLocales.map((locale) => [locale, localeObj(locale)])),
          ...(prepareLocale ? { prepareLocale } : {}) };
        const btn = $('saveBtn');
        const restoreFocus = AdminFocus.hold(btn);
        btn.disabled = true;
        let adopted = false;
        try {
          adopted = await writeRecovery.save(payload, snap);
        } finally {
          btn.disabled = false;
          restoreFocus();
          // A conflict or refusal reports itself elsewhere; the busy text must not outlive the request.
          if (!adopted && $('actionStatus').textContent === PagesUI.text('Busy')) setStatus('');
        }
      });

      function acceptSaved(pair) {
        storedPage = pair; loadedUpdatedAt = pair.updatedAt || null;
        const live = pair.status === 'published';
        $('pageState').textContent = PagesUI.text(live ? 'Published' : 'Draft');
        $('saveBtn').textContent = prepareLocale ? SiteLanguage.text('PrepSave') : PagesUI.text(live ? 'SaveLive' : 'Save');
        // Saving a live page rebuilds the site, so that save is the one filled action.
        $('saveBtn').className = live && !prepareLocale ? 'btn-primary-publish' : 'commandbar__save';
        $('publishBtn').hidden = !!prepareLocale || live || !pair.updatedAt;
        $('unpublishBtn').hidden = !!prepareLocale || !live || KEY === 'about';
        $('deleteBtn').hidden = !!prepareLocale || !pair.updatedAt || KEY === 'about';
        $('previewBtn').disabled = !pair.updatedAt;
        for (const locale of ['de', 'en']) {
          $(locale + 'SlugFields').hidden = KEY === 'about';
          $(locale + 'Slug').readOnly = !!pair[locale].publishedAt;
        }
      }
      function hasUnsaved() { return !storedPage || guard.isDirty(); }
      $('previewBtn').addEventListener('click', () => {
        if (hasUnsaved()) { showErr(PagesUI.text('SaveFirst')); return; }
        const locale = document.querySelector('[role="tab"][aria-selected="true"]').dataset.tab;
        window.open('/pages/' + KEY + '/preview?locale=' + locale, '_blank', 'noopener');
      });
      for (const action of ['publish', 'unpublish']) $(action + 'Btn').addEventListener('click', async () => {
        if (hasUnsaved()) { showErr(PagesUI.text('SaveFirst')); return; }
        const name = action === 'publish' ? 'Publish' : 'Unpublish';
        if (!await AdminConfirm.ask({ title: PagesUI.text(name), body: PagesUI.text(name + 'Scope', { paths: PagesUI.paths(storedPage, language).join(' · ') }),
          confirmLabel: PagesUI.text(name), danger: action === 'unpublish', tone: 'publish' })) return;
        const button = $(action + 'Btn');
        const restoreFocus = AdminFocus.hold(button);
        button.disabled = true; showErr('');
        try {
          const result = await PagesUI.request('/' + KEY + '/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ updatedAt: loadedUpdatedAt }) });
          acceptSaved(result.saved);
          BuildReporting.renderOutcome($('actionStatus'), action, result, { title: PagesUI.kind(KEY) });
        } catch (error) { showErr(error.message); }
        finally {
          button.disabled = false;
          // The action just taken hides its own button; Save is the next thing to do.
          restoreFocus($('saveBtn'));
        }
      });
      $('deleteBtn').addEventListener('click', async () => {
        if (hasUnsaved()) { showErr(PagesUI.text('SaveFirst')); return; }
        $('deleteBtn').disabled = true; showErr('');
        let cancelled = false;
        try {
          const result = await PagesUI.remove(KEY);
          if (result) {
            // The page is gone: nothing left here is worth a stash or an unload prompt.
            // Its outcome is shown by the Pages list this editor returns to.
            guard.markClean(); loadBlocked = true;
            AdminFlash.set(BuildReporting.describeOutcome('delete', result, { title: PagesUI.kind(KEY) }));
            location.href = $('pagesBack').getAttribute('href');
          } else cancelled = true;
        } catch (error) {
          showErr(error.message);
        } finally {
          $('deleteBtn').disabled = false;
          if (cancelled) $('deleteBtn').focus();
        }
      });

      // ---- revisions (#141): same shape as the post editor's card ----
      async function loadRevisions() {
        const res = await fetch('/pages/' + KEY + '/revisions');
        if (!res.ok) return; // non-fatal: the card just stays as-is
        const revs = await res.json();
        $('revisionsCard').hidden = false;
        $('revisionsEmpty').hidden = revs.length > 0;
        const ul = $('revisionsList');
        ul.textContent = '';
        revs.forEach((rev) => {
          const li = document.createElement('li');
          li.className = 'revision-row';
          const label = document.createElement('span');
          const when = AdminFormat.dateTime(rev.savedAt);
          label.textContent = when + ' — ' + (rev.title || '(untitled)');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-secondary';
          btn.textContent = 'Restore into editor';
          btn.setAttribute('aria-label', 'Restore the revision from ' + when + ' into the editor');
          btn.addEventListener('click', () => { restoreRevision(rev.id); });
          li.appendChild(label);
          li.appendChild(btn);
          ul.appendChild(li);
        });
      }

      // Fills the form from a snapshot; persisting still goes through the
      // normal Save (validation applies, and the overwritten state gets its
      // own revision) — there is no direct server-side restore.
      async function restoreRevision(id) {
        showErr('');
        const res = await fetch('/pages/' + KEY + '/revisions/' + encodeURIComponent(id));
        if (res.status === 401) { guard.redirectToLogin(); return; }
        if (!res.ok) { showErr('Could not load the revision (HTTP ' + res.status + '). Try again.'); return; }
        const rev = await res.json();
        for (const locale of editableLocales) fill(locale, rev.snapshot[locale]);
        enMDE.codemirror.refresh();
        guard.markDirty();
        setStatus('Restored the revision from ' + AdminFormat.dateTime(rev.savedAt)
          + ' into the editor — review it, then ' + $('saveBtn').textContent + ' to keep it.');
      }

      async function loadPage() {
        const res = await fetch('/pages/' + KEY);
        if (res.status === 401) { guard.redirectToLogin(); return; }
        if (!res.ok) { setStatus('Could not load the page (HTTP ' + res.status + '). Reload to try again.'); return; }
        const p = await res.json();
        if (!writeRecovery.canAdopt(p.ownerUserId)) {
          writeRecovery.observeOwner(p.ownerUserId);
          throw new Error(editorCopy.writeOwnerChanged);
        }
        fill('de', p.de); fill('en', p.en);
        loadedUpdatedAt = p.updatedAt || null;
        loadBlocked = false;
        acceptSaved(p);
        enMDE.codemirror.refresh();
        loadRevisions().catch(() => {});
      }

      function fill(loc, data) {
        if (!data) return;
        $(loc + 'Title').value = data.title || '';
        $(loc + 'Slug').value = data.slug || (!storedPage?.updatedAt && pageDefaults ? pageDefaults[loc] : '') || '';
        // A whole-form fill is a new undo baseline for both views of the body.
        bodyEditors[loc].replaceDocument(data.bodyMarkdown || '');
        const images = loc === 'de' ? deImages : enImages;
        for (const key of Object.keys(images)) delete images[key];
        if (data.images) Object.assign(images, data.images);
        void galleryMetadataWarnings.reopen(loc);
        syncTabStates();
      }

      (async () => {
        const s = await Auth.ensureAuthed({ admin: true });
        if (!s) return;
        if (!writeRecovery.initialize(s.userId)) return;
        Auth.renderHeader(s);
        try {
          language = await SiteLanguage.get();
          const catalogue = await PagesUI.request('');
          const entry = catalogue.pages.find((page) => page.key === KEY && page.known);
          if (!entry) throw new Error(PagesUI.text('Unknown'));
          pageDefaults = entry.defaults;
          $('legalNote').hidden = KEY !== 'privacy' && KEY !== 'legal';
          if (prepareLocale) $('pagesBack').href += '?prepareLocale=' + prepareLocale;
          if (prepareLocale && (!['de', 'en'].includes(prepareLocale) || language.locales.includes(prepareLocale))) {
            throw new Error(SiteLanguage.text('PrepInvalid'));
          }
          editableLocales = prepareLocale ? [prepareLocale] : language.locales;
          SiteLanguage.tabs(document.querySelector('[role="tablist"]'), language, tabsApi, prepareLocale);
          if (prepareLocale) {
            $('preparationNotice').hidden = false;
            $('preparationNotice').textContent = SiteLanguage.text('PrepNotice', { language: SiteLanguage.names[prepareLocale] });
            $('languageSettingsLink').hidden = false;
            $('saveBtn').textContent = SiteLanguage.text('PrepSave');
            $('saveBtn').className = 'commandbar__save';
          }
          // Equipment is site identity, saved on its own (#514); a translation being
          // prepared has no identity locale to write, so that view leaves it out.
          if (KEY === 'about' && !prepareLocale) {
            void AboutEquipment.init({ locales: language.locales, onUnauthed: () => guard.redirectToLogin() });
          }
          await loadPage();
        } catch (e) {
          setStatus(e?.message || PagesUI.text('Failed'));
          $('saveBtn').disabled = true;
          return;
        }
        // Offer to restore locally stashed changes; filling above fired CodeMirror
        // change events, so settle the guard's dirty state here either way.
        const stash = guard.tryRestore();
        if (stash && !guard.wasDismissed(stash)) {
          const restore = await AdminConfirm.ask({
            title: PagesUI.text('Restore'),
            body: 'Found unsaved changes from ' + AdminFormat.dateTime(stash.savedAt) + '.',
            confirmLabel: 'Restore',
          });
          if (restore) {
            if (!guard.adopt(stash)) return;
            fill('de', stash.payload.de); fill('en', stash.payload.en);
            enMDE.codemirror.refresh();
            guard.restoreGeneration(stash.generation);
            if (!writeRecovery.restore(stash.recovery)) {
              loadBlocked = true;
              showErr(editorCopy.writeUnsafeBase);
            }
            await writeRecovery.probe();
            setStatus(editorCopy.writeRestored);
          } else {
            guard.dismissRestore(stash);
          }
        } else if (stash) {
          guard.dismissRestore(stash);
        } else {
          guard.markClean();
        }
      })();
    </script>
  </body>
</html>
