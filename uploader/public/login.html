<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="login-page">
    <header class="login-brand">
      <h1>Image Station</h1>
      <p>Expedition Log</p>
    </header>
    <main>
      <!-- @ai-note: a real <form> (not bare inputs plus a click handler) so that
           Enter in either field submits — keyboard-only sign-in must work. The
           card itself is the form so `.card > label:first-of-type` still matches.
           Submission is intercepted below; there is deliberately no action/method. -->
      <form class="card" id="login-form">
        <h2 id="title">Sign in</h2>
        <p class="lede" id="lede">Enter your username and password.</p>
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="submit" type="submit">Sign in</button>
        <p id="out" class="page-status" role="status"></p>
        <p id="err" class="err" role="alert" hidden></p>
      </form>
    </main>
    <script src="/admin/auth.js"></script>
    <script src="/admin/draft-guard.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let needsSetup = false;
      const nextPath = DraftGuard.safeNextPath(new URLSearchParams(location.search).get('next'));
      async function init() {
        const s = await Auth.status();
        if (s.authenticated) { location.href = nextPath; return; }
        needsSetup = !!s.needsSetup;
        if (needsSetup) {
          $('title').textContent = 'Create the first admin';
          $('lede').textContent = 'No accounts exist yet. Create the first administrator account.';
          $('submit').textContent = 'Create admin';
          $('password').setAttribute('autocomplete', 'new-password');
        }
      }
      function setStatus(msg) { $('out').textContent = msg || ''; }
      function showErr(msg) { const el = $('err'); el.textContent = msg; el.hidden = !msg; }
      $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        showErr('');
        const username = $('username').value.trim();
        const password = $('password').value;
        if (!username || !password) { showErr('Enter a username and password.'); return; }
        setStatus(needsSetup ? 'Creating…' : 'Signing in…');
        try {
          const res = await fetch(needsSetup ? '/setup' : '/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (res.ok) { location.href = nextPath; return; }
          const r = await res.json().catch(() => ({}));
          setStatus('');
          showErr(r.error || 'Sign-in failed. Check your username and password.');
        } catch (e) {
          setStatus('');
          showErr('Could not reach the server. Check your connection and try again.');
        }
      });
      init();
    </script>
  </body>
</html>
