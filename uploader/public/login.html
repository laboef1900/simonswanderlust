<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="login-page">
    <header class="masthead">
      <div class="masthead-inner" style="text-align:center">
        <p class="eyebrow">Expedition Log · Image Station</p>
        <h1 id="title">Sign in</h1>
        <p class="lede" id="lede" style="margin-left:auto;margin-right:auto">Enter your username and password.</p>
      </div>
    </header>
    <main>
      <!-- @ai-note: a real <form> (not bare inputs plus a click handler) so that
           Enter in either field submits — keyboard-only sign-in must work. The
           card itself is the form so `.card > label:first-of-type` still matches.
           Submission is intercepted below; there is deliberately no action/method. -->
      <form class="card" id="login-form">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="submit" type="submit">Sign in</button>
        <p class="section-label" style="margin-top:1.25rem">Status</p>
        <pre id="out">—</pre>
      </form>
    </main>
    <script src="/admin/auth.js"></script>
    <script src="/admin/draft-guard.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let needsSetup = false;
      // Post-login return target (?next=…), validated to same-origin /admin/ paths
      // so an expired session lands back on the exact page (e.g. the editor).
      const nextPath = DraftGuard.safeNextPath(new URLSearchParams(location.search).get('next'));
      async function init() {
        const s = await Auth.status();
        if (s.authenticated) { location.href = nextPath; return; }
        needsSetup = !!s.needsSetup;
        if (needsSetup) {
          $('title').textContent = 'Create the first admin';
          $('lede').textContent = 'No accounts exist yet. Create the first administrator account.';
          $('submit').textContent = 'Create admin';
          $('password').setAttribute('autocomplete', 'new-password');
        }
      }
      $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = $('username').value.trim();
        const password = $('password').value;
        if (!username || !password) { $('out').textContent = 'Enter a username and password.'; return; }
        $('out').textContent = needsSetup ? 'Creating…' : 'Signing in…';
        try {
          const res = await fetch(needsSetup ? '/setup' : '/login', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });
          if (res.ok) { location.href = nextPath; return; }
          const r = await res.json().catch(() => ({}));
          $('out').textContent = r.error || ('Failed: ' + res.status);
        } catch (e) {
          $('out').textContent = 'Error: ' + e;
        }
      });
      init();
    </script>
  </body>
</html>
