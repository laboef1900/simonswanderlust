<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comments</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Comments</h1>
      <p class="lede">Reader comments wait here until you approve them. Replies you write are published as the author immediately.</p>
    </header>

    <main>
      <div class="inline-field">
        <label for="statusFilter">Show</label>
        <select id="statusFilter">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
        </select>
      </div>
      <p id="out" class="page-status" role="status"></p>
      <ul id="list" class="comment-list"></ul>
    </main>

    <script src="/admin/editor-image-copy.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script>
      // @ai-warning Reader text (name, email, body, post key) is UNTRUSTED and
      // is painted exclusively with createElement + textContent — never
      // innerHTML — because an XSS here runs with an admin session (M17).
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      };

      // Page-lifetime only: changing views must not discard another reply.
      const replyDrafts = new Map();
      const pendingReplies = new Set();
      const renderedRows = new Map();

      function focusedReplyControl() {
        for (const [id, { controls, ta }] of renderedRows) {
          const index = controls.indexOf(document.activeElement);
          if (index !== -1) return {
            id, index,
            selection: document.activeElement === ta
              ? [ta.selectionStart, ta.selectionEnd, ta.selectionDirection] : null,
          };
        }
        return null;
      }

      function restoreReplyFocus(focus) {
        if (!focus) return;
        const control = renderedRows.get(focus.id)?.controls[focus.index];
        if (!control) { $('statusFilter').focus({ preventScroll: true }); return; }
        control.focus({ preventScroll: true });
        if (focus.selection) control.setSelectionRange(...focus.selection);
      }

      async function api(method, url, body) {
        const res = await fetch(url, {
          method,
          headers: body ? { 'content-type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 401) { location.href = '/login'; return null; }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      }

      async function setStatus(c, status) {
        await api('POST', '/moderation/comments/' + encodeURIComponent(c.id) + '/status', { status });
      }

      async function deleteComment(c) {
        const result = await api('DELETE', '/moderation/comments/' + encodeURIComponent(c.id));
        if (result !== null) replyDrafts.delete(c.id);
      }

      async function confirmThen(opts, fn) {
        const ok = await AdminConfirm.ask(opts);
        if (ok) await fn();
      }

      function row(c) {
        const li = el('li', undefined, 'comment');
        const head = el('p', undefined, 'comment__meta');
        head.appendChild(el('strong', c.name));
        if (c.isAuthor) head.appendChild(el('span', ' (author)'));
        head.appendChild(el('span', ' · ' + c.translationKey + ' / ' + c.locale + ' · ' + new Date(c.createdAt).toLocaleString(), 'muted'));
        li.appendChild(head);
        if (c.email) li.appendChild(el('p', c.email, 'muted'));
        for (const para of String(c.body).split(/\n{2,}/)) li.appendChild(el('p', para, 'comment__body'));

        const actions = el('div', undefined, 'comment-actions');
        const controls = [];
        const act = (label, fn, variant) => {
          const b = el('button', label);
          b.type = 'button';
          if (variant) b.className = variant;
          b.addEventListener('click', async () => {
            const focus = focusedReplyControl();
            b.disabled = true;
            try { await fn(); await load(focus); } catch (e) { $('out').textContent = 'Failed: ' + e.message; }
            finally { b.disabled = false; }
          });
          actions.appendChild(b);
          controls.push(b);
        };
        if (c.status === 'pending') act('Approve', () => setStatus(c, 'approved'));
        else act('Unapprove', () => setStatus(c, 'pending'), 'btn-secondary');
        act('Spam', () => confirmThen({
          title: 'Mark as spam?',
          body: 'This comment by "' + c.name + '" is permanently deleted. This cannot be undone.',
          confirmLabel: 'Delete as spam', danger: true,
        }, () => deleteComment(c)), 'btn-remove');
        act('Delete', () => confirmThen({
          title: 'Delete this comment?',
          body: 'This comment by "' + c.name + '" is permanently deleted' + (c.status === 'approved' ? ' and disappears from the site on the next rebuild' : '') + '. This cannot be undone.',
          confirmLabel: 'Delete', danger: true,
        }, () => deleteComment(c)), 'btn-remove');
        li.appendChild(actions);

        const form = el('form', undefined, 'comment-reply');
        const ta = el('textarea');
        ta.maxLength = 2000;
        ta.rows = 2;
        ta.setAttribute('aria-label', 'Reply as author');
        ta.placeholder = 'Reply as the author…';
        ta.value = replyDrafts.get(c.id) || '';
        ta.addEventListener('input', () => {
          if (ta.value) replyDrafts.set(c.id, ta.value);
          else replyDrafts.delete(c.id);
        });
        const send = el('button', 'Reply as author', 'btn-secondary');
        send.type = 'submit';
        send.disabled = pendingReplies.has(c.id);
        form.append(ta, send);
        controls.push(ta, send);
        renderedRows.set(c.id, { controls, ta, send });
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (pendingReplies.has(c.id) || !ta.value.trim()) return;
          const body = ta.value;
          replyDrafts.set(c.id, body);
          const focus = focusedReplyControl();
          pendingReplies.add(c.id);
          send.disabled = true;
          try {
            const result = await api('POST', '/moderation/comments/' + encodeURIComponent(c.id) + '/reply', { body });
            if (result === null) return;
            // Keep anything written while the request was pending, even if a
            // different action has already replaced this row's textarea.
            if (replyDrafts.get(c.id) === body) {
              replyDrafts.delete(c.id);
              const current = renderedRows.get(c.id);
              if (current) current.ta.value = '';
            }
            $('out').textContent = 'Reply published.';
            await load(focus);
          } catch (err) { $('out').textContent = 'Reply failed: ' + err.message; }
          finally {
            pendingReplies.delete(c.id);
            send.disabled = false;
            const current = renderedRows.get(c.id);
            if (current) current.send.disabled = false;
            if (document.activeElement === document.body) restoreReplyFocus(focus);
          }
        });
        li.appendChild(form);
        return li;
      }

      async function load(fallbackFocus = null) {
        const status = $('statusFilter').value;
        let data;
        try { data = await api('GET', '/moderation/comments?status=' + encodeURIComponent(status)); }
        catch (e) { $('out').textContent = 'Could not load comments: ' + e.message; return; }
        if (!data) return;
        const ul = $('list');
        // Capture at render time, not request time: the author can keep typing
        // and moving the caret while moderation or the list request is pending.
        const focus = focusedReplyControl()
          || (document.activeElement === document.body ? fallbackFocus : null);
        renderedRows.clear();
        ul.replaceChildren();
        for (const c of data.comments) ul.appendChild(row(c));
        restoreReplyFocus(focus);
        if (!data.comments.length) $('out').textContent = 'No ' + status + ' comments.';
      }

      // A new view starts with a clean status line: the previous view's "No
      // pending comments." must not sit above a populated approved list.
      $('statusFilter').addEventListener('change', () => {
        $('out').textContent = '';
        load();
      });

      (async () => {
        const s = await Auth.ensureAuthed({ admin: true });
        if (!s) return;
        Auth.renderHeader(s);
        load();
      })();
    </script>
  </body>
</html>
