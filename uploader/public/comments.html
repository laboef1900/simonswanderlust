<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comments</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Comments</h1>
      <p class="lede">Reader comments wait here until you approve them. Replies you write are published as the author immediately.</p>
    </header>

    <main>
      <div class="comment-filter">
        <label for="statusFilter">Show</label>
        <select id="statusFilter">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
        </select>
      </div>
      <p id="out" class="page-status" role="status"></p>
      <ul id="list" class="comment-list"></ul>
      <nav id="pagination" class="comment-actions" hidden>
        <button id="previousPage" type="button" class="btn-secondary" disabled></button>
        <span id="pageIndicator" tabindex="-1" role="status"></span>
        <button id="nextPage" type="button" class="btn-secondary" disabled></button>
      </nav>
    </main>

    <script src="/admin/editor-image-copy.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/admin-ui.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script src="/admin/language.js"></script>
    <script>
      // @ai-warning Reader text (name, email, body, post key) is UNTRUSTED and
      // is painted exclusively with createElement + textContent — never
      // innerHTML — because an XSS here runs with an admin session (M17).
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      };
      const copy = EditorCopy[document.documentElement.lang === 'de' ? 'de' : 'en'];
      const text = (key, values = {}) => copy[key].replace(/\{(\w+)\}/g, (_, name) => String(values[name]));
      $('previousPage').textContent = copy.commentsPrevious;
      $('nextPage').textContent = copy.commentsNext;
      $('pagination').setAttribute('aria-label', copy.commentsPagination);
      const PAGE_SIZE = 50;

      // Page-lifetime only: changing views must not discard another reply.
      const replyDrafts = new Map();
      const pendingReplies = new Set();
      const renderedRows = new Map();
      // Story titles by translation key, read with every list load so a row names
      // its story rather than its key; null until the first successful read.
      let storyTitles = null;
      let viewRequest = 0;
      let filterRevision = 0;
      let loadedView = null;
      let offset = 0;
      let hasMore = false;
      let refreshFocus = null;

      function focusedReplyControl() {
        const ids = [...renderedRows.keys()];
        for (const [id, { controls, ta }] of renderedRows) {
          const index = controls.indexOf(document.activeElement);
          if (index !== -1) {
            const position = ids.indexOf(id);
            return {
              id, index,
              // Neighbours at capture time: a row that leaves the list hands focus on.
              next: ids[position + 1] ?? null, previous: ids[position - 1] ?? null,
              selection: document.activeElement === ta
                ? [ta.selectionStart, ta.selectionEnd, ta.selectionDirection] : null,
            };
          }
        }
        return null;
      }

      function restoreReplyFocus(focus) {
        if (!focus) return;
        const control = renderedRows.get(focus.id)?.controls[focus.index];
        if (control) {
          control.focus({ preventScroll: true });
          if (focus.selection) control.setSelectionRange(...focus.selection);
          return;
        }
        // The row left the list: the next comment's first action, else the
        // previous one's, else the view filter.
        const neighbour = renderedRows.get(focus.next) || renderedRows.get(focus.previous);
        (neighbour ? neighbour.controls[0] : $('statusFilter')).focus({ preventScroll: true });
      }

      // A real focus move cancels restoration, even if the user later blurs it.
      // Removing the rows does not emit focusin, so overlapping loads keep the
      // latest caret until the owning response restores it.
      document.addEventListener('focusin', () => { refreshFocus = null; });

      async function api(method, url, body) {
        const res = await fetch(url, {
          method,
          headers: body ? { 'content-type': 'application/json' } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        if (res.status === 401) { location.href = '/login'; return null; }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      }

      /** "Could not approve the comment: Failed to fetch." — never a bare lowercase server code. */
      function failure(action, error) {
        const detail = String(error && error.message ? error.message : error).trim();
        return 'Could not ' + action + (detail ? ': ' + detail.charAt(0).toUpperCase() + detail.slice(1).replace(/\.?$/, '.') : '.');
      }

      async function setStatus(c, status) {
        return await api('POST', '/moderation/comments/' + encodeURIComponent(c.id) + '/status', { status }) !== null;
      }

      async function deleteComment(c) {
        const result = await api('DELETE', '/moderation/comments/' + encodeURIComponent(c.id));
        if (result !== null) replyDrafts.delete(c.id);
        return result !== null;
      }

      async function confirmThen(opts, fn) {
        const ok = await AdminConfirm.ask(opts);
        return ok ? await fn() : false;
      }

      // Titles come from the posts list the admin can already read. A failed
      // read keeps the titles from the last one instead of blocking the queue.
      async function readStoryTitles() {
        try {
          const posts = await api('GET', '/posts');
          if (Array.isArray(posts)) storyTitles = new Map(posts.map((p) => [p.translationKey, String(p.title || '')]));
        } catch { /* rows keep the previous titles */ }
      }

      /** "Bukarest in 4 Tagen · DE · 29 Sept 2026, 05:56" — the key itself is never shown. */
      function storyLine(c) {
        const title = storyTitles ? (storyTitles.get(c.translationKey) || 'Deleted story') : '';
        return [title, String(c.locale).toUpperCase(), AdminFormat.dateTime(c.createdAt)].filter(Boolean).join(' · ');
      }

      function row(c) {
        const li = el('li', undefined, 'comment');
        const head = el('p', undefined, 'comment__meta');
        head.appendChild(el('strong', c.name));
        if (c.isAuthor) head.appendChild(el('span', ' (author)'));
        head.appendChild(el('span', ' · ' + storyLine(c), 'muted'));
        li.appendChild(head);
        if (c.publicLocale === false) {
          li.appendChild(el('p', SiteLanguage.text('CommentHidden', { language: SiteLanguage.names[c.locale] }), 'muted'));
        }
        if (c.email) li.appendChild(el('p', c.email, 'muted'));
        for (const para of String(c.body).split(/\n{2,}/)) li.appendChild(el('p', para, 'comment__body'));

        const actions = el('div', undefined, 'comment-actions');
        const controls = [];
        const act = (label, fn, variant, done, verb) => {
          const b = el('button', label);
          b.type = 'button';
          if (variant) b.className = variant;
          b.addEventListener('click', async () => {
            const view = filterRevision;
            const request = viewRequest;
            const focus = focusedReplyControl();
            b.disabled = true;
            try {
              const changed = await fn();
              if (changed && view === filterRevision) await load(focus, done, true);
            } catch (e) {
              if (request === viewRequest) $('out').textContent = failure(verb, e);
            }
            finally { b.disabled = false; }
          });
          actions.appendChild(b);
          controls.push(b);
        };
        if (c.status === 'pending') act('Approve', () => setStatus(c, 'approved'), undefined, 'Comment approved.', 'approve the comment');
        else act('Unapprove', () => setStatus(c, 'pending'), 'btn-secondary', 'Comment moved back to pending.', 'move the comment back to pending');
        act('Spam', () => confirmThen({
          title: 'Mark as spam?',
          body: text(c.status === 'approved' ? 'commentsDeleteApprovedBody' : 'commentsDeleteBody', { name: c.name }),
          confirmLabel: 'Delete as spam', danger: true,
        }, () => deleteComment(c)), 'btn-remove', 'Comment deleted as spam.', 'delete the comment');
        act('Delete', () => confirmThen({
          title: 'Delete this comment?',
          body: text(c.status === 'approved' ? 'commentsDeleteApprovedBody' : 'commentsDeleteBody', { name: c.name }),
          confirmLabel: 'Delete', danger: true,
        }, () => deleteComment(c)), 'btn-remove', 'Comment deleted.', 'delete the comment');
        li.appendChild(actions);

        const form = el('form', undefined, 'comment-reply');
        const ta = el('textarea');
        ta.id = 'reply-' + c.id;
        const caption = el('label', 'Reply as author');
        caption.htmlFor = ta.id;
        ta.maxLength = 2000;
        ta.rows = 2;
        ta.value = replyDrafts.get(c.id) || '';
        ta.addEventListener('input', () => {
          AdminField.valid(ta);
          if (ta.value) replyDrafts.set(c.id, ta.value);
          else replyDrafts.delete(c.id);
        });
        const send = el('button', 'Reply as author', 'btn-secondary btn-sm');
        send.type = 'submit';
        send.disabled = pendingReplies.has(c.id);
        form.append(caption, ta, send);
        controls.push(ta, send);
        renderedRows.set(c.id, { controls, ta, send });
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (pendingReplies.has(c.id)) return;
          if (!ta.value.trim()) { AdminField.invalid(ta, 'Write a reply first.'); return; }
          const body = ta.value;
          replyDrafts.set(c.id, body);
          const focus = focusedReplyControl();
          const view = filterRevision;
          let focusRequest = viewRequest;
          let refreshing = false;
          let ownsPendingReply = true;
          pendingReplies.add(c.id);
          send.disabled = true;
          // This handler may outlive its refresh; release only its own admission.
          function releasePendingReply() {
            if (!ownsPendingReply) return;
            ownsPendingReply = false;
            pendingReplies.delete(c.id);
            send.disabled = false;
            const current = renderedRows.get(c.id);
            if (current) current.send.disabled = false;
          }
          try {
            const result = await api('POST', '/moderation/comments/' + encodeURIComponent(c.id) + '/reply', { body });
            if (result === null) return;
            releasePendingReply();
            // Keep anything written while the request was pending, even if a
            // different action has already replaced this row's textarea.
            if (replyDrafts.get(c.id) === body) {
              replyDrafts.delete(c.id);
              const current = renderedRows.get(c.id);
              if (current) current.ta.value = '';
            }
            if (view === filterRevision) {
              focusRequest = viewRequest + 1;
              refreshing = true;
              await load(focus, 'Reply published.', true);
            }
          } catch (err) {
            if (focusRequest === viewRequest) $('out').textContent = failure('publish the reply', err);
          }
          finally {
            releasePendingReply();
            if (!refreshing && focusRequest === viewRequest && document.activeElement === document.body) restoreReplyFocus(focus);
          }
        });
        li.appendChild(form);
        return li;
      }

      async function load(fallbackFocus = null, message = '', resetPage = false) {
        const request = ++viewRequest;
        const status = $('statusFilter').value;
        if (loadedView && status !== loadedView.status) offset = 0;
        if (resetPage) offset = 0;
        const view = { status, offset };
        // Mutation resets stay in the same navigation revision: overlapping
        // successful writes must each refresh. User navigation retires them.
        if (!loadedView || status !== loadedView.status || (!resetPage && offset !== loadedView.offset)) {
          filterRevision++;
          refreshFocus = null;
        }
        loadedView = view;
        const isCurrent = () => request === viewRequest
          && view.status === $('statusFilter').value && view.offset === offset;
        hasMore = false;
        $('previousPage').disabled = true;
        $('nextPage').disabled = true;
        $('pageIndicator').textContent = text('commentsPage', { page: offset / PAGE_SIZE + 1 });
        const ul = $('list');
        // Capture the latest draft/caret before removing obsolete actions.
        // Draft text itself lives in replyDrafts, not in the cleared rows.
        refreshFocus = focusedReplyControl()
          || (document.activeElement === document.body
            ? ul.getAttribute('aria-busy') === 'true' ? refreshFocus : fallbackFocus
            : null);
        renderedRows.clear();
        ul.replaceChildren();
        ul.setAttribute('aria-busy', 'true');
        $('out').textContent = 'Loading ' + status + ' comments…';
        try {
          const [data] = await Promise.all([
            api('GET', '/moderation/comments?status=' + encodeURIComponent(status) + '&offset=' + view.offset),
            readStoryTitles(),
          ]);
          if (!isCurrent() || !data) return;
          for (const c of data.comments) ul.appendChild(row(c));
          hasMore = data.hasMore === true;
          $('previousPage').disabled = view.offset === 0;
          $('nextPage').disabled = !hasMore;
          // One page needs no pager.
          $('pagination').hidden = view.offset === 0 && !hasMore;
          const empty = data.comments.length ? '' : view.offset > 0 ? copy.commentsEmptyPage : 'No ' + status + ' comments.';
          $('out').textContent = [message, empty].filter(Boolean).join(' ');
          if (document.activeElement === document.body) restoreReplyFocus(refreshFocus);
        } catch (e) {
          if (!isCurrent()) return;
          $('out').textContent = e.message === 'invalid pagination'
            ? copy.commentsPaginationError : failure('load comments', e);
          if (refreshFocus && document.activeElement === document.body) $('statusFilter').focus({ preventScroll: true });
        } finally {
          if (isCurrent()) {
            ul.setAttribute('aria-busy', 'false');
            refreshFocus = null;
          }
        }
      }

      $('statusFilter').addEventListener('change', () => {
        offset = 0;
        return load();
      });
      function navigatePage(delta) {
        if ($('list').getAttribute('aria-busy') === 'true'
          || (delta > 0 ? $('nextPage').disabled || !hasMore : $('previousPage').disabled || offset === 0)) return;
        offset += delta;
        $('pageIndicator').focus({ preventScroll: true });
        return load();
      }
      $('previousPage').addEventListener('click', () => navigatePage(-PAGE_SIZE));
      $('nextPage').addEventListener('click', () => navigatePage(PAGE_SIZE));

      (async () => {
        const s = await Auth.ensureAuthed({ admin: true });
        if (!s) return;
        Auth.renderHeader(s);
        load();
      })();
    </script>
  </body>
</html>
