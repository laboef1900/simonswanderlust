<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Users</h1>
    </header>
    <main>
      <!-- Real <form>s (not bare inputs plus a click handler) so that Enter in a
           field submits — keyboard-only account management must work. -->
      <form class="card" id="addForm">
        <h2>Add a user</h2>
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="off" maxlength="64" pattern="[A-Za-z0-9._\-]+" aria-describedby="usernameHint" />
        <p class="muted" id="usernameHint">1–64 characters: letters, digits, ".", "_" and "-".</p>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" />
        <label><input id="isAdmin" type="checkbox" /> Administrator</label>
        <button id="add" type="submit">Add user</button>
        <p id="out" class="page-status" role="status"></p>
      </form>
      <section class="card">
        <h2>Existing users</h2>
        <ul id="list"></ul>
      </section>
      <form class="card" id="pwForm">
        <h2>Change my password</h2>
        <label for="curpw">Current password</label>
        <input id="curpw" type="password" autocomplete="current-password" />
        <label for="newpw">New password</label>
        <input id="newpw" type="password" autocomplete="new-password" />
        <button id="changepw" type="submit">Change password</button>
        <p id="pwout" class="page-status" role="status"></p>
      </form>
    </main>
    <script src="/admin/auth.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let me = null;
      async function load() {
        const res = await fetch('/users');
        if (res.status === 401) { location.href = '/login'; return; }
        if (res.status === 403) { location.href = '/admin/'; return; }
        const users = await res.json();
        const ul = $('list');
        ul.innerHTML = '';
        for (const u of users) {
          const li = document.createElement('li');
          const role = u.isAdmin ? 'admin' : 'author';
          li.textContent = u.username + ' (' + role + ') ';
          if (!(me && u.username === me.username)) {
            const btn = document.createElement('button');
            btn.textContent = 'Remove';
            btn.className = 'btn-remove';
            btn.setAttribute('aria-label', 'Remove user ' + u.username);
            btn.addEventListener('click', async () => {
              const ok = await AdminConfirm.ask({
                title: 'Remove this account?',
                body: 'Remove the ' + role + ' account "' + u.username + '"?\n\nThey are logged out of every session immediately, and their name is cleared from the photos they uploaded. This cannot be undone.',
                confirmLabel: 'Remove',
                danger: true,
              });
              if (!ok) return;
              btn.disabled = true;
              $('out').textContent = 'Removing ' + u.username + '…';
              try {
                const d = await fetch('/users/' + u.id, { method: 'DELETE' });
                if (d.status === 401) { location.href = '/login'; return; }
                if (d.ok) { $('out').textContent = 'Removed ' + u.username + '.'; load(); return; }
                const r = await d.json().catch(() => ({}));
                $('out').textContent = r.error || ('Failed: ' + d.status);
              } catch (e) {
                $('out').textContent = 'Failed: ' + (e && e.message ? e.message : 'network error');
              } finally {
                btn.disabled = false;
              }
            });
            li.appendChild(btn);
          }
          ul.appendChild(li);
        }
      }
      $('addForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const username = $('username').value.trim();
        const password = $('password').value;
        const isAdmin = $('isAdmin').checked;
        if (!username || !password) { $('out').textContent = 'Enter a username and password.'; return; }
        const res = await fetch('/users', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username, password, isAdmin }) });
        if (res.status === 401) { location.href = '/login'; return; }
        if (res.ok) { $('out').textContent = 'Added ' + username + '.'; $('username').value = ''; $('password').value = ''; $('isAdmin').checked = false; load(); }
        else { const r = await res.json().catch(() => ({})); $('out').textContent = r.error || ('Failed: ' + res.status); }
      });
      $('pwForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const currentPassword = $('curpw').value;
        const newPassword = $('newpw').value;
        if (!currentPassword || !newPassword) { $('pwout').textContent = 'Enter your current and new password.'; return; }
        const res = await fetch('/users/me/password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ currentPassword, newPassword }) });
        if (res.status === 401) { location.href = '/login'; return; }
        if (res.ok) { $('pwout').textContent = 'Password changed. Your other sessions were logged out.'; $('curpw').value = ''; $('newpw').value = ''; }
        else { const r = await res.json().catch(() => ({})); $('pwout').textContent = r.error || ('Failed: ' + res.status); }
      });
      (async () => {
        me = await Auth.ensureAuthed({ admin: true });
        if (!me) return;
        Auth.renderHeader(me);
        load();
      })();
    </script>
  </body>
</html>
