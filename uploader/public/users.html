<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Users</h1>
      <p class="lede">Everyone listed here can sign in and write; an administrator can also publish, moderate comments and change settings.</p>
    </header>
    <main>
      <!-- Real <form>s (not bare inputs plus a click handler) so that Enter in a
           field submits — keyboard-only account management must work. The
           browser's native validation bubble is replaced by the inline
           sentence under the field (novalidate + AdminField). -->
      <section class="card form-narrow">
        <h2 class="card-heading" id="listHeading" tabindex="-1">Existing users</h2>
        <ul id="list" class="user-list"></ul>
        <p id="listout" class="page-status" role="status"></p>
        <button id="reloadUsers" type="button" class="btn-secondary btn-sm" aria-describedby="listout"></button>
      </section>
      <form class="card form-narrow" id="addForm" novalidate>
        <h2 class="card-heading">Add a user</h2>
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="off" maxlength="64" pattern="[A-Za-z0-9._\-]+" aria-describedby="usernameHint" />
        <p class="muted" id="usernameHint">1–64 characters: letters, digits, ".", "_" and "-".</p>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="12" aria-describedby="passwordHint" />
        <p class="muted" id="passwordHint">At least 12 characters.</p>
        <label class="check-field"><input id="isAdmin" type="checkbox" /> Administrator</label>
        <div class="form-actions">
          <button id="add" type="submit">Add user</button>
        </div>
        <p id="out" class="page-status" role="status"></p>
      </form>
      <form class="card form-narrow" id="pwForm" novalidate>
        <h2 class="card-heading">Change my password</h2>
        <label for="curpw">Current password</label>
        <input id="curpw" type="password" autocomplete="current-password" />
        <label for="newpw">New password</label>
        <input id="newpw" type="password" autocomplete="new-password" minlength="12" aria-describedby="newpwHint" />
        <p class="muted" id="newpwHint">At least 12 characters.</p>
        <div class="form-actions">
          <button id="changepw" type="submit">Change password</button>
        </div>
        <p id="pwout" class="page-status" role="status"></p>
      </form>
    </main>
    <script src="/admin/editor-image-copy.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/admin-ui.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const copy = EditorCopy.en;
      $('reloadUsers').textContent = copy.usersReload;
      // The server's rules (uploader/src/users.ts), repeated here so the
      // sentence appears under the field before a request is sent.
      const USERNAME_RE = /^[A-Za-z0-9._-]{1,64}$/;
      const MIN_PASSWORD = 12;
      const USERNAME_RULE = 'Use 1–64 letters, digits, “.”, “_” or “-”.';
      const PASSWORD_RULE = 'Use at least ' + MIN_PASSWORD + ' characters.';
      let me = null;
      let loadGeneration = 0;
      // Rows of the last successful load, in list order ({ username, button|null }).
      let currentRows = [];

      /** After deleting `username`: the next account's Delete, else the previous one's, else the list heading. */
      function neighbourDelete(username, oldRows) {
        const index = oldRows.findIndex((row) => row.username === username);
        const order = [...oldRows.slice(index + 1), ...oldRows.slice(0, index).reverse()];
        for (const old of order) {
          const button = currentRows.find((row) => row.username === old.username)?.button;
          if (button) return button;
        }
        return $('listHeading');
      }

      /** "Could not add the user: Username already exists." — known server codes get their own sentence. */
      function refusal(action, error) {
        const detail = typeof error === 'string' ? error.trim() : '';
        return 'Could not ' + action + (detail ? ': ' + detail.charAt(0).toUpperCase() + detail.slice(1).replace(/\.?$/, '.') : '.');
      }

      async function load() {
        const reload = $('reloadUsers');
        const restore = AdminFocus.hold(reload);
        const generation = ++loadGeneration;
        reload.disabled = true;
        const ul = $('list');
        ul.replaceChildren();
        $('listout').textContent = copy.usersLoading;
        try {
          const res = await fetch('/users');
          if (generation !== loadGeneration) return;
          if (res.status === 401) { location.href = '/login'; return; }
          if (res.status === 403) { location.href = '/admin/'; return; }
          if (!res.ok) {
            $('listout').textContent = copy.usersLoadFailed.replace('{status}', String(res.status));
            return;
          }
          const users = await res.json();
          if (generation !== loadGeneration) return;
          const rows = [];
          for (const u of users) {
            const li = document.createElement('li');
            const role = u.isAdmin ? 'administrator' : 'author';
            const name = document.createElement('span');
            name.className = 'user-list__name';
            name.textContent = u.username;
            const roleLabel = document.createElement('span');
            roleLabel.className = 'user-list__role';
            roleLabel.textContent = u.isAdmin ? 'Admin' : 'Author';
            li.append(name, roleLabel);
            if (!(me && u.username === me.username)) {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.textContent = 'Delete';
              btn.className = 'btn-remove';
              btn.setAttribute('aria-label', 'Delete account ' + u.username);
              btn.addEventListener('click', async () => {
                const ok = await AdminConfirm.ask({
                  title: 'Delete this account?',
                  body: 'Delete the ' + role + ' account “' + u.username + '”?\n\nThey are logged out of every session immediately, and their name is cleared from the photos they uploaded. This cannot be undone.',
                  confirmLabel: 'Delete account',
                  danger: true,
                });
                if (!ok) return;
                const restoreRow = AdminFocus.hold(btn);
                btn.disabled = true;
                $('out').textContent = 'Deleting ' + u.username + '…';
                try {
                  const d = await fetch('/users/' + u.id, { method: 'DELETE' });
                  if (d.status === 401) { location.href = '/login'; return; }
                  if (d.ok) {
                    $('out').textContent = 'Account ' + u.username + ' deleted.';
                    await load();
                    restoreRow(neighbourDelete(u.username, rows));
                    return;
                  }
                  const r = await d.json().catch(() => ({}));
                  $('out').textContent = d.status === 404 ? 'This account no longer exists. Reload the user list.'
                    : r.error === 'cannot remove the last admin' ? 'The last administrator cannot be deleted.'
                    : r.error === 'you cannot delete your own account' ? 'You cannot delete your own account.'
                    : refusal('delete the account', r.error);
                } catch (e) {
                  $('out').textContent = refusal('delete the account', e && e.message ? e.message : 'network error');
                } finally {
                  btn.disabled = false;
                  restoreRow();
                }
              });
              li.appendChild(btn);
              rows.push({ username: u.username, button: btn });
            } else rows.push({ username: u.username, button: null });
            ul.appendChild(li);
          }
          currentRows = rows;
          $('listout').textContent = AdminFormat.count(users.length, 'account');
        } catch {
          if (generation === loadGeneration) $('listout').textContent = copy.usersLoadNetworkFailed;
        } finally {
          if (generation === loadGeneration) { reload.disabled = false; restore(); }
        }
      }
      $('reloadUsers').addEventListener('click', () => {
        if (!$('reloadUsers').disabled) return load();
      });
      for (const id of ['username', 'password', 'curpw', 'newpw']) $(id).addEventListener('input', () => AdminField.valid($(id)));
      $('addForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if ($('add').disabled) return;
        const username = $('username').value.trim();
        const password = $('password').value;
        const isAdmin = $('isAdmin').checked;
        if (!username || !password) { $('out').textContent = copy.usersAddRequired; return; }
        if (!USERNAME_RE.test(username)) { AdminField.invalid($('username'), USERNAME_RULE); return; }
        if (password.length < MIN_PASSWORD) { AdminField.invalid($('password'), PASSWORD_RULE); return; }
        const restore = AdminFocus.hold($('add'));
        $('add').disabled = true;
        $('out').textContent = copy.usersAdding;
        try {
          const res = await fetch('/users', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username, password, isAdmin }) });
          if (res.status === 401) { location.href = '/login'; return; }
          if (res.ok) {
            $('out').textContent = copy.usersAdded;
            if ($('username').value.trim() === username) $('username').value = '';
            if ($('password').value === password) $('password').value = '';
            if ($('isAdmin').checked === isAdmin) $('isAdmin').checked = false;
            await load();
          } else {
            const r = await res.json().catch(() => ({}));
            const error = typeof r.error === 'string' ? r.error : '';
            $('out').textContent = '';
            if (res.status === 409) AdminField.invalid($('username'), 'This username is already taken.', { focus: false });
            else if (error.startsWith('username')) AdminField.invalid($('username'), USERNAME_RULE, { focus: false });
            else if (error.startsWith('password')) AdminField.invalid($('password'), PASSWORD_RULE, { focus: false });
            else $('out').textContent = error ? refusal('add the user', error) : copy.usersActionFailed.replace('{status}', String(res.status));
          }
        } catch {
          $('out').textContent = copy.usersAddNetworkFailed;
        } finally {
          $('add').disabled = false;
          restore();
        }
      });
      $('pwForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if ($('changepw').disabled) return;
        const currentPassword = $('curpw').value;
        const newPassword = $('newpw').value;
        if (!currentPassword || !newPassword) { $('pwout').textContent = copy.usersPasswordRequired; return; }
        if (newPassword.length < MIN_PASSWORD) { AdminField.invalid($('newpw'), PASSWORD_RULE); return; }
        const restore = AdminFocus.hold($('changepw'));
        $('changepw').disabled = true;
        $('pwout').textContent = copy.usersPasswordChanging;
        try {
          const res = await fetch('/users/me/password', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ currentPassword, newPassword }) });
          if (res.status === 401) { location.href = '/login'; return; }
          if (res.ok) {
            $('pwout').textContent = copy.usersPasswordChanged;
            if ($('curpw').value === currentPassword) $('curpw').value = '';
            if ($('newpw').value === newPassword) $('newpw').value = '';
          } else {
            const r = await res.json().catch(() => ({}));
            const error = typeof r.error === 'string' ? r.error : '';
            $('pwout').textContent = '';
            if (error === 'current password is incorrect') AdminField.invalid($('curpw'), 'The current password is incorrect.', { focus: false });
            else if (error.startsWith('new password')) AdminField.invalid($('newpw'), PASSWORD_RULE, { focus: false });
            else if (res.status === 429) $('pwout').textContent = 'Too many attempts. Wait a moment and try again.';
            else $('pwout').textContent = error ? refusal('change the password', error) : copy.usersActionFailed.replace('{status}', String(res.status));
          }
        } catch {
          $('pwout').textContent = copy.usersPasswordNetworkFailed;
        } finally {
          $('changepw').disabled = false;
          restore();
        }
      });
      (async () => {
        me = await Auth.ensureAuthed({ admin: true });
        if (!me) return;
        Auth.renderHeader(me);
        load();
      })();
    </script>
  </body>
</html>
