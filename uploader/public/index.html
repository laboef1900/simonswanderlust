<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <nav id="mainnav" aria-label="Admin"></nav>
        <p class="eyebrow">Expedition Log · Image Station</p>
        <h1>Desk</h1>
        <p class="lede">What to write, what still needs publishing, and whether photos are still encoding.</p>
        <p class="muted" id="whoami"></p>
      </div>
    </header>

    <main>
      <p id="deskStatus" class="muted" role="status"></p>
      <p id="deskError" class="err" role="alert" hidden></p>

      <section class="desk-next" aria-labelledby="deskNextHeading">
        <h2 id="deskNextHeading" class="desk-heading">Next to write</h2>
        <div id="deskNext"></div>
      </section>

      <section class="desk-list-block" aria-labelledby="deskUnpubHeading">
        <h2 id="deskUnpubHeading" class="desk-heading">Unpublished changes</h2>
        <div id="deskUnpub"></div>
      </section>

      <section class="desk-meta" aria-labelledby="deskMetaHeading">
        <h2 id="deskMetaHeading" class="desk-heading">Site</h2>
        <ul id="deskMeta" class="desk-meta-list"></ul>
      </section>
    </main>

    <script src="/admin/auth.js"></script>
    <script src="/admin/posts-filter.js"></script>
    <script src="/admin/desk.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);

      function say(msg) { $('deskStatus').textContent = msg; }
      function fail(msg) {
        const el = $('deskError');
        el.hidden = !msg;
        el.textContent = msg || '';
      }

      function editorHref(tk) {
        return '/admin/editor.html?tk=' + encodeURIComponent(tk);
      }

      function el(tag, className) {
        const n = document.createElement(tag);
        if (className) n.className = className;
        return n;
      }

      function tripLink(post, label) {
        const a = el('a', 'desk-title');
        a.href = editorHref(post.translationKey);
        a.textContent = label || post.titleDe || '(untitled)';
        return a;
      }

      function heroFigure(post) {
        const url = PostsFilter.thumbUrl(post);
        if (!url) {
          const ph = el('div', 'desk-hero thumb-placeholder');
          ph.setAttribute('aria-hidden', 'true');
          return ph;
        }
        const img = el('img', 'desk-hero');
        img.src = url;
        img.alt = '';
        img.addEventListener('error', () => {
          img.replaceWith(el('div', 'desk-hero thumb-placeholder'));
        });
        return img;
      }

      function renderNext(post) {
        const root = $('deskNext');
        root.textContent = '';
        if (!post) {
          const empty = el('div', 'desk-empty');
          const p = el('p');
          p.textContent = 'No drafts. The next trip starts as a DE/EN pair — photos live in Media.';
          const cta = el('a', 'btn-new');
          cta.href = '/admin/editor.html';
          cta.textContent = 'New trip';
          empty.appendChild(p);
          empty.appendChild(cta);
          root.appendChild(empty);
          return;
        }
        const card = el('article', 'desk-next-card');
        card.appendChild(heroFigure(post));
        const body = el('div', 'desk-next-body');
        body.appendChild(tripLink(post));
        const meta = el('p', 'muted');
        const bits = [post.country, post.region, post.hasEnBody ? 'DE + EN' : 'DE only'].filter(Boolean);
        meta.textContent = bits.join(' · ');
        body.appendChild(meta);
        const open = el('a', 'action-link');
        open.href = editorHref(post.translationKey);
        open.textContent = 'Continue editing';
        body.appendChild(open);
        card.appendChild(body);
        root.appendChild(card);
      }

      function renderUnpub(posts) {
        const root = $('deskUnpub');
        root.textContent = '';
        if (!posts.length) {
          const p = el('p', 'muted');
          p.textContent = 'Every published trip matches what’s live. Edit a post, then Publish when the pair is ready.';
          root.appendChild(p);
          return;
        }
        const ul = el('ul', 'desk-unpub');
        posts.forEach((post) => {
          const li = el('li');
          li.appendChild(tripLink(post));
          const go = el('a', 'action-link');
          go.href = editorHref(post.translationKey);
          go.textContent = 'Review & publish';
          li.appendChild(go);
          ul.appendChild(li);
        });
        root.appendChild(ul);
      }

      function renderMeta(encode, release) {
        const ul = $('deskMeta');
        ul.textContent = '';
        const encodeLi = el('li');
        if (encode > 0) {
          const a = el('a', 'action-link');
          a.href = '/admin/media.html';
          a.textContent = encode === 1
            ? '1 photo is still encoding — publish will wait for it'
            : encode + ' photos are still encoding — publish will wait for them';
          encodeLi.appendChild(a);
        } else {
          encodeLi.textContent = 'Photo encode queue is idle.';
        }
        ul.appendChild(encodeLi);

        const relLi = el('li');
        if (release) {
          const a = el('a', 'action-link');
          a.href = '/';
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'Live site has a current release';
          relLi.appendChild(a);
        } else {
          relLi.textContent = 'No live release yet — Publish a trip or rebuild from Settings.';
        }
        ul.appendChild(relLi);
      }

      async function loadDesk() {
        fail('');
        say('Loading…');
        try {
          const [postsRes, queueRes, healthRes] = await Promise.all([
            fetch('/posts'),
            fetch('/media/queue'),
            fetch('/health'),
          ]);
          if (postsRes.status === 401 || queueRes.status === 401) {
            location.href = '/login?next=' + encodeURIComponent(location.pathname);
            return;
          }
          if (!postsRes.ok) throw new Error('posts ' + postsRes.status);
          const posts = await postsRes.json();
          const queue = queueRes.ok ? await queueRes.json() : { pending: 0, running: 0 };
          const health = healthRes.ok ? await healthRes.json() : {};
          renderNext(Desk.nextDraft(posts));
          renderUnpub(Desk.unpublished(posts));
          renderMeta(Desk.encodeCount(queue), !!health.release);
          say('');
        } catch (e) {
          say('');
          fail('Could not load the desk: ' + e);
          $('deskNext').textContent = '';
          $('deskUnpub').textContent = '';
          $('deskMeta').textContent = '';
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.className = 'btn-secondary';
          retry.textContent = 'Try again';
          retry.addEventListener('click', loadDesk);
          $('deskError').appendChild(document.createTextNode(' '));
          $('deskError').appendChild(retry);
        }
      }

      (async () => {
        const s = await Auth.ensureAuthed();
        if (!s) return;
        Auth.renderHeader(s);
        await loadDesk();
      })();
    </script>
  </body>
</html>
