<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk · Simon's Wanderlust</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Desk</h1>
      <p class="lede">What to write, what still needs publishing, and whether photos are still encoding.</p>
    </header>

    <main>
      <p id="deskStatus" class="muted" role="status"></p>
      <p id="deskError" class="err" role="alert" hidden></p>

      <section class="desk-next" aria-labelledby="deskNextHeading">
        <h2 id="deskNextHeading" class="desk-heading">Most recently edited draft</h2>
        <div id="deskNext" aria-live="polite"></div>
      </section>

      <section class="desk-list-block" aria-labelledby="deskUnpubHeading">
        <h2 id="deskUnpubHeading" class="desk-heading">Unpublished changes</h2>
        <div id="deskUnpub" aria-live="polite"></div>
      </section>

      <section class="desk-meta" aria-labelledby="deskMetaHeading">
        <h2 id="deskMetaHeading" class="desk-heading">Site</h2>
        <ul class="desk-meta-list">
          <li id="deskQueue" aria-live="polite"></li>
          <li id="deskRelease" aria-live="polite"></li>
        </ul>
      </section>
    </main>

    <script src="/admin/auth.js"></script>
    <script src="/admin/posts-filter.js"></script>
    <script src="/admin/desk.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let redirecting = false;

      function say(msg) { $('deskStatus').textContent = msg; }

      function editorHref(tk) {
        return '/admin/editor.html?tk=' + encodeURIComponent(tk);
      }

      function el(tag, className) {
        const n = document.createElement(tag);
        if (className) n.className = className;
        return n;
      }

      function setMessage(root, text) {
        root.textContent = '';
        const p = el('p', 'muted');
        p.textContent = text;
        root.appendChild(p);
      }

      function showUnavailable(root, message, retryLabel, retry) {
        root.textContent = '';
        const p = el('p', 'err');
        p.textContent = message;
        const button = el('button', 'btn-secondary');
        button.type = 'button';
        button.textContent = retryLabel;
        button.addEventListener('click', retry);
        root.appendChild(p);
        root.appendChild(button);
      }

      function redirectToLogin() {
        redirecting = true;
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
      }

      async function responseJson(response, requiresSession) {
        if (requiresSession && response.status === 401) {
          redirectToLogin();
          throw new Error('redirecting');
        }
        if (!response.ok) throw new Error('unavailable');
        return response.json();
      }

      function tripLink(post, label) {
        const a = el('a', 'desk-title');
        a.href = editorHref(post.translationKey);
        a.textContent = label || post.titleDe || '(German title not set)';
        return a;
      }

      function heroFigure(post) {
        const url = PostsFilter.thumbUrl(post);
        if (!url) {
          const ph = el('div', 'desk-hero thumb-placeholder');
          ph.setAttribute('aria-hidden', 'true');
          return ph;
        }
        const img = el('img', 'desk-hero');
        img.src = url;
        img.alt = '';
        img.addEventListener('error', () => {
          img.replaceWith(el('div', 'desk-hero thumb-placeholder'));
        });
        return img;
      }

      function renderNext(post) {
        const root = $('deskNext');
        root.textContent = '';
        if (!post) {
          const empty = el('div', 'desk-empty');
          const p = el('p');
          p.textContent = 'No draft pairs are saved. A new trip starts as a German and English pair.';
          const cta = el('a', 'btn-new');
          cta.href = '/admin/editor.html';
          cta.textContent = 'New trip';
          empty.appendChild(p);
          empty.appendChild(cta);
          root.appendChild(empty);
          return;
        }
        const card = el('article', 'desk-next-card');
        card.appendChild(heroFigure(post));
        const body = el('div', 'desk-next-body');
        body.appendChild(tripLink(post));
        const meta = el('p', 'muted');
        const bits = [
          post.country,
          post.region,
          Desk.englishBodyLabel(post.hasEnBody),
        ].filter(Boolean);
        const edited = Desk.formatUpdatedAt(post.updatedAt);
        if (edited) bits.push('Last edited ' + edited);
        meta.textContent = bits.join(' · ');
        body.appendChild(meta);
        const open = el('a', 'action-link');
        open.href = editorHref(post.translationKey);
        open.textContent = 'Continue editing';
        body.appendChild(open);
        card.appendChild(body);
        root.appendChild(card);
      }

      function renderUnpub(posts) {
        const root = $('deskUnpub');
        root.textContent = '';
        if (!posts.length) {
          const p = el('p', 'muted');
          p.textContent = 'Published trips have no saved changes waiting for the next publish.';
          root.appendChild(p);
          return;
        }
        const ul = el('ul', 'desk-unpub');
        posts.forEach((post) => {
          const li = el('li');
          li.appendChild(tripLink(post));
          const go = el('a', 'action-link');
          go.href = editorHref(post.translationKey);
          go.textContent = 'Review changes';
          li.appendChild(go);
          ul.appendChild(li);
        });
        root.appendChild(ul);
      }

      function renderPostsLoading() {
        setMessage($('deskNext'), 'Loading drafts…');
        setMessage($('deskUnpub'), 'Loading unpublished changes…');
      }

      function renderPostsUnavailable() {
        if (redirecting) return;
        showUnavailable($('deskNext'), 'Drafts are unavailable right now.', 'Retry drafts', loadPosts);
        showUnavailable(
          $('deskUnpub'),
          'Unpublished changes are unavailable right now.',
          'Retry unpublished changes',
          loadPosts,
        );
      }

      function renderQueue(count) {
        const root = $('deskQueue');
        root.textContent = '';
        if (count > 0) {
          const a = el('a', 'action-link');
          a.href = '/admin/media.html';
          a.textContent = count === 1
            ? '1 photo is in the processing queue'
            : count + ' photos are in the processing queue';
          root.appendChild(a);
        } else {
          root.textContent = 'Photo processing queue is idle.';
        }
      }

      function renderRelease(release) {
        const root = $('deskRelease');
        root.textContent = '';
        if (release) {
          const a = el('a', 'action-link');
          a.href = '/';
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'View live site';
          root.appendChild(a);
        } else {
          root.textContent = 'No live release yet — publish a trip or rebuild from Settings.';
        }
      }

      const loadPosts = Desk.resilientLoader(
        async () => {
          const posts = await responseJson(await fetch('/posts'), true);
          if (!Array.isArray(posts)) throw new Error('unavailable');
          return posts;
        },
        {
          loading: renderPostsLoading,
          ready(posts) {
            if (redirecting) return;
            renderNext(Desk.nextDraft(posts));
            renderUnpub(Desk.unpublished(posts));
          },
          unavailable: renderPostsUnavailable,
        },
      );

      const loadQueue = Desk.resilientLoader(
        async () => {
          const queue = await responseJson(await fetch('/media/queue'), true);
          const count = Desk.encodeCount(queue);
          if (count === null) throw new Error('unavailable');
          return count;
        },
        {
          loading() { setMessage($('deskQueue'), 'Loading photo processing status…'); },
          ready(count) { if (!redirecting) renderQueue(count); },
          unavailable() {
            if (!redirecting) {
              showUnavailable(
                $('deskQueue'),
                'Photo processing status is unavailable right now.',
                'Retry processing status',
                loadQueue,
              );
            }
          },
        },
      );

      const loadRelease = Desk.resilientLoader(
        async () => {
          return Desk.releaseFromResponse(await fetch('/health'));
        },
        {
          loading() { setMessage($('deskRelease'), 'Loading live site status…'); },
          ready(release) { if (!redirecting) renderRelease(release); },
          unavailable() {
            if (!redirecting) {
              showUnavailable(
                $('deskRelease'),
                'Live site status is unavailable right now.',
                'Retry live site status',
                loadRelease,
              );
            }
          },
        },
      );

      async function loadDesk() {
        $('deskError').hidden = true;
        $('deskError').textContent = '';
        say('Loading desk…');
        await Promise.all([loadPosts(), loadQueue(), loadRelease()]);
        if (!redirecting) say('');
      }

      (async () => {
        const s = await Auth.ensureAuthed();
        if (!s) return;
        Auth.renderHeader(s);
        await loadDesk();
      })();
    </script>
  </body>
</html>
