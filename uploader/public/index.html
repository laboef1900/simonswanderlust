<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desk</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <link rel="stylesheet" href="/admin/onboarding.css" />
  </head>
  <body>
    <header class="cms-page-meta">
      <h1>Desk</h1>
      <p class="lede">What to write, what still needs publishing, and whether photos are still encoding.</p>
      <div id="onboardingOpener" class="cms-page-actions" hidden></div>
    </header>

    <main>
      <p id="deskStatus" class="muted" role="status"></p>
      <div id="deskError" class="err" role="alert" hidden></div>
      <p id="publicationNotice" role="status"></p>
      <button id="publicationRefresh" class="btn-secondary" type="button"></button>
      <section id="onboardingChecklist" hidden></section>

      <section aria-labelledby="deskNextHeading">
        <h2 id="deskNextHeading" class="desk-heading">Most recently edited draft</h2>
        <div id="deskNext" aria-live="polite"></div>
      </section>

      <section class="desk-list-block" aria-labelledby="deskUnpubHeading">
        <h2 id="deskUnpubHeading" class="desk-heading"></h2>
        <div id="deskUnpub" aria-live="polite"></div>
      </section>
      <section id="deskAttentionSection" class="desk-list-block" hidden>
        <h2 id="deskAttentionHeading" class="desk-heading"></h2>
        <div id="deskAttention" aria-live="polite"></div>
      </section>

      <section class="desk-meta" aria-labelledby="deskMetaHeading">
        <h2 id="deskMetaHeading" class="desk-heading">Site</h2>
        <ul class="desk-meta-list">
          <li id="deskQueue" aria-live="polite"></li>
          <li id="deskRelease" aria-live="polite"></li>
          <li id="deskBuild" role="status" hidden></li>
          <li id="deskPublicationSummary" role="status" hidden></li>
          <li id="deskRebuildLink" hidden>
            <button class="btn-primary" type="button" id="deskRebuild"></button>
            <p id="deskRebuildOutcome" role="status"></p>
          </li>
        </ul>
      </section>
    </main>

    <script src="/admin/editor-image-copy.js"></script>
    <script src="/admin/build-reporting.js"></script>
    <script src="/admin/publication-state.js"></script>
    <script src="/admin/publication-refresh.js"></script>
    <script src="/admin/auth.js"></script>
    <script src="/admin/language.js"></script>
    <script src="/admin/posts-filter.js"></script>
    <script src="/admin/desk.js"></script>
    <script src="/admin/admin-confirm.js"></script>
    <script src="/admin/onboarding.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let redirecting = false;
      let isAdmin = false;
      let authenticatedContext = null;
      const copy = EditorCopy[document.documentElement.lang === 'de' ? 'de' : 'en'];
      let observedPosts = [];
      let observedBuild = null;
      $('deskUnpubHeading').textContent = PublicationState.text('heading');
      $('deskAttentionHeading').textContent = PublicationState.text('attention');
      $('publicationRefresh').textContent = PublicationState.text('refresh');
      $('deskRebuild').textContent = PublicationState.text('rebuild');

      function say(msg) { $('deskStatus').textContent = msg; }

      function editorHref(tk) {
        return '/admin/editor.html?tk=' + encodeURIComponent(tk);
      }

      function el(tag, className) {
        const n = document.createElement(tag);
        if (className) n.className = className;
        return n;
      }

      function setMessage(root, text) {
        root.textContent = '';
        const p = el('p', 'muted');
        p.textContent = text;
        root.appendChild(p);
      }

      function showUnavailable(root, message, retryLabel, retry) {
        root.textContent = '';
        const p = el('p', 'err');
        p.textContent = message;
        const button = el('button', 'btn-secondary');
        button.type = 'button';
        button.textContent = retryLabel;
        button.addEventListener('click', retry);
        root.appendChild(p);
        root.appendChild(button);
      }

      function redirectToLogin() {
        redirecting = true;
        location.href = '/login?next=' + encodeURIComponent(location.pathname);
      }

      async function responseJson(response, requiresSession) {
        if (requiresSession && response.status === 401) {
          redirectToLogin();
          throw new Error('redirecting');
        }
        if (!response.ok) throw new Error('unavailable');
        return response.json();
      }

      function tripLink(post, label) {
        const a = el('a', 'desk-title');
        a.href = editorHref(post.translationKey);
        a.textContent = label || post.title || SiteLanguage.text('Untitled');
        return a;
      }

      function heroFigure(post) {
        const url = PostsFilter.thumbUrl(post);
        if (!url) {
          const ph = el('div', 'desk-hero thumb-placeholder');
          ph.setAttribute('aria-hidden', 'true');
          return ph;
        }
        const img = el('img', 'desk-hero');
        img.src = url;
        img.alt = '';
        img.addEventListener('error', () => {
          img.replaceWith(el('div', 'desk-hero thumb-placeholder'));
        });
        return img;
      }

      function renderNext(post) {
        const root = $('deskNext');
        root.textContent = '';
        if (!post) {
          const empty = el('div', 'desk-empty');
          const p = el('p');
          p.textContent = copy.deskNoDrafts;
          const cta = el('a', 'btn-new');
          cta.href = '/admin/editor.html';
          cta.textContent = 'New trip';
          empty.appendChild(p);
          empty.appendChild(cta);
          root.appendChild(empty);
          return;
        }
        const card = el('article', 'desk-next-card');
        card.appendChild(heroFigure(post));
        const body = el('div', 'desk-next-body');
        body.appendChild(tripLink(post));
        const meta = el('p', 'muted');
        const bits = [
          post.country,
          post.region,
          Desk.secondaryBodyLabel(post.secondaryStatus, SiteLanguage.config()),
        ].filter(Boolean);
        const edited = Desk.formatUpdatedAt(post.updatedAt);
        if (edited) bits.push('Last edited ' + edited);
        meta.textContent = bits.join(' · ');
        body.appendChild(meta);
        const publication = el('p', 'muted');
        publication.textContent = PublicationState.label(post.publication, isAdmin);
        body.appendChild(publication);
        const open = el('a', 'action-link');
        open.href = editorHref(post.translationKey);
        open.textContent = 'Continue editing';
        body.appendChild(open);
        card.appendChild(body);
        root.appendChild(card);
      }

      function renderUnpub(posts, root = $('deskUnpub'), attention = false) {
        root.textContent = '';
        if (!posts.length) {
          const p = el('p', 'muted');
          p.textContent = PublicationState.text(attention ? 'attentionEmpty' : 'empty');
          root.appendChild(p);
          return;
        }
        const ul = el('ul', 'desk-unpub');
        posts.forEach((post) => {
          const li = el('li');
          li.appendChild(tripLink(post));
          const publication = el('p', 'muted');
          publication.textContent = PublicationState.label(post.publication, isAdmin);
          li.appendChild(publication);
          const qualifier = isAdmin ? PublicationState.qualifiers(post.publication, observedBuild) : '';
          if (qualifier) {
            const detail = el('p', 'muted');
            detail.textContent = qualifier;
            li.appendChild(detail);
          }
          const go = el('a', 'action-link');
          go.href = editorHref(post.translationKey);
          go.textContent = 'Review changes';
          li.appendChild(go);
          ul.appendChild(li);
        });
        root.appendChild(ul);
      }

      function renderObservedPosts() {
        const focused = document.activeElement;
        const roots = [$('deskNext'), $('deskUnpub'), ...(isAdmin ? [$('deskAttention')] : [])];
        const focusRoot = roots.find((root) => root.contains(focused));
        const identity = focusRoot && focused.tagName === 'A'
          ? { href: focused.href, className: focused.className } : null;
        const unavailable = observedPosts.some((post) => PublicationState.publicationState(post.publication) === 'unavailable');
        const next = Desk.nextDraft(observedPosts);
        const newer = Desk.unpublished(observedPosts);
        const attention = Desk.attention(observedPosts);
        if (!next && unavailable) setMessage($('deskNext'), PublicationState.text('unavailable'));
        else renderNext(next);
        if (!newer.length && unavailable) setMessage($('deskUnpub'), PublicationState.text('unavailable'));
        else renderUnpub(newer);
        if (isAdmin) {
          if (!attention.length && unavailable) setMessage($('deskAttention'), PublicationState.text('unavailable'));
          else renderUnpub(attention, $('deskAttention'), true);
        }
        $('publicationNotice').textContent = unavailable ? PublicationState.text('unavailable') : '';
        if (identity) {
          const links = [focusRoot, ...roots.filter((root) => root !== focusRoot)]
            .flatMap((root) => Array.from(root.querySelectorAll('a')));
          const nextFocus = links.find((link) => link.href === identity.href && link.className === identity.className)
            || links.find((link) => link.href === identity.href);
          // Keep an unchanged section steady; reveal cross-section or missing-link fallbacks.
          (nextFocus || $('publicationRefresh')).focus({ preventScroll: !!nextFocus && focusRoot.contains(nextFocus) });
        }
      }

      function renderQueue(count) {
        const root = $('deskQueue');
        root.textContent = '';
        if (count > 0) {
          const a = el('a', 'action-link');
          a.href = '/admin/media.html';
          a.textContent = count === 1
            ? '1 photo is in the processing queue'
            : count + ' photos are in the processing queue';
          root.appendChild(a);
        } else {
          root.textContent = 'Photo processing queue is idle.';
        }
      }

      function renderRelease(release) {
        const root = $('deskRelease');
        root.textContent = '';
        if (release) {
          const a = el('a', 'action-link');
          a.href = '/';
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = 'View live site';
          root.appendChild(a);
        } else {
          root.textContent = authenticatedContext.isAdmin ? copy.deskNoReleaseAdmin : copy.deskNoReleaseAuthor;
        }
      }

      const publicationRefresh = PublicationRefresh.create({
        async read(signal, publish) {
          const observed = { posts: null, summary: null, status: null };
          const report = () => { if (observed.posts) publish({ ...observed }); };
          const optional = (url, field) => PublicationRefresh.json(url, signal).catch((error) => {
            if (error.status === 401) throw error;
            return null;
          }).then((value) => { observed[field] = value; report(); });
          await Promise.all([
            PublicationRefresh.json('/posts', signal).then((posts) => {
              if (!Array.isArray(posts)) throw new Error('invalid_posts');
              observed.posts = posts; report();
            }),
            isAdmin ? optional('/publication/summary', 'summary') : null,
            isAdmin ? optional('/rebuild/status', 'status') : null,
          ]);
          return observed;
        },
        apply({ posts, summary, status }) {
          observedPosts = posts;
          observedBuild = status;
          renderObservedPosts();
          if (isAdmin) {
            $('deskPublicationSummary').textContent = PublicationState.summary(summary);
            if (status) BuildReporting.renderStatus($('deskBuild'), status);
            else $('deskBuild').textContent = BuildReporting.text('unavailable');
          }
        },
        unavailable() {
          // Keep the last story links; none is a mutation control or fresh liveness claim.
          document.querySelectorAll('#deskNext .muted, #deskUnpub .muted, #deskAttention .muted')
            .forEach((node) => { node.textContent = PublicationState.text('unavailable'); });
          $('publicationNotice').textContent = PublicationState.text('stale');
          if (isAdmin) {
            $('deskPublicationSummary').textContent = PublicationState.text('summaryUnavailable');
            $('deskBuild').textContent = BuildReporting.text('unavailable');
          }
        },
        unauthorized: redirectToLogin,
      });
      $('publicationRefresh').addEventListener('click', () => publicationRefresh.refresh());
      $('deskRebuild').addEventListener('click', async () => {
        if (!isAdmin || $('deskRebuild').disabled) return;
        if (!await AdminConfirm.ask({
          title: PublicationState.text('rebuildConfirm'),
          body: PublicationState.text('rebuildScope'),
          confirmLabel: PublicationState.text('rebuild'),
        })) return;
        $('deskRebuild').disabled = true;
        publicationRefresh.beginAction();
        try {
          const response = await fetch('/rebuild', { method: 'POST' });
          if (response.status === 401) { redirectToLogin(); return; }
          const result = await response.json();
          if (response.ok && typeof result.ok === 'boolean') BuildReporting.renderOutcome($('deskRebuildOutcome'), 'rebuild', result);
          else $('deskRebuildOutcome').textContent = BuildReporting.text('unknown');
        } catch {
          $('deskRebuildOutcome').textContent = BuildReporting.text('unknown');
        } finally {
          $('deskRebuild').disabled = false;
          publicationRefresh.endAction();
        }
      });

      const loadQueue = Desk.resilientLoader(
        async () => {
          const queue = await responseJson(await fetch('/media/queue'), true);
          const count = Desk.encodeCount(queue);
          if (count === null) throw new Error('unavailable');
          return count;
        },
        {
          loading() { setMessage($('deskQueue'), 'Loading photo processing status…'); },
          ready(count) { if (!redirecting) renderQueue(count); },
          unavailable() {
            if (!redirecting) {
              showUnavailable(
                $('deskQueue'),
                'Photo processing status is unavailable right now.',
                'Retry processing status',
                loadQueue,
              );
            }
          },
        },
      );

      const loadRelease = Desk.resilientLoader(
        async () => {
          return Desk.releaseFromResponse(await fetch('/health'));
        },
        {
          loading() { setMessage($('deskRelease'), 'Loading live site status…'); },
          ready(release) { if (!redirecting) renderRelease(release); },
          unavailable() {
            if (!redirecting) {
              showUnavailable(
                $('deskRelease'),
                'Live site status is unavailable right now.',
                'Retry live site status',
                loadRelease,
              );
            }
          },
        },
      );

      function loadPosts() { return publicationRefresh.refresh(); }

      async function loadDesk() {
        $('deskError').hidden = true;
        $('deskError').textContent = '';
        say('Loading desk…');
        publicationRefresh.start();
        await Promise.all([loadPosts(), loadQueue(), loadRelease()]);
        if (!redirecting) say('');
      }

      const openDesk = Desk.resilientLoader(async () => {
        const context = await Auth.ensureAuthed();
        if (context) await SiteLanguage.get();
        return context;
      }, {
        loading() { $('deskError').hidden = true; },
        async ready(context) {
          if (!context) return;
          authenticatedContext = context;
          Auth.renderHeader(context);
          isAdmin = context.isAdmin === true;
          $('deskBuild').hidden = !isAdmin;
          $('deskAttentionSection').hidden = !isAdmin;
          $('deskPublicationSummary').hidden = !isAdmin;
          $('deskRebuildLink').hidden = !isAdmin;
          Onboarding.init({
            root: $('onboardingChecklist'),
            openerRoot: $('onboardingOpener'),
            isAdmin: context.isAdmin,
            focusTarget: document.querySelector('.cms-page-title'),
          });
          try { await SiteLanguage.get(); }
          catch (error) { $('deskError').hidden = false; $('deskError').textContent = error.message; return; }
          await loadDesk();
        },
        unavailable() {
          $('deskError').hidden = false;
          showUnavailable($('deskError'), copy.authContextUnavailable, copy.authContextRetry, openDesk);
        },
      });
      openDesk();
    </script>
  </body>
</html>
