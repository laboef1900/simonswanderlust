# Automated Verification Loop on every PR and push to main (see CLAUDE.md):
# type-check + tests for both apps. A throwaway Postgres service container
# backs the integration suites and the site's Content Layer loader.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  uploader:
    name: uploader · typecheck + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: uploader/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # TEST_DATABASE_URL un-skips the pg/pages/backup integration suites
      # (serialized against the shared DB by vitest.config.ts's integration
      # project; unit suites keep full file parallelism).
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  site:
    name: site · tests + astro check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            uploader/package-lock.json
      - run: npm ci
        working-directory: site
      # The Content Layer loader queries Postgres during astro check, so
      # bootstrap the schema first via the uploader's db module. The script
      # only needs pg (+ tsx to run TS) — skip the full uploader install.
      - run: npm install --no-save pg tsx
        working-directory: uploader
      - run: npx tsx scripts/ci-ensure-schema.ts
        working-directory: uploader
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      - run: npm test
        working-directory: site
      - run: npx astro check
        working-directory: site
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      # Full build: Astro 7's Rust compiler enforces rules (e.g. unclosed
      # tags) at build time that astro check does not catch.
      - run: npm run build
        working-directory: site
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
