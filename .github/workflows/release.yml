name: Build, qualify and publish release

# Stable tags promote only the exact native images that passed qualification.
# Candidate tags are staging references, never deployment/version tags.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/laboef1900/wanderlust-studio

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node .github/release/eligibility.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  candidate:
    needs: eligibility
    name: qualify native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ github.sha }}
      FIXTURE_PREFIX: swl_305_package_${{ matrix.arch }}_${{ github.run_id }}_${{ github.run_attempt }}
      CANDIDATE: ghcr.io/laboef1900/wanderlust-studio:candidate-${{ github.sha }}-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Prepare private fixture and authenticate image pulls
        env:
          DHI_USERNAME: ${{ vars.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          umask 077
          export PRIVATE_ROOT="$RUNNER_TEMP/release-$GITHUB_RUN_ID-$ARCH"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-$GITHUB_RUN_ID-$ARCH"
          printf 'PRIVATE_ROOT=%s\nDOCKER_CONFIG=%s\n' "$PRIVATE_ROOT" "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -m 700 "$PRIVATE_ROOT" "$DOCKER_CONFIG"
          test -n "$DHI_USERNAME" && test -n "$DHI_TOKEN"
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
      - name: Build candidate once on native architecture
        run: |
          docker build --platform="linux/$ARCH" \
            --build-arg "SOURCE_REPOSITORY=$GITHUB_REPOSITORY" \
            --build-arg "SOURCE_REVISION=$SOURCE_SHA" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --tag "$CANDIDATE" . > "$PRIVATE_ROOT/build.log" 2>&1
      - name: Discard image-pull credential
        if: always()
        run: docker logout dhi.io
      - name: Qualify packaged ownership and legal assets
        run: bash .github/release/qualify.sh
      - name: Stage qualified image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$CANDIDATE"
          mkdir -p "$PRIVATE_ROOT/digest"
          docker image inspect "$CANDIDATE" --format '{{json .RepoDigests}}' \
            | node .github/release/record-digest.mjs > "$PRIVATE_ROOT/digest/$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-digest-${{ matrix.arch }}
          path: ${{ env.PRIVATE_ROOT }}/digest/
          if-no-files-found: error
          retention-days: 7
      - name: Stop owned fixture and discard credentials
        if: always()
        run: |
          if docker container inspect "${FIXTURE_PREFIX}_pg" >/dev/null 2>&1; then
            docker stop --time 10 "${FIXTURE_PREFIX}_pg"
          fi
          rm -rf -- "$DOCKER_CONFIG"

  release:
    name: Promote qualified digests and create release
    needs: [eligibility, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qualified-digest-*
          path: qualified-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Recheck eligibility and promote without rebuilding
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/release/eligibility.mjs
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          node .github/release/promote.mjs
      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: |
            ## Image and corresponding source

            Image digest: `${{ steps.promote.outputs.digest }}`.
            Source revision: `${{ github.sha }}`.
            [Download this revision's source](https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz)
            · [Browse source and build instructions](https://github.com/${{ github.repository }}/tree/${{ github.sha }}).

            This archive contains tracked repository files; any tracked stories/content
            remain excluded from the software license. It collects no deployed uploads,
            databases, settings or secrets. Dependency versions, upstream source directions,
            inspected base/native artifacts and notice limitations are recorded in
            `docs/third-party-inventory.json`, `docs/third-party-evidence.json` and
            `docs/third-party-image-evidence.json` at that revision and in the image's
            `/app/docs/`. License and notice texts are delivered through the static
            `/legal/` and `/admin/legal/` indexes. A project archive alone is not a claim
            that every native dependency's corresponding-source duties are fulfilled.

            Operators modifying this software must provide their actual version's
            Corresponding Source at no charge and update its static source directions;
            these upstream links do not describe uncommitted or private modifications.
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$RELEASE_BODY"
      - name: Discard registry credential
        if: always()
        run: docker logout ghcr.io
