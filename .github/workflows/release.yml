name: release

# Build and publish the app image to GHCR, and cut a GitHub Release,
# whenever a version tag (e.g. v0.2.0) is pushed.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to ghcr.io

jobs:
  images:
    name: build & push app
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Needed to pull the Docker Hardened Image base images used by the
      # Dockerfiles' NODE_BUILD/NODE_RUNTIME build-args below. Requires the repo
      # variable DHI_USERNAME (not sensitive) + secret DHI_TOKEN (a dhi.io access token).
      - name: Log in to dhi.io (Docker Hardened Images)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ vars.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/simonswanderlust-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NODE_BUILD=dhi.io/node:26-dev
            NODE_RUNTIME=dhi.io/node:26
            SOURCE_REPOSITORY=${{ github.repository }}
            SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Image and corresponding source

            Image digest: `${{ needs.images.outputs.digest }}`.
            Source revision: `${{ github.sha }}`.
            [Download this revision's source](https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz)
            · [Browse source and build instructions](https://github.com/${{ github.repository }}/tree/${{ github.sha }}).

            This archive contains tracked repository files; any tracked stories/content
            remain excluded from the software license. It collects no deployed uploads,
            databases, settings or secrets. Dependency versions, upstream source directions,
            inspected base/native artifacts and notice limitations are recorded in
            `docs/third-party-inventory.json`, `docs/third-party-evidence.json` and
            `docs/third-party-image-evidence.json` at that revision and in the image's
            `/app/docs/`. License and notice texts are delivered through the static
            `/legal/` and `/admin/legal/` indexes. A project archive alone is not a claim
            that every native dependency's corresponding-source duties are fulfilled.

            Operators modifying this software must provide their actual version's
            Corresponding Source at no charge and update its static source directions;
            these upstream links do not describe uncommitted or private modifications.
